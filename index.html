}

    --headlight: #f4ecc8; --tail: #6d1a1f; --rib: rgba(0, 0, 0, .22); --shade: rgba(0, 0, 0, .22); --box: #c9cdd2;

  }
}

  --bg: #101418; --surface: #171c21; --ink: #e4e9ec; --muted: #98a4ad; --line: #2b333a;

* { box-sizing: border-box; }
[hidden] { display: none !important; }

.seg { display: inline-flex; }

.ramp-wrap { display: grid; gap: 2px; direction: ltr; }
.ramp { width: 150px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, var(--sp1) 0%, var(--sp1) 25%, var(--sp2) 37.5%, var(--sp3) 50%, var(--sp4) 62.5%, var(--sp5) 75%, var(--sp5) 100%); }

  method: crit => `
    <div>
      <h3>Ce qui est calculé</h3>
      <ul>
        <li><strong>Trafic.</strong> Chaque véhicule suit le modèle de poursuite IDM : il accélère vers sa vitesse désirée et freine pour garder un temps intervéhiculaire avec celui qui le précède. Les freinages, les files et leur résorption en découlent.</li>
        <li><strong>Mêmes arrivées partout.</strong> Les véhicules (instant, type, tempérament du conducteur) et les piétons sont tirés une seule fois, puis injectés à l’identique dans toutes les bandes. Les écarts entre bandes viennent donc de l’aménagement seul.</li>
        <li><strong>Piétons.</strong> Un piéton traverse quand le créneau suffit (temps de traversée + marge) ou quand un conducteur lui cède le passage. Chaque conducteur qui voit un piéton attendre décide une fois, tant qu’il peut encore s’arrêter à 3 m/s² ; sa probabilité de céder dépend de la vitesse qu’il aurait au passage. S’il voit le piéton trop tard, il ne cède pas. Un conducteur arrêté pour rien repart au bout de 8 s. Sans îlot, un piéton engagé sur la première voie impose l’arrêt sur la seconde si le véhicule peut s’arrêter à 3 m/s². Avec un îlot d’au moins 1,50 m, la traversée se fait en deux temps.</li>
        <li><strong>Gravité.</strong> Un piéton surgit à <em>D</em> mètres devant chaque véhicule : le conducteur réagit, puis freine à fond. La vitesse restante au moment du choc donne le risque de décès <span class="formula">P = 1 / (1 + e<sup>6,9 − 0,090 v</sup>)</span> (Rosén et Sander, 2009 ; v en km/h).</li>
        <li><strong>Évaluation.</strong> Les chiffres affichés sont la moyenne de cinq simulations d’une heure, avec des tirages différents mais fixés à l’avance. On ne peut donc pas choisir un tirage favorable.</li>
        <li><strong>Indicateurs.</strong> V85 mesurée au centre du passage. Temps de parcours compté depuis l’heure d’arrivée prévue, attente à l’entrée comprise. File : véhicules à moins de 8 km/h en amont du dispositif.</li>
      </ul>
    </div>
    <div>
      <h3>Ce qui est donné en entrée</h3>
      <ul>
        <li><strong>Vitesse de franchissement des ralentisseurs</strong> (V85 par classe). Aucun modèle de trafic ne la calcule : elle vient des mesures. Les valeurs proposées sont des ordres de grandeur à remplacer par des relevés sur des ouvrages comparables.</li>
        <li><strong>Chicane.</strong> Sa vitesse est déduite de la géométrie : rayon de la trajectoire la plus rapide <span class="formula">R = L² / (4 e<sub>eff</sub>)</span>, où <em>e<sub>eff</sub></em> est le décalage moins la marge latérale disponible dans la voie, puis <span class="formula">V = 8,76 R<sup>0,386</sup></span>.</li>
        <li><strong>Rétrécissement, revêtement, bandes rugueuses.</strong> Réduction de la vitesse désirée en pourcentage. Leur effet propre est faible et mal établi.</li>
        <li><strong>Feu piéton à la demande.</strong> Orange 3 s, rouge intégral 2 s, vert piéton 7 s, dégagement calculé à 1 m/s, rouge intégral 1 s. Conducteurs et piétons respectent le feu ; le feu ne modifie pas la vitesse désirée.</li>
        <li><strong>Probabilité de céder le passage.</strong> Elle baisse quand la vitesse monte, comme l’observent les études. La courbe retenue est une hypothèse à caler sur des comptages locaux.</li>
      </ul>
      <h3>Solution recommandée</h3>
      <p>${crit} La règle ne pondère pas les critères : la sécurité passe avant le temps de parcours, mais seulement parmi les solutions qui écoulent le trafic.</p>
      <h3>Limites</h3>
      <ul>
        <li>Tronçon isolé de 500 m : pas de report de trafic vers d’autres rues, pas de deux-roues.</li>
        <li>Le bruit, les vibrations et le confort des bus ne sont pas évalués.</li>
        <li>Le calibrage de référence reste un ordre de grandeur : l’administration qui diffuse l’outil doit le caler sur des mesures locales avant tout usage pour décider.</li>
        <li>En France, dos d’âne et ralentisseurs trapézoïdaux sont réservés aux voies d’agglomération limitées à 30 km/h et portant moins de 3 000 véh/j (décret 94-447, NF P 98-300). Ils figurent ici pour comparaison.</li>
        <li>Les vues 3D sont calculées par la bibliothèque three.js chargée depuis Internet ; hors connexion, la page fonctionne sans elles.</li>
      </ul>
    </div>
    <div>
      <h3>Sources</h3>
      <ol>${SOURCES}</ol>
    </div>`

/* ---------- demande commune ---------- */
class Demand {
  constructor(P) {
    this.P = P; this.nextId = 1;
    this.lanes = [0, 1].map(k => ({ r: mulberry32(P.seed * 1009 + 11 + k * 7919), list: [], tNext: 0 }));
    for (const ln of this.lanes) ln.tNext = this.headway(ln.r, 0) * ln.r();
    this.ped = { r: mulberry32(P.seed * 1009 + 5003), list: [], tNext: 0 };
    this.ped.tNext = this.pedGap(0);
  }
  // débit éventuellement variable dans le temps (journée simulée : P.qAt, P.pedAt)
  headway(r, t) { const q = this.P.qAt ? this.P.qAt(t) : this.P.q, m = 3600 / Math.max(1, q), hmin = Math.min(1, m); return hmin + (m - hmin) * -Math.log(1 - r()); }
  pedGap(t) {
    const q = this.P.pedAt ? this.P.pedAt(t) : this.P.qPed;
    return q > 0 ? -Math.log(1 - this.ped.r()) * 3600 / q : (this.P.pedAt ? 600 : Infinity);
  }
  veh(k, t) {
    const ln = this.lanes[k];
    while (ln.tNext <= t + 1) {
      const r = ln.r;
      ln.list.push({ id: this.nextId++, t: ln.tNext, pl: r() < this.P.pPL / 100, z: clampZ(gauss(r)) });
      ln.tNext += this.headway(r, ln.tNext);
    }
    return ln.list;
  }
  peds(t) {
    const p = this.ped;
    while (p.tNext <= t + 1) {
      const q = this.P.pedAt ? this.P.pedAt(p.tNext) : this.P.qPed;
      if (q > 0) p.list.push({ t: p.tNext, side: p.r() < 0.5 ? 0 : 1, xo: (p.r() - 0.5) * 2.6 });
      p.tNext += this.pedGap(p.tNext);
    }
    return p.list;
  }
}

/* ---------- scénarios (géométrie indépendante de la langue) ---------- */
function chicaneSpeed(P, wVeh) {
  const slack = Math.max(0, P.chLane - wVeh - 0.6);
  const eEff = Math.max(0.3, P.chOff - slack);
  const R = P.chTrans * P.chTrans / (4 * eEff);
  return { R, v: 8.76 * Math.pow(R, 0.3861) };
}
function buildScenarios(P) {
  const capZ = (xa, xb, vl, pl) => ({ xa, xb, kind: 'cap', VL: vl / KMH, PL: pl / KMH });
  const facZ = (xa, xb, p, lane) => ({ xa, xb, kind: 'fac', f: 1 - p / 100, lane });
  const W = P.laneW, flat = () => ({ yc: 0, lw: W, wi: 0 });
  const cVL = chicaneSpeed(P, CLS.VL.w), cPL = chicaneSpeed(P, CLS.PL.w), Lt = P.chTrans;
  const reg = 2 * P.q * 10 > 3000;   // heure de pointe ≈ 10 % du trafic journalier
  return [
    { id: 'ref', zones: [], geom: flat, feats: [], info: {} },
    { id: 'dos', reg, zones: [capZ(XC - 12, XC - 8, P.dosVL, P.dosPL), capZ(XC + 8, XC + 12, P.dosVL, P.dosPL)], geom: flat,
      feats: [{ t: 'hump', xa: XC - 12, xb: XC - 8 }, { t: 'hump', xa: XC + 8, xb: XC + 12 }], info: {} },
    { id: 'trap', reg, zones: [capZ(XC - 3.2, XC + 3.2, P.trapVL, P.trapPL)], geom: flat,
      feats: [{ t: 'table', xa: XC - 3.2, xb: XC + 3.2, ramp: 1.2, raised: false }], info: {} },
    { id: 'plat', zones: [capZ(XC - 5.5, XC + 5.5, P.platVL, P.platPL)], geom: flat,
      feats: [{ t: 'table', xa: XC - 5.5, xb: XC + 5.5, ramp: 1.5, raised: true }], info: {} },
    { id: 'cous', zones: [capZ(XC - 11.5, XC - 8.5, P.cousVL, P.cousPL), capZ(XC + 8.5, XC + 11.5, P.cousVL, P.cousPL)], geom: flat,
      feats: [{ t: 'cushion', xa: XC - 11.5, xb: XC - 8.5 }, { t: 'cushion', xa: XC + 8.5, xb: XC + 11.5 }], info: {} },
    { id: 'ret', zones: [facZ(XC - 15, XC + 15, P.retPct)],
      geom: x => { const r = bell(x, XC - 15, XC - 7, XC + 7, XC + 15); return { yc: 0, lw: W + (P.retLane - W) * r, wi: P.retIsl * r }; },
      feats: [{ t: 'island' }], info: { island: P.retIsl >= ISLAND_MIN } },
    { id: 'chi', zones: [capZ(XC - 5 - Lt, XC + 5 + Lt, cVL.v, cPL.v)],
      geom: x => { const r = bell(x, XC - 5 - Lt, XC - 5, XC + 5, XC + 5 + Lt); return { yc: -P.chOff / 2 + P.chOff * r, lw: W + (P.chLane - W) * r, wi: 0 }; },
      feats: [], info: { R: cVL.R, vVL: cVL.v, vPL: cPL.v } },
    { id: 'rev', zones: [facZ(XC - 20, XC + 20, P.revPct)], geom: flat, feats: [{ t: 'pave', xa: XC - 20, xb: XC + 20 }], info: {} },
    // bandes rugueuses : seulement sur la voie qui s'approche du passage
    { id: 'rug', zones: [facZ(XC - 62, XC - 2, P.rugPct, 0), facZ(XC + 2, XC + 62, P.rugPct, 1)], geom: flat,
      feats: [XC - 62, XC - 42, XC - 22].map(x0 => ({ t: 'rumble', lane: 0, x0 })).concat([XC + 18, XC + 38, XC + 58].map(x0 => ({ t: 'rumble', lane: 1, x0 }))), info: {} },
    // feu piéton : aucun effet sur la vitesse désirée ; le rouge arrête les véhicules
    { id: 'sig', signal: true, zones: [], geom: flat, feats: [{ t: 'signal' }], info: { clear: Math.ceil(2 * W / SIG.vClear) } }
  ];
}
const scName = sc => t('names')[sc.id];

const scDesc = sc => t('desc')[sc.id](P, sc.info);

/* ---------- apparence des véhicules (tirée de l'identifiant : même allure dans toutes les bandes) ---------- */
const PAINTS = ['#e9eaec', '#c5c9ce', '#8b9198', '#2d3137', '#21457c', '#8f222b', '#3f5e3c', '#d8cfbb', '#b8661f', '#4f6f8f'];
const CAR_STYLES = {
  berline:  { w0: 0.35, w1: 0.95, r0: -1.05, r1: 0.35, b0: -1.5, b1: -1.05 },
  citadine: { w0: 0.5, w1: 1.1, r0: -1.45, r1: 0.5, b0: -1.85, b1: -1.45 },
  fourgon:  { w0: 1.05, w1: 1.5, r0: -2.1, r1: 1.05, b0: null, b1: null }
};
function vehicleLook(rec) {
  const h = hash32(rec.id), r = h % 100;
  const style = rec.pl ? (r < 45 ? 'bus' : 'camion') : (r < 50 ? 'berline' : r < 82 ? 'citadine' : 'fourgon');
  return { style, paint: (h >>> 8) % PAINTS.length };
}

/* ---------- microsimulation ---------- */
function aInt(v, gap, vl) {
  if (gap <= 0.05) return -9;
  const ss = v.s0 + Math.max(0, v.v * v.T + v.v * (v.v - vl) / (2 * Math.sqrt(v.a * v.b)));
  const r = ss / gap;
  return v.a * (1 - r * r);
}

class Sim {
  constructor(sc, D, P) {
    this.sc = sc; this.D = D; this.P = P; this.n = 0; this.t = 0;
    this.rng = mulberry32(P.seed * 7919 + 17);
    const g = sc.geom(XC);
    this.cx = { lw: g.lw, wi: g.wi, W: 2 * g.lw + g.wi, island: g.wi >= ISLAND_MIN, mid: g.lw + g.wi / 2,
      lanes: [{ y0: 0, y1: g.lw }, { y0: g.lw + g.wi, y1: 2 * g.lw + g.wi }] };
    this.lanes = [0, 1].map(k => {
      const zones = sc.zones.map((z, i) => ({ z, i })).filter(o => o.z.lane === undefined || o.z.lane === k)
        .map(({ z, i }) => k === 0 ? { i, sa: z.xa, sb: z.xb, kind: z.kind } : { i, sa: L - z.xb, sb: L - z.xa, kind: z.kind })
        .sort((a, b) => a.sa - b.sa);
      const sZs = XC - ZEBRA_HALF, caps = zones.filter(z => z.kind === 'cap');
      return { k, zones, veh: [], ptr: 0, pending: [], sZs, sZe: XC + ZEBRA_HALF, sStop: sZs - 0.5,
        sRef: Math.min(sZs, caps.length ? caps[0].sa : sZs), qNow: 0 };
    });
    this.peds = []; this.pedPtr = 0;
    this.need = [false, false]; this.occT = [Infinity, Infinity]; this.phys = [false, false];
    this.sig = sc.signal ? { st: 'G', t0: 0, demand: false, clear: Math.ceil(this.cx.W / SIG.vClear) } : null;
    this.measFrom = WARMUP;    // journée simulée : 0, et relevés heure par heure dans this.hourly
    this.hourly = null;
    this.st = { nOut: 0, nExit: 0, sumTT: 0, nStop: 0, vXp: [], surgN: 0, surgStop: 0, surgP: 0, qInt: 0, qMax: 0,
      pedN: 0, pedSum: 0, pedMax: 0, yYes: 0, yNo: 0, conflicts: 0, hard: 0,
      profS: new Float64Array(L / 5), profN: new Uint32Array(L / 5) };
  }

  makeVeh(rec) {
    const P = this.P, cls = rec.pl ? 'PL' : 'VL', c = CLS[cls];
    const vd = Math.max(15, rec.pl ? P.vPL + P.sdPL * rec.z : P.vVL + P.sdVL * rec.z) / KMH;
    const caps = this.sc.zones.map(z => Math.max(1.5, z.kind === 'cap'
      ? Math.min(vd, z[cls] * (1 + CVAR * rec.z) / (1 + 1.036 * CVAR))
      : vd * z.f));
    return { id: rec.id, cls, look: vehicleLook(rec), len: c.len, w: c.w, a: c.a, b: c.b, s0: c.s0, T: P.T + c.dT, bAnt: c.bAnt, vd, caps,
      s: 0, v: 0, acc: 0, tArr: rec.t, tL: NaN, yd: 0, yT: 0, stopT: -1, stopped: false, hb: false, pb: false };
  }

  // vitesse désirée locale : vitesse du conducteur, bornée par les dispositifs anticipés à décélération constante
  vLim(v, ln, s) {
    let v0 = v.vd;
    for (const z of ln.zones) {
      if (s > z.sb + v.len) continue;
      const cap = v.caps[z.i];
      const lim = s >= z.sa ? cap : Math.sqrt(cap * cap + 2 * v.bAnt * (z.sa - s));
      if (lim < v0) v0 = lim;
    }
    return v0;
  }
  v0(v, ln) { return this.vLim(v, ln, v.s); }

  tryInsert(ln) {
    const rec = ln.pending[0], back = ln.veh[ln.veh.length - 1];
    const v = this.makeVeh(rec);
    let sp = Math.min(v.vd, this.v0(v, ln)), s = 0;
    if (back) {
      const rear = back.s - back.len;
      if (rear < v.s0 + sp * v.T) {
        // trop près du dernier : il arrive en peloton derrière lui, à sa vitesse, juste en amont de l'entrée
        sp = Math.min(sp, back.v);
        s = Math.min(0, rear - v.s0 - sp * v.T);
        if (s < -20) return;               // la file remonte jusqu'à l'entrée : il attend hors tronçon
      }
    }
    v.s = s; v.v = sp; ln.veh.push(v); ln.pending.shift();
  }

  nextStage(p) {
    const cx = this.cx;
    if (p.st === 0) {
      if (p.side === 0) return cx.island ? { lanes: [0], yTo: cx.mid, toIsland: true, y: 0, dir: 1 } : { lanes: [0, 1], yTo: cx.W, toIsland: false, y: 0, dir: 1 };
      return cx.island ? { lanes: [1], yTo: cx.mid, toIsland: true, y: cx.W, dir: -1 } : { lanes: [1, 0], yTo: 0, toIsland: false, y: cx.W, dir: -1 };
    }
    return p.dir > 0 ? { lanes: [1], yTo: cx.W, toIsland: false, y: cx.mid, dir: 1 } : { lanes: [0], yTo: 0, toIsland: false, y: cx.mid, dir: -1 };
  }

  flags() {
    const need = this.need, occT = this.occT, phys = this.phys, vp = this.P.vPed;
    need[0] = need[1] = phys[0] = phys[1] = false; occT[0] = occT[1] = Infinity;
    for (const p of this.peds) {
      if (p.st === 0 || p.st === 2) { for (const k of this.nextStage(p).lanes) need[k] = true; }
      else if (p.st === 1) {
        for (const k of p.stage.lanes) {
          const Ls = this.cx.lanes[k];
          const cleared = p.dir > 0 ? p.y > Ls.y1 + 0.3 : p.y < Ls.y0 - 0.3;
          if (cleared) continue;
          const dist = ((p.dir > 0 ? Ls.y0 : Ls.y1) - p.y) * p.dir;
          const tE = dist > 0 ? dist / vp : 0;
          if (tE < occT[k]) occT[k] = tE;
          if (p.y >= Ls.y0 && p.y <= Ls.y1) phys[k] = true;
        }
      }
    }
  }

  accel(ln) {
    const P = this.P, t = this.t, vs = ln.veh, need = this.need[ln.k], occT = this.occT[ln.k], occ = occT < Infinity;
    for (let i = 0; i < vs.length; i++) {
      const v = vs[i];
      const v0 = this.v0(v, ln);
      let a;
      if (v.v <= v0) { const r = v.v / v0, r2 = r * r; a = v.a * (1 - r2 * r2); }
      else a = -Math.min(4, 3 * (v.v - v0));
      if (i > 0) { const l = vs[i - 1]; a = Math.min(a, aInt(v, l.s - l.len - v.s, l.v)); }
      v.pb = false;
      if (v.s < ln.sStop + 0.3) {
        const d = ln.sStop - v.s;
        let stop;
        if (this.sig) stop = this.sigStop(v, d);   // feu : le rouge arrête tout le monde, l'orange ceux qui peuvent s'arrêter
        else {
          // décision de céder : chaque conducteur, une seule fois, quand il voit un piéton attendre et peut encore
          // s'arrêter sans brusquer. La probabilité dépend de la vitesse qu'il aurait au passage.
          const dComf = v.v * P.tReact + v.v * v.v / (2 * B_YIELD);
          if (v.yd === 0 && need && d <= Math.max(D_DEC, dComf + 10)) {
            const feasible = v.v < 1.5 || dComf <= d;
            const vPlan = Math.min(v.v, this.vLim(v, ln, XC));
            v.yd = feasible && this.rng() < pYield(vPlan * KMH, P) ? 1 : 2;
            v.yT = t; v.stopT = -1;
            if (t >= this.measFrom) { if (v.yd === 1) this.st.yYes++; else this.st.yNo++; }
          }
          if (v.yd === 1) {
            if (!need && !occ) { if (t - v.yT > 1) v.yd = 3; }
            else if (v.v < 0.5) { if (v.stopT < 0) v.stopT = t; if (!occ && t - v.stopT > YIELD_PATIENCE) v.yd = 3; }
          }
          stop = v.yd === 1;
        }
        if (!stop && occ && d > 0.05) {
          const clears = v.v > 1 && (d + 0.5 + 2 * ZEBRA_HALF + v.len) / v.v < occT - 0.3;
          if (!clears && v.v * v.v / (2 * d) <= 8) stop = true;
        }
        if (stop) { const as = aInt(v, Math.max(0.05, d + 1), 0); if (as < a) { a = as; v.pb = true; } }
      }
      v.acc = Math.max(-9, a);
    }
  }

  // feu : décision d'arrêt d'un véhicule en amont de la ligne
  sigStop(v, d) {
    const st = this.sig.st;
    if (st === 'G') return false;
    const dec = v.v < 1 ? 0 : v.v * v.v / (2 * Math.max(0.05, d));
    return st === 'A' ? dec <= 3.5 : dec <= 8;
  }
  // cycle du feu à la demande : appel par bouton, vert minimal des véhicules respecté
  stepSignal() {
    const s = this.sig, el = this.t - s.t0, P = this.P, go = st => { s.st = st; s.t0 = this.t; };
    if (s.st !== 'P' && this.peds.some(p => p.st === 0)) s.demand = true;
    if (s.st === 'G') { if (s.demand && el >= P.sigGreen) go('A'); }
    else if (s.st === 'A') { if (el >= SIG.amber) go('R'); }
    else if (s.st === 'R') { if (el >= SIG.red1) { go('P'); s.demand = false; } }
    else if (s.st === 'P') { if (el >= SIG.walk) go('C'); }
    else if (s.st === 'C') { if (el >= s.clear) go('R2'); }
    else if (s.st === 'R2') { if (el >= SIG.red2) go('G'); }
  }

  // piéton surgissant à dSurg mètres : réaction à vitesse constante, puis freinage d'urgence ; risque à la vitesse du choc
  surg(v) {
    const P = this.P, st = this.st, dr = v * P.tReact;
    let vi;
    if (dr >= P.dSurg) vi = v; else { const w = v * v - 2 * P.bEmerg * (P.dSurg - dr); vi = w > 0 ? Math.sqrt(w) : 0; }
    st.surgN++; if (vi === 0) st.surgStop++; st.surgP += rosen(vi * KMH);
  }

  move(ln, meas) {
    const st = this.st, phys = this.phys[ln.k], sD = ln.sZs - this.P.dSurg, tNext = this.t + DT;
    for (const v of ln.veh) {
      const s0 = v.s, a = v.acc;
      let vn = v.v + a * DT, sn;
      if (vn < 0) { sn = s0 - v.v * v.v / (2 * a); vn = 0; } else sn = s0 + v.v * DT + 0.5 * a * DT * DT;
      if (meas && phys && s0 < ln.sZs && sn >= ln.sZs) st.conflicts++;
      if (s0 < L && sn >= L) v.tL = tNext;
      if (meas && v.tArr >= this.measFrom) {
        if (s0 < XC && sn >= XC) st.vXp.push(v.v * KMH);
        if (s0 < sD && sn >= sD) this.surg(v.v);
        const b0 = Math.floor(s0 / 5), b1 = Math.min(st.profN.length - 1, Math.floor(sn / 5));
        for (let b = Math.max(0, b0 + 1); b <= b1; b++) { st.profS[b] += v.v; st.profN[b]++; }
      }
      if (vn < 1) v.stopped = true;
      if (v.pb && a < -3.5 && !v.hb) { v.hb = true; if (meas) st.hard++; }
      v.s = sn; v.v = vn;
    }
    while (ln.veh.length && ln.veh[0].s - ln.veh[0].len > L) {
      const v = ln.veh.shift();
      if (meas) st.nOut++;
      if (v.tArr >= this.measFrom) { st.nExit++; st.sumTT += v.tL - v.tArr; if (v.stopped) st.nStop++; }
      if (this.hourly) {
        const ho = this.hourly[Math.floor(this.t / 3600)], ha = this.hourly[Math.floor(v.tArr / 3600)];
        if (ho) ho.out++;
        if (ha) { ha.nTT++; ha.sumTT += v.tL - v.tArr; }
      }
    }
  }

  queue(meas) {
    let qs = 0;
    for (const ln of this.lanes) {
      // file continue depuis le dispositif : chaîne de véhicules lents (< 20 km/h) serrés (< 25 m),
      // dont on retient le dernier véhicule presque à l'arrêt (< 8 km/h)
      let q = 0, prevRear = ln.sRef, chain = false;
      for (const v of ln.veh) {
        if (v.s >= ln.sRef) continue;
        if (prevRear - v.s > (chain ? 25 : 30) || v.v >= 20 / KMH) break;
        chain = true; prevRear = v.s - v.len;
        if (v.v < 8 / KMH) q = ln.sRef - prevRear;
      }
      if (ln.pending.length) q = Math.max(q, ln.sRef) + ln.pending.length * 7;
      ln.qNow = q; qs += q;
      if (meas && q > this.st.qMax) this.st.qMax = q;
    }
    if (meas) this.st.qInt += qs / 2 * DT;
    if (this.hourly) {
      const hb = this.hourly[Math.floor(this.t / 3600)];
      if (hb) { const qm = Math.max(this.lanes[0].qNow, this.lanes[1].qNow); if (qm > hb.qMax) hb.qMax = qm; hb.pend = this.lanes[0].pending.length + this.lanes[1].pending.length; }
    }
  }

  laneOK(k, tEnter, tExit, allowForce) {
    const ln = this.lanes[k], P = this.P;
    for (const v of ln.veh) {
      if (v.s - v.len > ln.sZe + 0.3) continue;            // déjà passé
      const d = ln.sZs - v.s;
      if (d < 0.3) return false;                            // sur le passage
      if (v.yd === 1 && (v.v < 1 || v.v * v.v / (2 * d) < 4)) return true;
      if (v.v < 0.5) return true;                           // arrêté : les suivants sont bloqués derrière
      if (d / v.v > tExit + P.tSafe) return true;           // créneau suffisant
      if (allowForce && v.v * P.tReact + v.v * v.v / (2 * B_ENGAGE) <= d) return true;
      if ((d + 2 * ZEBRA_HALF + v.len) / v.v < tEnter - 0.5) continue;  // passe avant que le piéton n'arrive sur la voie
      return false;
    }
    return true;
  }

  stageOK(sg) {
    const vp = this.P.vPed;
    for (let j = 0; j < sg.lanes.length; j++) {

  }

function quantities(sc) {

  switch (sc.id) {
    case 'dos': add('asphalt', 2 * W * 4 * (2 / 3) * 0.10 * 2.35); add('sign', 4); add('zebra', 0.5 * W); break;
    case 'trap': add('table', W * 6.4); add('sign', 4); add('zebra', 0.25 * W); break;
    case 'plat': add('table', W * 11); add('sign', 2); add('zebra', 0.25 * W); break;
    case 'cous': add('cushion', 4); add('sign', 2); add('zebra', 4 * 0.45); break;
    case 'ret': add('kerb', 4 * 13 + 2 * 30); add('island', P.retIsl * 18); add('pavement', 2 * Math.max(0, P.retIsl / 2 + P.retLane - lw) * 30);
      add('bollard', 2); add('sign', 2); add('kerbRamp', 2); break;
    case 'chi': add('kerb', 2 * (2 * P.chTrans + 10)); add('pavement', P.chOff * (P.chTrans + 10)); add('island', P.chOff * (P.chTrans + 10));
      add('bollard', 4); add('line', 2 * P.chTrans + 10); break;

function costing(sc) {
  const q = quantities(sc), rows = [];
  for (const p of PRICE_DEF) if (p.k !== 'fees' && q[p.k] > 0) {
    const qty = p.u[0] === 'u' || p.u[0] === 'ens.' ? Math.round(q[p.k]) : Math.round(q[p.k] * 10) / 10;
    rows.push({ p, qty, amount: qty * PRICES[p.k] });

  const sub = rows.reduce((a, r) => a + r.amount, 0), fees = sub * PRICES.fees / 100;

/* ---------- plan de principe coté, A4 paysage (SVG en millimètres) ---------- */
function planSVG(sc, meta, N) {
  const ar = lang === 'ar', D = N.plan, f2 = v => nf2.format(v);
  const halfX = ({ ref: 16, dos: 18, trap: 14, plat: 15, cous: 18, ret: 22, chi: P.chTrans + 13, rev: 26, rug: 66, sig: 16 })[sc.id] || 18;
  let S = 1000;
  for (const s of [100, 125, 200, 250, 500, 1000]) { const kk = 1000 / s; if (2 * halfX * kk <= 262 && 17 * kk <= 86) { S = s; break; } }
  const k = 1000 / S, cx = 148.5, cy = 76;
  const PX = x => cx + (x - XC) * k, PY = y => cy - y * k;
  const o = [];
  const fx = v => v.toFixed(2);
  const txt = (x, y, s, size = 2.4, anchor = 'middle', rot = 0) => o.push(`<text x="${fx(x)}" y="${fx(y)}" font-size="${size}" text-anchor="${anchor}" fill="#000"${rot ? ` transform="rotate(${rot} ${fx(x)} ${fx(y)})"` : ''}${ar ? ' direction="rtl"' : ''}>${esc(s)}</text>`);
  const line = (x1, y1, x2, y2, w = 0.25, extra = '') => o.push(`<line x1="${fx(x1)}" y1="${fx(y1)}" x2="${fx(x2)}" y2="${fx(y2)}" stroke="#000" stroke-width="${w}"${extra}/>`);
  const poly = (pts, fill, stroke = 'none', w = 0.2) => o.push(`<polygon points="${pts.map(p => fx(p[0]) + ',' + fx(p[1])).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${w}"/>`);
  const pl = (pts, w, extra = '') => o.push(`<polyline points="${pts.map(p => fx(p[0]) + ',' + fx(p[1])).join(' ')}" fill="none" stroke="#000" stroke-width="${w}"${extra}/>`);

    <pattern id="hatch" width="1.2" height="1.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.2" stroke="#000" stroke-width="0.12"/></pattern>

    <pattern id="dots" width="0.8" height="0.8" patternUnits="userSpaceOnUse"><circle cx="0.4" cy="0.4" r="0.16" fill="#000"/></pattern>
    <pattern id="grid" width="${fx(Math.max(0.7, gs))}" height="${fx(Math.max(0.7, gs))}" patternUnits="userSpaceOnUse"><path d="M0 0H${fx(Math.max(0.7, gs))}M0 0V${fx(Math.max(0.7, gs))}" fill="none" stroke="#000" stroke-width="0.08"/></pattern>
    <pattern id="green" width="1.6" height="1.6" patternUnits="userSpaceOnUse"><circle cx="0.8" cy="0.8" r="0.28" fill="none" stroke="#000" stroke-width="0.1"/></pattern>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6z" fill="#000"/></marker>
  </defs>`);

  o.push('<g clip-path="url(#clipPlan)">');
  // trottoirs, bordures

  }
  // axe discontinu (3 m / 3,5 m)
  const busy = sc.feats.filter(f => f.xa !== undefined);
  for (let x = XC - halfX; x < XC + halfX; x += 6.5) {
    const xe = x + 3;
    if (xe > XC - ZEBRA_HALF - 2 && x < XC + ZEBRA_HALF + 2) continue;
    if (busy.some(f => xe > f.xa - 0.5 && x < f.xb + 0.5)) continue;
    if (G(x).wi > 0.05 || G(xe).wi > 0.05) continue;
    pl([[PX(x), PY(G(x).yc)], [PX(x + 1.5), PY(G(x + 1.5).yc)], [PX(xe), PY(G(xe).yc)]], 0.25);
  }
  // abaissés de trottoir et bandes d'éveil de vigilance
  rectW(XC - ZEBRA_HALF, XC + ZEBRA_HALF, gm.s - 0.92, gm.s - 0.5, 'url(#dots)', '#000', 0.1);
  rectW(XC - ZEBRA_HALF, XC + ZEBRA_HALF, gm.n + 0.5, gm.n + 0.92, 'url(#dots)', '#000', 0.1);
  if (gm.wi >= ISLAND_MIN) {
    rectW(XC - ZEBRA_HALF, XC + ZEBRA_HALF, gm.yc - gm.wi / 2 + 0.1, gm.yc - gm.wi / 2 + 0.5, 'url(#dots)', '#000', 0.1);
    rectW(XC - ZEBRA_HALF, XC + ZEBRA_HALF, gm.yc + gm.wi / 2 - 0.5, gm.yc + gm.wi / 2 - 0.1, 'url(#dots)', '#000', 0.1);
  }

  lamp(XC - 3.8, gm.s - 1.5, 'E1'); lamp(XC + 3.8, gm.n + 1.5, 'E2');

    if (type === 'A') poly([[px, py - 1.5], [px + 1.4, py + 1.0], [px - 1.4, py + 1.0]], '#fff', '#000', 0.25);
    else if (type === 'B') o.push(`<circle cx="${fx(px)}" cy="${fx(py)}" r="1.3" fill="#fff" stroke="#000" stroke-width="0.25"/>`);
    else if (type === 'C') o.push(`<rect x="${fx(px - 1.2)}" y="${fx(py - 1.2)}" width="2.4" height="2.4" fill="#fff" stroke="#000" stroke-width="0.25"/>`);
    else o.push(`<rect x="${fx(px - 0.5)}" y="${fx(py - 1.2)}" width="1" height="2.4" fill="#fff" stroke="#000" stroke-width="0.25"/>`);

  };
  const far = halfX - 2.5;
  sign('C', 'C20a', XC - 6.5, 'S'); sign('C', 'C20a', XC + 6.5, 'N');
  if (sc.id === 'dos' || sc.id === 'trap') { sign('A', 'A2b', XC - far, 'S'); sign('A', 'A2b', XC + far, 'N'); sign('B', 'B14', XC - far + 3.5, 'S'); sign('B', 'B14', XC + far - 3.5, 'N'); }
  if (sc.id === 'plat' || sc.id === 'cous') { sign('C', 'C27', XC - far, 'S'); sign('C', 'C27', XC + far, 'N'); }
  if (sc.id === 'ret') { sign('B', 'B21-1', XC - 13.5, 'I'); sign('B', 'B21-1', XC + 13.5, 'I'); }
  if (sc.id === 'chi') { const xc1 = XC - 5 - P.chTrans / 2, xc2 = XC + 5 + P.chTrans / 2; sign('J', 'J5', xc1, 'S'); sign('J', 'J5', xc2, 'N'); }

  line(PX(xB), PY(laneY(G(xB), 1)), PX(xB) - 9, PY(laneY(G(xB), 1)), 0.3, ' marker-end="url(#arr)"');
  // trait de coupe A-A sur la voie sens →

  if (vert) {

    txt(PX(XC) - 2.2, PY(gm.n + 1.0), 'B', 2.6); txt(PX(XC) - 2.2, PY(gm.s - 1.0) + 2.4, 'B', 2.6);

  txt(148.5, 203.4, N.genBy, 1.9, 'middle');
  // coupe A-A (dispositif surélevé) ou B-B (profil en travers au droit du passage)

  if (vert) {
    txt(bx + bw / 2, by + 4, D.secA, 2.3);
    const prof = sc.id === 'dos' ? { L: 4, h: 0.10, fn: u => { const c = 2, R = 20.05; return u <= 0 || u >= 4 ? 0 : Math.sqrt(R * R - (u - c) * (u - c)) - (R - 0.10); }, segs: [[0, 4, f2(4)]], slope: '' }

  h2 += `<section class="annex"><h2>${esc(N.s.annA)}</h2><div class="box">${esc(N.annexBox)}</div>`;
  h2 += tbl(N.annACols, E.map((x, j) => `<tr${j === i ? ' style="font-weight:600"' : ''}><td>${esc(scName(scenarios[j]))}</td><td class="n">${f0(x.v85)}</td><td class="n">${f0(x.tt)}</td><td class="n">${f0(x.flow)}</td><td class="n">${f0(x.pedW)}</td><td class="n">${f1(x.surgRisk)}</td><td>${esc(st(x))}</td></tr>`));
  h2 += `<p>${esc(t('vCriteria'))}</p><p>${esc(R.best >= 0 ? N.recLine(scName(scenarios[R.best])) : N.recNone)}</p></section>`;
  const calibRows = FIELDS.find(g => g.lock).items.map(f => `<tr><td>${esc(f[lang])}</td><td class="n">${esc(nfa.format(P[f.k]))} ${esc(f.u[ui])}</td></tr>`);
  h2 += `<section><h2>${esc(N.s.annB)}</h2>${li(N.method)}${tbl(N.calibCols, calibRows)}<p class="small">${esc(fpTxt)}</p></section>`;
  h2 += `<section><h2>${esc(N.s.annC)}</h2><ol dir="ltr">${SOURCES}</ol></section>`;
  h2 += `<p class="small gen gen-end">${genLine} · ${esc(meta.date)}</p>`;
  const dir = lang === 'ar' ? 'rtl' : 'ltr';
  return `<!doctype html><html lang="${lang}" dir="${dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(N.title)} — ${esc(name)}</title><style>${NOTE_CSS}</style></head><body>
<div class="toolbar"><button type="button" onclick="window.print()">${esc(N.print)}</button><span>${esc(N.title)} — ${esc(name)}</span></div>
<div class="sheet">${h1}</div>
<div class="plan-sheet">${planSVG(sc, meta, N)}</div>
<div class="sheet">${h2}</div>
</body></html>`;
}

/* ---------- état global ---------- */
let P = derive({ ...DEFAULTS }), scenarios = [], sims = [], views = [];
let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let speed = 1, busy = false, accT = 0, last = performance.now(), lastKpi = 0;
let calibUnlocked = false, calibModified = false;
let evalRes = null, evalJob = 0, evalProg = 0, evalP = null;
const thumbs = new Map();          // id → image (data URL), pour la géométrie courante
let thumbKey = '', thumbJob = 0;
const $ = s => document.querySelector(s);
const stripsEl = $('#strips');
let io = null;

function buildStrips() {
  stripsEl.textContent = '';
  if (io) io.disconnect();
  views = scenarios.map((sc, i) => {
    const art = document.createElement('article');
    art.className = 'strip' + (sc.id === 'ref' ? ' ref' : '');
    art.id = 'bande-' + sc.id;
    const lg = (a, b) => `<span class="lg">${a}</span><span class="sh">${b}</span>`;
    art.innerHTML = `
      <div class="strip-head">
        <button class="thumb" type="button" data-k="thumb" aria-label="${esc(t('thumbAria', scName(sc)))}"><img alt=""></button>
        <div class="strip-title">
          <h3>${lg(scName(sc), scShort(sc))}<span class="pill rec" data-k="rec" hidden>${lg(...t('rec'))}</span><span class="pill ok" data-k="state">${lg(...t('stFluid'))}</span>${sc.reg ? `<span class="pill warn" title="${esc(t('regTitle'))}">${lg(...t('reg'))}</span>` : ''}</h3>
          <p class="desc">${scDesc(sc)}</p>
        </div>
        <dl class="kpis">
          <div><dt>${t('kV85')}</dt><dd data-k="v85">–</dd></div>
          <div><dt>${t('kTT')}</dt><dd data-k="tt">–</dd></div>
          <div><dt>${t('kQ')}</dt><dd data-k="q">–</dd></div>
          <div><dt>${t('kPed')}</dt><dd data-k="ped">–</dd></div>
          <div><dt>${t('kRisk')}</dt><dd data-k="risk">–</dd></div>
        </dl>
      </div>
      <div class="qrow"><span data-k="q0"></span><span data-k="q1"></span></div>
      <canvas class="plan" role="img" aria-label="${esc(t('planAria', scName(sc)))}"></canvas>`;
    const img = art.querySelector('.thumb img');
    if (thumbs.has(sc.id)) img.src = thumbs.get(sc.id);
    art.querySelector('.thumb').addEventListener('click', () => open3D(sc));
    stripsEl.appendChild(art);
    return new View(i, art);
  });
  io = new IntersectionObserver(es => { for (const e of es) { const vw = views.find(v => v.art === e.target); if (vw) vw.visible = e.isIntersecting; } });
  views.forEach(v => io.observe(v.art));
}

// noms courts, ligne de légende du mode présentation
function layoutAll() {
  for (const v of views) v.layout();

/* mode présentation : hauteur de chaque bande = (hauteur d'écran − barre − en-tête) / nombre de bandes */
let compactRowH = 100;

function computeCompactRowH() {

  const head = $('#compact-head').getBoundingClientRect().height;

}
function setHash() {
  const tok = [isCompact() ? 'presentation' : '', typeof MOD !== 'undefined' && MOD !== 'cross' ? { jx: 'carrefour', pv: 'chaussee' }[MOD] : '', lang !== 'fr' ? lang : ''].filter(Boolean).join('-');

}

function build() {
  scenarios = buildScenarios(P);
  const D = new Demand(P);
  sims = scenarios.map(sc => new Sim(sc, D, P));
  buildStrips();
  if (isCompact()) computeCompactRowH();
  layoutAll();
  $('#bar-sub').textContent = t('barSub', P);
  $('#lede').textContent = t('lede', P);
  $('#eyebrow').textContent = t('eyebrow', P);
  buildDayInput();

/* ---------- évaluation : cinq simulations d'une heure, tirages fixés, en tâche de fond ---------- */
function startEvaluation() {
  const job = ++evalJob, Pe = P, scs = buildScenarios(Pe), acc = scs.map(() => []);
  evalRes = null; evalProg = 0; evalP = Pe;
  let rep = 0, cur = null;
  const tick = () => {
    if (job !== evalJob) return;
    const t0 = performance.now();
    while (performance.now() - t0 < 22) {
      if (!cur) { const Pr = { ...Pe, seed: Pe.seed + rep }; const D = new Demand(Pr); cur = scs.map(sc => new Sim(sc, D, Pr)); }
      for (let n = 0; n < 40; n++) for (const s of cur) s.step();
      if (cur[0].t >= EVAL_T - 1e-6) {
        cur.forEach((s, i) => acc[i].push(stats(s)));
        cur = null; rep++;
        if (rep >= REPS) { evalRes = aggregate(acc); evalProg = 1; if (!busy) updateKpis(); buildNoteUI(); renderProfileCross(); startDay(); return; }
      }
    }
    evalProg = (rep + (cur ? cur[0].t / EVAL_T : 0)) / REPS;
    setTimeout(tick, 0);
  };
  setTimeout(tick, 0);
}

/* ---------- affichage des chiffres ---------- */
function setClass(el, cls) { el.classList.remove('ok-t', 'warn-t', 'bad-t'); if (cls) el.classList.add(cls); }
const lvl = (v, good, mid, lowerIsBetter = true) => !Number.isFinite(v) ? '' : lowerIsBetter ? (v <= good ? 'ok-t' : v <= mid ? 'warn-t' : 'bad-t') : (v >= good ? 'ok-t' : v >= mid ? 'warn-t' : 'bad-t');
let verdictHTML = '', lastTable = '';

function updateKpis() {
  const S = evalRes || sims.map(stats), ref = S[0], rec = evalRes ? recommend(evalRes, scenarios) : null;
  const u = k => t(k);
  S.forEach((s, i) => {
    const art = views[i].art, q = k => art.querySelector(`[data-k="${k}"]`);
    const e1 = q('v85'); e1.innerHTML = `${f0(s.v85)} <small>${u('kmh')}</small>`; setClass(e1, lvl(s.v85, 30, 40));
    q('tt').innerHTML = `${f0(s.tt)} ${u('s')}` + (i ? ` <small>${sgn(s.tt - ref.tt)}</small>` : '');
    q('q').innerHTML = `${f0(s.qMax)} <small>${u('m')}</small>`;
    const e4 = q('ped'); e4.innerHTML = `${f0(s.pedW)} <small>${u('s')}</small>`; setClass(e4, lvl(s.pedW, 10, 30));
    const e5 = q('risk'); e5.innerHTML = `${f1(s.surgRisk)} <small>%</small>`; setClass(e5, lvl(s.surgRisk, 0.5, 2));
    for (const k of [0, 1]) { const el = q('q' + k), txt = views[i].queueText(k); if (el.textContent !== txt) el.textContent = txt; }
    const state = s.sat ? ['bad', t('stSat')] : (s.qAvg >= 15 || s.qMax >= 100) ? ['warn', t('stFiles')] : ['ok', t('stFluid')];
    const pill = q('state'), html = `<span class="lg">${state[1][0]}</span><span class="sh">${state[1][1]}</span>`;
    if (pill.innerHTML !== html) { pill.className = 'pill ' + state[0]; pill.innerHTML = html; }
    const isBest = !!rec && rec.best === i;
    q('rec').hidden = !isBest; art.classList.toggle('best', isBest);
  });
  const rows = S.map((s, i) => {
    const c = (v, cls) => `<td class="${cls}">${v}</td>`;
    const cl = [i ? '' : 'ref', rec && rec.best === i ? 'best' : ''].join(' ');
    return `<tr class="${cl}"><td class="name">${scName(scenarios[i])}</td>`
      + c(f0(s.v85), lvl(s.v85, 30, 40))
      + c(f0(s.tt), '')
      + c(i ? sgn(s.tt - ref.tt) : '–', '')
      + c(f0(s.flow), lvl(s.flow, 0.97 * P.q, 0.9 * P.q, false))
      + c(f0(s.stopPct), lvl(s.stopPct, 20, 50))
      + c(f0(s.qMax), lvl(s.qMax, 50, 150))
      + c(f1(s.pedW), lvl(s.pedW, 10, 30))
      + c(f0(s.yieldPct), lvl(s.yieldPct, 70, 40, false))
      + c(f0(s.surgStop) + ' %', lvl(s.surgStop, 90, 60, false))
      + c(f1(s.surgRisk) + ' %', lvl(s.surgRisk, 0.5, 2)) + '</tr>';
  }).join('');
  if (rows !== lastTable) { lastTable = rows; $('#summary tbody').innerHTML = rows; }
  const fp = fingerprint(P), fpTxt = calibModified ? t('calibMod', fp) : t('calibRef', fp);
  $('#summary-note').textContent = evalRes ? t('sumNote', P, fpTxt) : t('sumRunning', Math.round(evalProg * 100));
  renderVerdict();
  const flag = $('#calib-flag'); flag.hidden = !calibModified; flag.textContent = t('calibFlag');
}

function renderVerdict() {
  let h = '';
  if (calibModified) h += `<p class="v-warn">${t('vCalib')}</p>`;
  if (!evalRes) h += `<p class="eyebrow">${t('vEyebrow')}</p><p>${t('vRunning', Math.round(evalProg * 100))}</p>`;
  else {
    const r = recommend(evalRes, scenarios), ref = evalRes[0];
    if (r.best < 0) h += `<p class="eyebrow">${t('vEyebrow')}</p><h3>${t('vNoneTitle')}</h3><p>${t('vNone')}</p>`;
    else {
      const e = evalRes[r.best];
      h += `<p class="eyebrow">${t('vEyebrow')}</p><h3>${scName(scenarios[r.best])}</h3><p>${t('vMetrics', e, ref)}</p>`;
      h += `<p class="${e.v85 <= 30 ? 'ok-t' : 'warn-t'}">${e.v85 <= 30 ? t('vSafeOk') : t('vSafeKo', e.v85)}</p>`;
      if (ref.surgRisk - e.surgRisk < 0.1) h += `<p class="warn-t">${t('vSmallGain')}</p>`;
    }
    if (r.excluded.length) {
      const why = x => x.why.map(w => w === 'sat' ? t('reasonSat', evalRes[x.i], evalP) : t('reasonReg')).join(t('sep'));
      h += `<p class="v-excl"><strong>${t('vExcluded')}</strong> ${r.excluded.map(x => `${scName(scenarios[x.i])} (${why(x)})`).join(' · ')}</p>`;
    }
    h += `<p class="v-rule">${t('vCriteria')}</p>`;
  }
  if (h !== verdictHTML) { verdictHTML = h; $('#verdict').innerHTML = h; }
}

function clock() {
  const tt = sims.length ? sims[0].t : 0, h = Math.floor(tt / 3600), m = Math.floor(tt % 3600 / 60), s = String(Math.floor(tt % 60)).padStart(2, '0');
  $('#clock').innerHTML = `${t('clock', h, m, s)}<small>${t('simTime')}</small>`;
}

function advance(seconds, btn) {
  busy = true;
  const target = sims[0].t + seconds, start = sims[0].t;
  document.querySelectorAll('.bar button, #params button').forEach(b => { b.disabled = b !== $('#btn-play') && !b.dataset.speed && !b.dataset.view && !b.dataset.color && !b.dataset.free; });
  const chunk = () => {
    const t0 = performance.now();
    while (performance.now() - t0 < 35 && sims[0].t < target - 1e-6) for (const s of sims) s.step();
    if (btn) btn.textContent = t('computing', Math.round(100 * (sims[0].t - start) / seconds));
    if (sims[0].t < target - 1e-6) setTimeout(chunk, 0);
    else {
      busy = false;
      if (btn) btn.textContent = t('hour');
      document.querySelectorAll('.bar button, #params button').forEach(b => { b.disabled = false; });
      updateKpis();
    }
  };
  chunk();
}

function frame(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !busy) {
    accT += dtReal * speed;
    let n = 0;
    while (accT >= DT && n < 400) { for (const s of sims) s.step(); accT -= DT; n++; }
    if (n >= 400) accT = 0;
  }
  for (const v of views) if (v.visible) v.draw();
  if (now - lastKpi > 400) { lastKpi = now; clock(); if (!busy) updateKpis(); }
  requestAnimationFrame(frame);
}

    + `<div class="form-actions"><button class="btn primary" type="submit" id="btn-apply-calib"${calibUnlocked ? '' : ' hidden'}>${t('applyCalib')}</button><span class="msg" id="form-msg-c"></span></div>`;
}
let formMsg = '#form-msg';
function onFormClick(e) {
  const id = e.target && e.target.id;
  if (id === 'btn-unlock') {
    calibUnlocked = !calibUnlocked;
    document.querySelectorAll('fieldset.calib input').forEach(i => { i.readOnly = !calibUnlocked; });
    e.target.textContent = calibUnlocked ? t('lock') : t('unlock');
    $('#btn-apply-calib').hidden = !calibUnlocked;
    $('#form-msg-c').textContent = calibUnlocked ? t('msgUnlocked') : t('msgLocked');
  } else if (id === 'btn-defaults') {
    for (const grp of FIELDS) for (const f of grp.items) if (!grp.lock || calibUnlocked) $('#p-' + f.k).value = DEFAULTS[f.k];
    $('#form-msg').textContent = t('msgDefaults');
  }
}
$('#params').addEventListener('click', onFormClick);
$('#params-calib').addEventListener('click', onFormClick);
$('#params').addEventListener('submit', e => { formMsg = '#form-msg'; applyParams(e); });
$('#params-calib').addEventListener('submit', e => { formMsg = '#form-msg-c'; applyParams(e); });
function applyParams(e) {
  e.preventDefault();
  const next = { ...P }, bad = [];
  for (const grp of FIELDS) for (const f of grp.items) {
    if (grp.lock && !calibUnlocked) continue;
    const val = parseFloat(String($('#p-' + f.k).value).replace(',', '.'));
    if (!Number.isFinite(val) || val < 0) { bad.push(f[lang]); continue; }
    if (f.min !== undefined && (val < f.min || val > f.max)) { bad.push(t('msgRange', f[lang], nfa.format(f.min), nfa.format(f.max))); continue; }
    next[f.k] = val;
  }
  if (next.retLane >= next.laneW) bad.push(t('msgLane'));
  if (next.vPed < 0.3) bad.push(FIELDS[2].items[3][lang]);
  if (bad.length) { $(formMsg).textContent = t('msgFix', bad.join(t('sep'))); return; }
  P = derive(next);
  calibModified = fingerprint(P) !== FP_REF;
  $(formMsg).textContent = t('msgApplied');
  restart(true);
}

function restart(paramsChanged) {
  build();
  advance(PRERUN, null);
  if (paramsChanged) { startEvaluation(); renderThumbs(); }
}

/* ---------- vignettes 3D et agrandissement ---------- */
function geomKey() { return ['laneW', 'retLane', 'retIsl', 'chOff', 'chTrans', 'chLane'].map(k => P[k]).join('|'); }
function renderThumbs() {
  if (!V3D.ok()) { document.body.classList.add('no3d'); return; }
  document.body.classList.remove('no3d');
  const key = geomKey();
  if (key === thumbKey && thumbs.size === scenarios.length) return;
  thumbKey = key; thumbs.clear();
  const job = ++thumbJob, list = scenarios.slice();
  let i = 0;
  const next = () => {
    if (job !== thumbJob || i >= list.length) return;
    const sc = list[i++];
    try {
      const url = V3D.render(sc, 768, 432, 2048).toDataURL('image/jpeg', 0.9);
      thumbs.set(sc.id, url);
      const img = document.querySelector(`#bande-${sc.id} .thumb img`); if (img) img.src = url;
    } catch (err) { document.body.classList.add('no3d'); return; }
    setTimeout(next, 30);
  };
  setTimeout(next, 30);
}
let dlgUrl = null;

  setTimeout(() => {
    try {
      V3D.render(sc, 3840, 2160, 4096).toBlob(blob => {
        if (!blob) return;
        if (dlgUrl) URL.revokeObjectURL(dlgUrl);
        dlgUrl = URL.createObjectURL(blob);
        $('#dlg-img').src = dlgUrl;
        dl.href = dlgUrl; dl.download = `vue-3d-${sc.id}.png`; dl.textContent = t('dlgDownload'); dl.hidden = false;
        $('#dlg-status').textContent = t('dlgReady');

}
$('#dlg-close').addEventListener('click', () => { const d = $('#dlg3d'); if (d.close) d.close(); else d.removeAttribute('open'); });
$('#dlg3d').addEventListener('click', e => { if (e.target === e.currentTarget && e.currentTarget.close) e.currentTarget.close(); });

// ouvre la note : onglet ouvert tout de suite (pas de blocage), cartes préparées, puis affichage
async function openNote(build, msgSel, prevUrl) {

function tileMapSVG(lat, lon, z, src, W, H, d) {
  const [cx, cy] = mercPx(lat, lon, z), x0 = cx - W / 2, y0 = cy - H / 2, o = [], fx = v => v.toFixed(1);
  const mpp = 156543.034 * Math.cos(lat * Math.PI / 180) / 2 ** z;   // mètres par pixel
  const P = (la, lo) => { const p = mercPx(la, lo, z); return [p[0] - x0, p[1] - y0]; };
  const T = (x, y, s, size, anchor = 'middle', extra = '') => o.push(`<text x="${fx(x)}" y="${fx(y)}" font-size="${size}" text-anchor="${anchor}" fill="#000" paint-order="stroke" stroke="#fff" stroke-width="3"${extra}>${esc(s)}</text>`);
  const pre = MAPIMG.get(mapKey(lat, lon, z, src, W, H));
  if (pre) o.push(`<image href="${pre}" x="0" y="0" width="${W}" height="${H}"/>`);
  else for (let tx = Math.floor(x0 / 256); tx * 256 < x0 + W; tx++) for (let ty = Math.floor(y0 / 256); ty * 256 < y0 + H; ty++)
    o.push(`<image href="${TILE_SRC[src](z, tx, ty)}" x="${fx(tx * 256 - x0)}" y="${fx(ty * 256 - y0)}" width="256" height="256"/>`);
  if (d) {
    // établissements et rue : anneaux en mètres autour du point analysé, ramenés en latitude / longitude
    const cosl = Math.cos(d.lat * Math.PI / 180), M = q => P(d.lat + q[1] / 110540, d.lon + q[0] / (111320 * cosl));
    for (const r of [100, 200, 300]) { o.push(`<circle cx="${fx(W / 2)}" cy="${fx(H / 2)}" r="${fx(r / mpp)}" fill="none" stroke="#1b5ea8" stroke-width="1.5" stroke-dasharray="6 4"/>`); T(W / 2 + r / mpp * 0.71 + 4, H / 2 - r / mpp * 0.71, `${r} m`, 12, 'start'); }
    if (d.road) o.push(`<polyline points="${d.road.ll.map(g => P(g[0], g[1]).map(fx).join(',')).join(' ')}" fill="none" stroke="#1b5ea8" stroke-width="6" stroke-opacity="0.45" stroke-linecap="round"/>`);
    d.pois.forEach((p, j) => {
      const col = /hospital|clinic/.test(p.kind) ? '#c62828' : '#ef8f00';
      for (const ring of p.rings) {
        if (ring.length === 1) { const q = M(ring[0]); o.push(`<circle cx="${fx(q[0])}" cy="${fx(q[1])}" r="5" fill="${col}" stroke="#000" stroke-width="1"/>`); }
        else o.push(`<polygon points="${ring.map(q => M(q).map(fx).join(',')).join(' ')}" fill="${col}" fill-opacity="0.3" stroke="${col}" stroke-width="2"/>`);
      }
      const r0 = p.rings[0] || [[0, 0]], c = M(r0.reduce((a, q) => [a[0] + q[0] / r0.length, a[1] + q[1] / r0.length], [0, 0]));
      o.push(`<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="9" fill="#fff" stroke="#000" stroke-width="1.2"/>`); T(c[0], c[1] + 4, String(j + 1), 11, 'middle', ' font-weight="600"');
    });
    if (d.proposal) {
      const q = P(d.proposal.ll[0], d.proposal.ll[1]);
      o.push(`<line x1="${fx(W / 2)}" y1="${fx(H / 2)}" x2="${fx(q[0])}" y2="${fx(q[1])}" stroke="#ef8f00" stroke-width="2.5" stroke-dasharray="7 4"/>`);
      o.push(`<polygon points="${fx(q[0])},${fx(q[1] - 10)} ${fx(q[0] + 9)},${fx(q[1] + 6)} ${fx(q[0] - 9)},${fx(q[1] + 6)}" fill="#ef8f00" stroke="#000" stroke-width="1"/>`);
    }
  }
  // passage piéton : épingle rouge
  o.push(`<path d="M${fx(W / 2)} ${fx(H / 2)}l-9 -16a11 11 0 1 1 18 0z" fill="#c62828" stroke="#fff" stroke-width="2.5"/><circle cx="${fx(W / 2)}" cy="${fx(H / 2 - 21)}" r="4" fill="#fff"/>`);
  T(W / 2 + 13, H / 2 - 24, 'P', 15, 'start', ' font-weight="700"');
  // nord, échelle, attribution
  o.push(`<rect x="${W - 34}" y="8" width="26" height="40" rx="4" fill="#fff" fill-opacity="0.85"/><path d="M${W - 21} 13l7 18-7-5-7 5z" fill="#000"/>`); T(W - 21, 44, 'N', 12);
  const sbm = [20, 50, 100, 200].find(v => v / mpp >= 70) || 200, sb = sbm / mpp;
  o.push(`<rect x="8" y="${H - 30}" width="${fx(sb + 24)}" height="22" rx="3" fill="#fff" fill-opacity="0.85"/><path d="M14 ${H - 14}v-6M${fx(14 + sb)} ${H - 14}v-6M14 ${H - 14}h${fx(sb)}" stroke="#000" stroke-width="2" fill="none"/>`);
  T(14 + sb / 2, H - 19, `${sbm} m`, 11);
  const attr = src === 'osm' ? '© OpenStreetMap' : '© Esri';
  o.push(`<rect x="${W - 98}" y="${H - 18}" width="98" height="18" fill="#fff" fill-opacity="0.8"/>`); T(W - 6, H - 5, attr, 10, 'end');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Arial, Tahoma, sans-serif" role="img"><defs><clipPath id="mc${src}${z}"><rect width="${W}" height="${H}"/></clipPath></defs><g clip-path="url(#mc${src}${z})">${o.join('')}</g><rect x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" fill="none" stroke="#000"/></svg>`;
}

/* ---------- trafic sur la journée : profil type ou comptages, simulation continue de 5 h à 23 h ---------- */
// part du débit de pointe, heure par heure (profil urbain de jour ouvré à deux pointes, hypothèse)
const PROFILE = [0.10, 0.06, 0.04, 0.03, 0.04, 0.10, 0.35, 0.85, 1.00, 0.80, 0.70, 0.72, 0.78, 0.80, 0.72, 0.74, 0.82, 0.95, 0.98, 0.80, 0.60, 0.45, 0.32, 0.20];
const DAY_H0 = 5, DAY_H1 = 23;
const DAY = { mode: 'profile', counts: Array(24).fill(''), res: null, prog: 0, job: 0, src: 'profile', dem: null };
try { const s = JSON.parse(localStorage.getItem('mv-day') || 'null'); if (s) { DAY.mode = s.mode === 'counts' ? 'counts' : 'profile'; if (Array.isArray(s.counts)) DAY.counts = s.counts.slice(0, 24).concat(Array(24).fill('')).slice(0, 24); } } catch (e) { /* stockage indisponible */ }
const saveDay = () => { try { localStorage.setItem('mv-day', JSON.stringify({ mode: DAY.mode, counts: DAY.counts })); } catch (e) { /* stockage indisponible */ } };
function dayDemand() {
  return PROFILE.map((f, h) => { const c = parseFloat(DAY.counts[h]); return Math.min(2000, DAY.mode === 'counts' && Number.isFinite(c) && c >= 0 ? c : f * P.q); });
}
function buildDayInput() {
  const hours = []; for (let h = DAY_H0; h < DAY_H1; h++) hours.push(h);
  const counts = DAY.mode === 'counts';
  $('#day-input').innerHTML = `<h3>${t('dayTitle')}</h3><p class="note">${t('dayNote')}</p>
    <div class="modes" role="radiogroup" aria-label="${esc(t('dayTitle'))}">
      <label><input type="radio" name="daymode" value="profile"${counts ? '' : ' checked'}> ${t('dayProfile')}</label>
      <label><input type="radio" name="daymode" value="counts"${counts ? ' checked' : ''}> ${t('dayCounts')}</label>
    </div>
    <div class="table-wrap"><table class="dayin"><thead><tr><th>${t('dayHour')}</th>${hours.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>
      <tr><td>${t('dayRowP')}</td>${hours.map(h => `<td>${f0(PROFILE[h] * P.q)}</td>`).join('')}</tr>
      <tr><td>${t('dayRowC')}</td>${hours.map(h => `<td><input data-h="${h}" type="number" min="0" max="2000" step="10" inputmode="numeric" value="${esc(DAY.counts[h])}"${counts ? '' : ' disabled'} aria-label="${esc(t('dayRowC'))} ${h}"></td>`).join('')}</tr>
    </tbody></table></div>
    <div class="form-actions"><button class="btn primary" type="button" id="btn-day">${t('dayCalc')}</button></div>`;
}
$('#day-input').addEventListener('change', e => {
  if (e.target.name === 'daymode') {
    DAY.mode = e.target.value; saveDay();
    document.querySelectorAll('#day-input input[data-h]').forEach(i => { i.disabled = DAY.mode !== 'counts'; });
  }
});
$('#day-input').addEventListener('input', e => { if (e.target.dataset.h !== undefined) { DAY.counts[+e.target.dataset.h] = e.target.value; saveDay(); } });
$('#day-input').addEventListener('click', e => { if (e.target.id === 'btn-day') startDay(); });

function startDay() {
  const job = ++DAY.job, Pe = P, scs = buildScenarios(Pe), dem = dayDemand(), nH = DAY_H1 - DAY_H0;
  const peak = Math.max(1, ...dem.slice(DAY_H0, DAY_H1)), hourAt = t2 => DAY_H0 + Math.min(nH - 1, Math.floor(t2 / 3600));
  const Pd = { ...Pe, qAt: t2 => dem[hourAt(t2)], pedAt: t2 => Pe.qPed * dem[hourAt(t2)] / peak };
  const D = new Demand(Pd);
  const sims2 = scs.map(sc => { const s = new Sim(sc, D, Pd); s.measFrom = 0; s.hourly = Array.from({ length: nH }, () => ({ out: 0, nTT: 0, sumTT: 0, qMax: 0, pend: 0, pedN: 0, pedSum: 0 })); return s; });
  DAY.res = null; DAY.prog = 0; DAY.src = DAY.mode; DAY.dem = dem;
  renderDayResults();
  const Tend = nH * 3600;
  let lastDraw = 0;
  const tick = () => {
    if (job !== DAY.job) return;
    const t0 = performance.now();
    while (performance.now() - t0 < 20 && sims2[0].t < Tend) for (let n = 0; n < 20; n++) for (const s of sims2) s.step();
    DAY.prog = Math.min(1, sims2[0].t / Tend);
    if (sims2[0].t < Tend) { if (performance.now() - lastDraw > 500) { lastDraw = performance.now(); renderDayResults(); } setTimeout(tick, 0); return; }
    DAY.res = sims2.map(s => s.hourly.map((hb, j) => {
      const h = DAY_H0 + j, demand = dem[h], served = hb.out / 2;
      const state = served < 0.96 * demand - 20 || hb.pend > 10 ? 'sat' : hb.qMax >= 100 ? 'files' : 'ok';
      return { h, demand, served, tt: hb.nTT ? hb.sumTT / hb.nTT : NaN, qMax: hb.qMax, pedW: hb.pedN ? hb.pedSum / hb.pedN : NaN, state };
    }));
    renderDayResults();
  };
  setTimeout(tick, 0);
}
function hourRanges(hours) {
  const out = []; let a = null, b = null;
  for (const h of hours) { if (a === null) a = b = h; else if (h === b + 1) b = h; else { out.push([a, b + 1]); a = b = h; } }
  if (a !== null) out.push([a, b + 1]);
  return out.map(([x, y]) => t('hRange', x, y)).join(t('rangeSep'));
}
function focusIndex() {
  let id = pickedVariant;
  if (!id && evalRes) { const r = recommend(evalRes, scenarios); id = r.best > 0 ? scenarios[r.best].id : 'ret'; }
  return Math.max(1, scenarios.findIndex(s => s.id === (id || 'ret')));
}
function dayReco(i) {
  const rows = DAY.res[i], name = scName(scenarios[i]);
  const top = rows.reduce((a, r) => r.qMax > a.qMax ? r : a, rows[0]);
  const sat = rows.filter(r => r.state === 'sat').map(r => r.h), files = rows.filter(r => r.state !== 'ok').map(r => r.h);
  const out = [];
  if (sat.length) {
    out.push(t('daySat', name, hourRanges(sat), top.qMax, top.h));
    const alts = DAY.res.map((rr, j) => j > 0 && rr.every(r => r.state !== 'sat') ? scName(scenarios[j]) : null).filter(Boolean);
    out.push(alts.length ? t('dayAlt', alts.join(', ')) : t('dayAltNone'), t('dayKeep'));
    if (scenarios[i].signal) out.push(t('daySig'));
    if (['dos', 'trap', 'plat', 'cous'].includes(scenarios[i].id)) out.push(t('dayVert'));
    out.push(t('dayMeasure'));
  } else if (files.length) out.push(t('dayFiles', name, hourRanges(files), top.qMax, top.h), t('dayMeasure'));
  else out.push(t('dayOk', name, top.qMax));
  return out;
}
function dayCells(rows, inline) {
  const bg = { ok: '#cfe9d6', files: '#f7dfae', sat: '#f2b8b8' };
  return rows.map(r => inline
    ? `<td style="background:${bg[r.state]};text-align:center;padding:1mm 0.5mm">${r.state === 'ok' ? '' : f0(r.qMax)}</td>`
    : `<td class="c-${r.state}" title="${esc(t('dayDemand'))} ${f0(r.demand)} · ${f0(r.served)}">${r.state === 'ok' ? '' : f0(r.qMax)}</td>`).join('');
}
function renderDayResults() {
  const tb = $('#day-table'), note = $('#day-note'), reco = $('#day-reco');
  if (!DAY.res) { note.textContent = DAY.job ? t('dayRunning', Math.round(DAY.prog * 100)) : t('dayWait'); tb.innerHTML = ''; reco.innerHTML = ''; return; }
  note.textContent = t('dayResNote', DAY.src === 'counts' ? t('srcCounts') : t('srcProfile', P));
  const rows0 = DAY.res[0], focus = focusIndex();
  let h = `<thead><tr><th></th>${rows0.map(r => `<th>${r.h}</th>`).join('')}<th>${t('daySatCol')}</th></tr>
    <tr><th>${t('dayDemand')}</th>${rows0.map(r => `<th>${f0(r.demand)}</th>`).join('')}<th></th></tr></thead><tbody>`;
  DAY.res.forEach((rows, i) => {
    const sat = rows.filter(r => r.state === 'sat').map(r => r.h);
    h += `<tr class="${i === focus ? 'focus' : ''}"><td>${esc(scShort(scenarios[i]))}</td>${dayCells(rows, false)}<td>${sat.length ? esc(hourRanges(sat)) : esc(t('dayNoneSat'))}</td></tr>`;
  });
  tb.innerHTML = h + '</tbody>';
  reco.innerHTML = `<p><strong>${esc(t('dayFocus', scName(scenarios[focus])))}</strong></p><ul>${dayReco(focus).map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
}

Object.assign(I18N.ar, {
  guideTitle: 'كيفية استعمال هذا التطبيق',
  guideBody: `<p><strong>الهدف.</strong> مساعدة البلدية على اختيار التهيئة التي تحمي المترجّلين أكثر عند ممرّ، دون تعطيل حركة المرور، وإعداد مذكّرة الحساب التي تبرّر هذا الاختيار. تقارن الأداة، تحت نفس حركة المرور تمامًا، تسع تهيئات لتهدئة السرعة مع الوضع الحالي.</p>
    <h3>المراحل</h3>
    <ol>
      <li><strong>تحديد الموقع</strong> على الخريطة، ثم «تحليل الموقع»: النهج، والمدارس والمؤسّسات الصحّية القريبة، ومحطّات الحافلات، وكثافة السكّان.</li>
      <li><strong>وصف النهج</strong> في المقطع العرضي، من واجهة إلى أخرى (الأرصفة، والمسالك، وأماكن الوقوف، ومسالك الحافلات والدرّاجات، والفاصل الوسطي، والجزيرة، وأعمدة الإنارة)، وعلى ثلاث مراحل: الوضع الحالي، والمقطع المبرمج في الجزء الجاري (النهج بعد الأشغال، خارج الممرّ)، والمقطع عند الممرّ. ويُحسب هذا الأخير للتهيئة المختارة، ويمكنك تعديله.</li>
      <li><strong>إدخال حركة المرور</strong>: تدفّق الذروة في كل اتجاه، ونسبة العربات الثقيلة والحافلات، والسرعة المقاسة، والمترجّلون، والسرعة القصوى؛ وإن أمكن، عمليات العدّ ساعة بساعة.</li>
      <li><strong>ضبط التهيئات</strong>: أبعاد التضييق والتعرّج، ومدّة الإشارة الضوئية، ثم «تطبيق وإعادة التشغيل».</li>
      <li><strong>مشاهدة المحاكاة</strong>: شريحة متحرّكة لكل تهيئة، مع أرقامها الرئيسية وصورة ثلاثية الأبعاد (اضغط على الصورة المصغّرة). ويعرضها وضع العرض كلّها في شاشة واحدة.</li>
      <li><strong>قراءة النتائج</strong>: الحلّ الموصى به وأسبابه، وجدول الخلاصة، وحركة المرور على مدار اليوم.</li>
      <li><strong>اختيار التهيئة وإعداد مذكّرة الحساب</strong>، للطباعة أو الحفظ بصيغة PDF.</li>
    </ol>
    <h3>وحدة «المفترق»</h3>
    <p>يفتح زرّ «المفترق»، تحت العنوان، أداة المساعدة على اختيار نوع المفترق وفق دليل Certu «Carrefours urbains» (2010). صف السياق (تسلسل الطرق والسرعات)، والهندسة (الفروع، والعرض المتاح، والانحدار، والرؤية)، وحركة الذروة على الطريقين، والمستعملين، وأهداف البلدية. تستبعد الأداة الأنواع غير الملائمة، وتتثبّت من طاقة الاستيعاب (الانتظار على الطريق الثانوية، ومنحنى «إشارات ضوئية أم لا»، واحتياطي الإشارات، والقيم التقريبية للمفترقات الدائرية)، وتقترح الأنواع الواجب مقارنتها مع التهيئات المصاحبة. ثم اختر النوع المعتمد لإعداد مذكّرته.</p>
    <h3>وحدة «المعبّد»</h3>
    <p>يقترح زرّ «المعبّد»، تحت العنوان، تصميمًا أوّليًا لهيكل المعبّد — الطبقات وسُمكها — بعدّة موادّ، وفق دليل Cerema «Voirie urbaine» (2016) والدليل التونسي لسنة 1984: يكفي تحديد الفضاء (نهج، مفترق دائري، حافلات، أماكن وقوف، مسلك درّاجات، رصيف)، وحركة العربات الثقيلة، وطبيعة التربة. وهي قيم تقريبية: عند الشكّ تلزم دراسة معمّقة.</p>
    <h3>حفظ مشروع وفتحه</h3>
    <p>يُنزّل زرّ «حفظ المشروع»، أعلى الصفحة، ملفًّا يحتوي على كل شيء: الموقع، والمعطيات، والمقاطع، واليوم، والمفترق. ويعيد زرّ «فتح مشروع» تحميله. وتُرسَل نسخة من كل حفظ وعنوان IP للحاسوب إلى مشرف التطبيق.</p>
    <h3>المعطيات اللازمة</h3>
    <div class="table-wrap"><table><thead><tr><th>المعطى</th><th>كيفية الحصول عليه</th><th>ضروري؟</th></tr></thead><tbody>
      <tr><td>تدفّق الذروة في كل اتجاه</td><td>عدّ لمدّة ساعة في ذروة الصباح أو المساء</td><td>نعم</td></tr>
      <tr><td>نسبة العربات الثقيلة والحافلات</td><td>نفس العدّ</td><td>نعم</td></tr>
      <tr><td>عروض النهج (المقطع العرضي)</td><td>ديكامتر، أو مخطّط الطرقات، أو صورة جوية</td><td>نعم</td></tr>
      <tr><td>السرعة القصوى</td><td>اللافتات الموجودة</td><td>نعم</td></tr>
      <tr><td>السرعة الفعلية (V85)</td><td>رادار على حوالي مائة عربة منفردة خارج الذروة</td><td>يُنصح به (56 كم/س افتراضيًا)</td></tr>
      <tr><td>المترجّلون عند الممرّ</td><td>عدّ في ساعة الذروة</td><td>يُنصح به</td></tr>
      <tr><td>العدّ ساعة بساعة</td><td>عدّ على مدار يوم</td><td>اختياري (وإلّا فالمنحنى النموذجي)</td></tr>
      <tr><td>موقع الممرّ</td><td>ضغطة على الخريطة</td><td>اختياري، يُنصح به</td></tr>
    </tbody></table></div>
    <h3>أين توجد النتائج</h3>
    <ul>
      <li><strong>في المقطع العرضي</strong>: العروض التي يجب تصحيحها، والمقطع عند الممرّ مع طول العبور.</li>
      <li><strong>في كل شريحة</strong>: السرعة عند الممرّ، وزمن القطع، والطابور، وانتظار المترجّلين، والخطر على مترجّل مصدوم.</li>
      <li><strong>في «النتائج»</strong>: الحلّ الأنسب وأسبابه، والجدول المقارن، وحركة المرور ساعة بساعة.</li>
      <li><strong>في مذكّرة الحساب</strong> (زرّ «إعداد مذكّرة الحساب»): كل ما سبق مشروحًا ببساطة، والموقع على مخطّط موقع وصورة جوية، والمقطع العرضي، والمخطّط بالأبعاد، والإشارات، والإنارة، والأرصفة، والكلفة، وخطّة العمل.</li>
    </ul>
    <p class="note">الأداة تساعد على القرار ولا تعوّض الدراسة. قيمها المرجعية تقريبية ويجب تأكيدها بقياسات محلية.</p>`,

// parcours du piéton au droit du passage : suites d'éléments au niveau de la chaussée, séparées par un refuge d'au moins 1,50 m
function crossStages(segs) {

  const runs = []; let cur = null;

    + `<rect x="${fx(cx - 112)}" y="${top - 80}" width="26" height="14" rx="3" fill="${away ? '#d23a2e' : '#fff6cf'}"/><rect x="${fx(cx + 86)}" y="${top - 80}" width="26" height="14" rx="3" fill="${away ? '#d23a2e' : '#fff6cf'}"/>`;
  const bike = (cx, top) => `<rect x="${fx(cx - 5)}" y="${top - 66}" width="10" height="66" rx="5" fill="#222"/><rect x="${fx(cx - 30)}" y="${top - 112}" width="60" height="7" rx="3" fill="#444"/>` + person(cx, top - 40, 2).replace(/<rect x="[^"]+" y="[^"]+" width="12" height="68" fill="#2f3a4a"\/>/g, '');

}

const fieldDef = k => FIELDS.flatMap(g => g.items).find(f => f.k === k);
function reportDesign(id) {
  const segs = crossOf(id).segs, lanes = segs.filter(s => s.t === 'lane'), out = [];
  if (!lanes.length) return t('pfUseNone');
  const put = (k, v, lab) => {
    const f = fieldDef(k), r = Math.round(v * 20) / 20, c = Math.min(f.max, Math.max(f.min, r));
    $('#p-' + k).value = c; out.push(lab(c) + (Math.abs(c - r) > 1e-9 ? t('dsClamp') : ''));
  };
  const lw = lanes.reduce((a, s) => a + s.w, 0) / lanes.length;
  if (id === 'ret') {
    put('retLane', lw, v => t('dsLane', v));
    const isl = segs.filter(s => s.t === 'island' || s.t === 'median').reduce((a, s) => Math.max(a, s.w), 0);
    if (isl > 0) put('retIsl', isl, v => t('dsIsl', v));
  } else if (id === 'chi') put('chLane', lw, v => t('dsLane', v));

}
// poteau d'éclairage : au bord du trottoir, côté chaussée, sur le trottoir le plus large qui n'en a pas encore ;
// sa largeur est prise sur ce trottoir pour garder la largeur de façade à façade
function placeLamp(segs) {
  const L0 = SEG.lamp.def;
  const cand = segs.map((s, i) => ({ s, i, side: segs.slice(i + 1).some(q => !SEG[q.t].raised) ? 1 : 0 }))
    .filter(c => c.s.t === 'walk')
    .map(c => ({ ...c, at: c.side ? c.i + 1 : c.i, has: segs[c.side ? c.i + 1 : c.i - 1] && segs[c.side ? c.i + 1 : c.i - 1].t === 'lamp' }));
  const free = cand.filter(c => !c.has), pool = free.length ? free : cand;
  if (!pool.length) { segs.push({ t: 'lamp', w: L0, d: 1 }); return; }
  const c = pool.reduce((a, x) => x.s.w > a.s.w ? x : a, pool[0]);
  if (c.s.w > L0 + 0.25) c.s.w = Math.round((c.s.w - L0) * 100) / 100;
  segs.splice(c.at, 0, { t: 'lamp', w: L0, d: 1 });
}

/* glisser-déposer à la souris (façon Streetmix) : on saisit un élément sur le dessin, sa carte, ou un élément de la palette ;
   la limite entre deux éléments la plus proche du pointeur est repérée et marquée ; au lâcher, l'élément y est placé */
const PD = { pend: null, on: false, src: null, ins: -1, x0: 0, y0: 0, ghost: null, noClick: false };
// limites entre éléments, en abscisses écran : sur le dessin (repère du SVG) et dans la rangée des cartes
function drawBounds() {
  const svg = $('#pf-draw svg'); if (!svg) return null;
  const m = svg.getScreenCTM(); if (!m) return null;
  const xs = [0]; for (const s of tabSegs(false)) xs.push(xs[xs.length - 1] + s.w);
  return xs.map(x => m.a * x * 100 + m.e);
}
function cardBounds() {
  const cs = [...document.querySelectorAll('#pf-segs .pseg')].map(c => c.getBoundingClientRect());
  if (!cs.length) return [];
  return [cs[0].left].concat(cs.slice(1).map((r, k) => (cs[k].right + r.left) / 2), [cs[cs.length - 1].right]);
}
const nearest = (bs, x) => bs.reduce((b, v, k) => Math.abs(v - x) < Math.abs(bs[b] - x) ? k : b, 0);
function pdMarkers(ins) {
  document.querySelectorAll('#pf-insline, #pf-insbar').forEach(n => n.remove());
  if (ins < 0) return;
  const svg = $('#pf-draw svg');
  if (svg) {
    const xs = [0]; for (const s of tabSegs(false)) xs.push(xs[xs.length - 1] + s.w);
    svg.insertAdjacentHTML('beforeend', `<line id="pf-insline" x1="${xs[ins] * 100}" y1="6" x2="${xs[ins] * 100}" y2="470" stroke="#1b5ea8" stroke-width="12" stroke-linecap="round"/>`);
  }
  const box = $('#pf-segs'), cb = cardBounds();
  if (box && cb.length) {
    const r = box.getBoundingClientRect();
    box.insertAdjacentHTML('beforeend', `<div id="pf-insbar" style="left:${cb[ins] - r.left + box.scrollLeft - 2}px"></div>`);
  }
}
function pdStart(e, src) {
  if (e.button !== 0 || e.pointerType === 'touch') return;
  PD.pend = src; PD.x0 = e.clientX; PD.y0 = e.clientY;
}
function pdMove(e) {
  if (!PD.pend && !PD.on) return;
  if (!PD.on) {
    if (Math.hypot(e.clientX - PD.x0, e.clientY - PD.y0) < 5) return;
    PD.on = true; PD.src = PD.pend; document.body.classList.add('pf-dragging');
    const N = t('segNames'), sg = PD.src.kind === 'new' ? { t: PD.src.t, w: SEG[PD.src.t].def, d: 1 } : tabSegs(false)[PD.src.i], tp = sg.t;
    PD.ghost = document.createElement('div'); PD.ghost.className = 'pf-ghost';
    // miniature : le dessin de l'élément seul (façades et cote retirées par le cadrage), son nom et sa largeur
    const y0 = /^(bus|trees|lamp)$/.test(tp) ? 0 : 130, pic = profileSVG([sg], sg.w).replace(/viewBox="[^"]+"/, `viewBox="0 ${y0} ${Math.round(sg.w * 100)} ${455 - y0}"`);
    PD.ghost.innerHTML = `<div class="pf-ghost-pic">${pic}</div><div class="pf-ghost-lbl"><span class="sw" style="background:${SEG[tp].color}"></span>${esc(N[tp][0])} · ${fm(sg.w)} ${t('m')}</div>`;
    document.body.appendChild(PD.ghost);
    if (PD.src.kind === 'seg') document.querySelectorAll(`#pf-segs .pseg[data-i="${PD.src.i}"]`).forEach(c => c.classList.add('dragging'));
  }
  e.preventDefault();
  PD.ghost.style.left = e.clientX + 'px'; PD.ghost.style.top = e.clientY + 'px';
  // zone visée : le dessin ou la rangée des cartes (marge de 40 px autour)
  const inZone = el => { if (!el) return false; const r = el.getBoundingClientRect(); return e.clientX > r.left - 40 && e.clientX < r.right + 40 && e.clientY > r.top - 40 && e.clientY < r.bottom + 40; };
  let ins = -1;
  if (inZone($('#pf-draw'))) { const b = drawBounds(); if (b) ins = nearest(b, e.clientX); }
  else if (inZone($('#pf-segs'))) { const b = cardBounds(); if (b.length) ins = nearest(b, e.clientX); }
  // poser un élément à sa propre place ne change rien : pas de marque
  if (PD.src.kind === 'seg' && (ins === PD.src.i || ins === PD.src.i + 1)) ins = -1;
  if (ins !== PD.ins) { PD.ins = ins; pdMarkers(ins); }
}
function pdEnd() {
  const was = PD.on, src = PD.src, ins = PD.ins;
  PD.pend = null; PD.on = false; PD.src = null; PD.ins = -1;
  if (!was) return;
  PD.noClick = true; setTimeout(() => { PD.noClick = false; }, 0);
  document.body.classList.remove('pf-dragging');
  if (PD.ghost) { PD.ghost.remove(); PD.ghost = null; }
  pdMarkers(-1);
  document.querySelectorAll('#pf-segs .pseg.dragging').forEach(c => c.classList.remove('dragging'));
  if (ins < 0) return;
  const segs = tabSegs(true);
  if (src.kind === 'seg') { const [s] = segs.splice(src.i, 1); segs.splice(ins > src.i ? ins - 1 : ins, 0, s); }
  else {
    // poteau posé contre un trottoir : sa largeur est prise sur ce trottoir, comme avec le bouton
    const w = SEG[src.t].def, nb = [segs[ins - 1], segs[ins]].find(s => s && s.t === 'walk' && s.w > w + 0.25);
    if (src.t === 'lamp' && nb) nb.w = Math.round((nb.w - w) * 100) / 100;
    segs.splice(ins, 0, { t: src.t, w, d: 1 });
  }
  saveProf(); renderProfile(true);
}
$('#profil').addEventListener('pointerdown', e => {
  const pal = e.target.closest('[data-add]');
  if (pal) { pdStart(e, { kind: 'new', t: pal.dataset.add }); return; }
  const card = e.target.closest('#pf-segs .pseg');
  if (card) { if (!e.target.closest('button, input, select')) pdStart(e, { kind: 'seg', i: +card.dataset.i }); return; }
  const svg = e.target.closest('#pf-draw svg');
  if (svg) {
    const m = svg.getScreenCTM(); if (!m) return;
    const xm = (e.clientX - m.e) / m.a / 100;
    let x = 0, i = -1; tabSegs(false).forEach((s, k) => { if (xm >= x && xm < x + s.w) i = k; x += s.w; });
    if (i >= 0) pdStart(e, { kind: 'seg', i });
  }
});

window.addEventListener('pointerup', pdEnd);
window.addEventListener('pointercancel', pdEnd);

// mode d'emploi propre au module carrefour (remplace celui de la traversée quand le module est ouvert)
Object.assign(JXT.fr, { guideBody: `<p><strong>Objectif.</strong> Aider une commune à choisir le type de carrefour le mieux adapté (priorité à droite, cédez-le-passage, stop, mini-giratoire, giratoire compact, moyen ou grand, carrefour à feux avec ou sans îlot central, passage souterrain) en appliquant une à une les règles du guide Certu « Carrefours urbains » (2010), puis produire la note qui justifie ce choix. Le bouton « Traversée piétonne », sous le titre, ramène au comparateur des aménagements de traversée.</p>
    <h3>Les étapes</h3>
    <ol>
      <li><strong>Situer le carrefour</strong> sur la carte (facultatif) : il figurera dans la note, avec un plan de situation et une vue aérienne.</li>
      <li><strong>Décrire le contexte</strong> : milieu (centre dense, urbain, périurbain), place de chaque voie dans la hiérarchie du réseau, vitesses limites, route prioritaire, entrée d’agglomération.</li>
      <li><strong>Décrire la géométrie</strong> : nombre de branches et leurs angles, voies par sens, largeur de la chaussée principale, diamètre du cercle disponible entre façades, pente, visibilité depuis la voie secondaire.</li>
      <li><strong>Saisir le trafic de l’heure de pointe</strong> sur chaque voie (deux sens), la part de poids lourds et de bus, les tourne-à-gauche et tourne-à-droite les plus chargés.</li>
      <li><strong>Décrire les usagers</strong> (piétons, cyclistes, transports collectifs) et cocher les <strong>objectifs</strong> de la commune.</li>
      <li><strong>Lire le résultat</strong> : types à comparer en priorité, graphique « feux ou pas de feux », tableau de tous les types avec leur avis et leurs raisons, aménagements associés. Tout se met à jour à chaque modification.</li>
      <li><strong>Choisir le type retenu et produire la note</strong>, à imprimer ou à enregistrer en PDF.</li>
    </ol>
    <h3>Les données nécessaires</h3>
    <div class="table-wrap"><table><thead><tr><th>Donnée</th><th>Comment l’obtenir</th><th>Indispensable ?</th></tr></thead><tbody>
      <tr><td>Trafic de pointe de chaque voie, deux sens</td><td>Comptage d’une heure à la pointe, sur chaque branche</td><td>Oui</td></tr>
      <tr><td>Part de poids lourds et de bus</td><td>Même comptage</td><td>Oui</td></tr>
      <tr><td>Tourne-à-gauche et tourne-à-droite</td><td>Comptage directionnel (le guide demande deux heures de pointe)</td><td>Conseillé</td></tr>
      <tr><td>Hiérarchie des voies et vitesses limites</td><td>Plan de circulation, panneaux en place</td><td>Oui</td></tr>
      <tr><td>Emprise disponible (diamètre entre façades)</td><td>Plan, image satellite ou décamètre</td><td>Oui</td></tr>
      <tr><td>Pente et visibilité</td><td>Visite sur place</td><td>Oui</td></tr>
      <tr><td>Piétons, cyclistes, lignes de bus ou de tramway</td><td>Observation sur place, exploitant des transports</td><td>Conseillé</td></tr>
      <tr><td>Emplacement du carrefour</td><td>Clic sur la carte</td><td>Facultatif</td></tr>
    </tbody></table></div>
    <h3>Où trouver les résultats</h3>
    <ul>
      <li><strong>Dans « Résultat »</strong> : les types à comparer en priorité, le trafic converti en uvp, le graphique « feux ou pas de feux » et un schéma de principe.</li>
      <li><strong>Dans le tableau</strong> : l’avis sur chaque type (conseillé, possible, déconseillé, exclu), sa capacité et toutes ses raisons, avec la page du guide (clic sur une ligne).</li>
      <li><strong>Dans la note</strong> (bouton « Générer la note du carrefour ») : les données, l’analyse critère par critère, la comparaison des types, le type retenu avec ses dimensions, ses aménagements associés et sa signalisation, et le plan d’action.</li>
      <li><strong>Enregistrer le projet</strong>, en haut de la page, conserve aussi les données du carrefour.</li>
    </ul>

  L.push(id === 'pad' ? jt('pedPad') : sansFeux ? jt('pedClp') : gir ? jt('pedGir') : fx ? jt('pedFx') : '');

/* ---------- schéma de principe du type (vue en plan, circulation à droite) ----------
   Repère local de chaque branche : axe +x en s'éloignant du carrefour ; voie d'entrée du côté y < 0 (à droite du
   conducteur qui arrive), voie de sortie du côté y > 0. Dimensions tirées du guide (rayons, anneau, îlots, reculs). */
function jxSketch(id, J) {
  const Wd = 520, Hd = 380, cx = Wd / 2, cy = Hd / 2, o = [], fx = v => v.toFixed(1);
  const n = J.nBr, angs = n === 3 ? [0, 90, 180] : Array.from({ length: n }, (_, i) => i * 360 / n);
  const wm = Math.max(J.widthMain, 3 * 2 * J.lanesMain), ws = Math.max(5.5, 3 * 2 * J.lanesSec);
  const isMain = i => n >= 5 || (n === 4 ? i % 2 === 0 : i !== 1), bw = i => isMain(i) ? wm : ws;
  const ring = GIR.includes(id) || id === 'feuxIlot';
  const Rext = { mini: 9, compact: 13.5, moyen: 18, grand: 25, feuxIlot: 18 }[id] || 0;       // rayons extérieurs (p. 124-125, 121)
  const Ri = { mini: 2, compact: 6.5, moyen: 11, grand: 17, feuxIlot: 10 }[id] || 0;         // îlot central (mini : 1,50 à 2,50 m, p. 129)
  const core = ring ? Rext : Math.max(wm, ws) / 2;

  const plateau = ['pad', 'clp', 'stop', 'feux', 'mini', 'compact'].includes(id) && J.ctx !== 'periurbain' && (J.speed || J.hMain === 'quartier' || J.hSec === 'quartier');
  o.push(`<rect width="${Wd}" height="${Hd}" fill="#e4ebdf"/>`);
  // trottoirs (3 m) puis chaussées ; zone du carrefour arrondie (pans coupés)
  o.push(`<circle cx="${cx}" cy="${cy}" r="${m(core + 4)}" fill="#d9d2c3"/>`);
  angs.forEach((a, i) => { const w = bw(i); o.push(rot(a, `<rect x="${cx}" y="${fx(Y(-w / 2 - 3))}" width="${Wd}" height="${m(w + 6)}" fill="#d9d2c3"/>`)); });
  angs.forEach((a, i) => { const w = bw(i); o.push(rot(a, `<rect x="${cx}" y="${fx(Y(-w / 2))}" width="${Wd}" height="${m(w)}" fill="#5b6169"/>`)); });
  o.push(`<circle cx="${cx}" cy="${cy}" r="${m(ring ? Rext : core)}" fill="#5b6169"/>`);
  if (plateau) o.push(`<circle cx="${cx}" cy="${cy}" r="${m(core + 8)}" fill="#a5503d" fill-opacity=".13" stroke="#a5503d" stroke-width="1.2" stroke-dasharray="5 4"/>`);
  const isl = ring && id !== 'mini';                          // îlots séparateurs (p. 127) ; facultatifs sur un mini-giratoire
  angs.forEach((a, i) => {
    const w = bw(i), s = [];

    // axe de chaussée (tirets) au-delà du carrefour et des îlots
    s.push(`<line x1="${fx(X(isl ? xIsl1 + 1 : core + 9))}" y1="${cy}" x2="${Wd}" y2="${cy}" stroke="#fff" stroke-width="1.5" stroke-dasharray="${m(3)} ${m(3.5)}"/>`);
    if (isl) s.push(`<rect x="${fx(X(xIsl0))}" y="${fx(Y(-1))}" width="${m(xIsl1 - xIsl0)}" height="${m(2)}" rx="${m(1)}" fill="#c4d3ae" stroke="#fff" stroke-width="1"/>`);
    // passages piétons : le guide déconseille de les marquer en priorité à droite (p. 100) ; en cédez-le-passage et stop,

    }

      o.push(`<path d="M${fx(px - tx * L / 2)} ${fx(py - ty * L / 2)}L${fx(px + tx * L / 2)} ${fx(py + ty * L / 2)}" stroke="#fff" stroke-width="1.6" marker-end="url(#jxa)"/>`);
    }

}
