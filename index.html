<html lang="fr" dir="ltr">
<head>

<title>Comparateur de modération des vitesses</title>
<style>
/* Mise en page : planche technique. Bandeau de commandes collant, une bande en plan par aménagement
   (vignette 3D devant), empilées sur la même échelle ; verdict, synthèse, hypothèses, méthode. */
:root {
  --bg: #eceff0;
  --surface: #f7f9f9;
  --ink: #17212b;
  --muted: #5b6770;
  --line: #ccd4d8;
  --accent: #1b5ea8;
  --accent-ink: #ffffff;
  --ok: #23774a;
  --warn: #9a6512;
  --bad: #b0303c;
  --zone: rgba(27, 94, 168, .10);
  /* plan */
  --verge: #d3dcd4;
  --walk: #c3c9cc;
  --curb: #8f989e;
  --asphalt: #3b4148;
  --mark: #f3f5f6;
  --bump: #5d656e;
  --bump-ramp: #4c535b;
  --raised: #8a5443;
  --raised-ramp: #6f4336;
  --pave: #6e6a66;
  --pave-joint: #8b8681;
  --island: #9db28d;
  --ped: #ffd23f;
  --ped-ring: #1d1f22;
  --brake: #ff4040;
  --shadow: rgba(0, 0, 0, .30);
  --glass: #1c2834;
  --roof: rgba(255, 255, 255, .18);
  --roof-unit: #d5d9dd;
  --headlight: #fff7d9;
  --tail: #7d1d23;
  --rib: rgba(0, 0, 0, .16);
  --shade: rgba(0, 0, 0, .18);
  --box: #e2e5e8;
  --sp1: #23b5a5; --sp2: #74c45a; --sp3: #f1c232; --sp4: #f08a2c; --sp5: #e5414b;
  --sig-g: #2fd16f; --sig-a: #f5b301; --sig-r: #ef3b34;
  --day-ok: #cfe9d6; --day-files: #f7dfae; --day-sat: #f2b8b8; --day-ink: #17212b;
  --font-display: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --leftcol: clamp(290px, 22vw, 390px);
  --rowh: 90px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418; --surface: #171c21; --ink: #e4e9ec; --muted: #98a4ad; --line: #2b333a;
    --accent: #72aaea; --accent-ink: #0c1622; --ok: #5cc08a; --warn: #e3ab4c; --bad: #f07a83;
    --zone: rgba(114, 170, 234, .13);
    --verge: #1a231f; --walk: #3d444a; --curb: #59626a; --asphalt: #2a2f35; --mark: #d9dee2;
    --bump: #4c535a; --bump-ramp: #3e444b; --raised: #74463a; --raised-ramp: #5d372d;
    --pave: #57534f; --pave-joint: #6d6863; --island: #4c5e43; --ped-ring: #0d0f11; --brake: #ff5050;
    --shadow: rgba(0, 0, 0, .42); --glass: #121a22; --roof: rgba(255, 255, 255, .14); --roof-unit: #a7aeb5;
    --headlight: #f4ecc8; --tail: #6d1a1f; --rib: rgba(0, 0, 0, .22); --shade: rgba(0, 0, 0, .22); --box: #c9cdd2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418; --surface: #171c21; --ink: #e4e9ec; --muted: #98a4ad; --line: #2b333a;
  --accent: #72aaea; --accent-ink: #0c1622; --ok: #5cc08a; --warn: #e3ab4c; --bad: #f07a83;
  --zone: rgba(114, 170, 234, .13);
  --verge: #1a231f; --walk: #3d444a; --curb: #59626a; --asphalt: #2a2f35; --mark: #d9dee2;
  --bump: #4c535a; --bump-ramp: #3e444b; --raised: #74463a; --raised-ramp: #5d372d;
  --pave: #57534f; --pave-joint: #6d6863; --island: #4c5e43; --ped-ring: #0d0f11; --brake: #ff5050;
  --shadow: rgba(0, 0, 0, .42); --glass: #121a22; --roof: rgba(255, 255, 255, .14); --roof-unit: #a7aeb5;
  --headlight: #f4ecc8; --tail: #6d1a1f; --rib: rgba(0, 0, 0, .22); --shade: rgba(0, 0, 0, .22); --box: #c9cdd2;
  color-scheme: dark;
}
/* arabe : polices système qui portent l'écriture arabe ; jamais d'espacement de lettres (il casse les liaisons) */
html[lang="ar"] {
  --font-display: "Segoe UI", Tahoma, "Noto Sans Arabic", "Geeza Pro", Arial, sans-serif;
  --font-body: "Segoe UI", Tahoma, "Noto Sans Arabic", "Geeza Pro", Arial, sans-serif;
}
html[lang="ar"] * { letter-spacing: 0 !important; text-transform: none !important; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 36px); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
.num { unicode-bidi: isolate; direction: ltr; }

header.top { padding-block: 30px 18px; }
.eyebrow { margin: 0 0 8px; font: 600 12px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0 0 10px; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.12; font-weight: 600; }
.lede { margin: 0; max-width: 72ch; color: var(--muted); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-block: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.group-label { font: 500 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-inline-end: 2px; }
.btn { font: 600 13px/1 var(--font-display); letter-spacing: .02em; padding: 8px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: progress; }
.lang-switch { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.lang-switch .btn { font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-size: 14px; letter-spacing: 0; }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; margin-inline-start: -1px; }
.seg .btn:first-child { border-start-start-radius: 6px; border-end-start-radius: 6px; margin-inline-start: 0; }
.seg .btn:last-child { border-start-end-radius: 6px; border-end-end-radius: 6px; }
.clock { font: 600 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.clock small { display: block; font: 500 11px/1.3 var(--font-body); color: var(--muted); }
.legend { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.ramp-wrap { display: grid; gap: 2px; direction: ltr; }
.ramp { width: 150px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, var(--sp1) 0%, var(--sp1) 25%, var(--sp2) 37.5%, var(--sp3) 50%, var(--sp4) 62.5%, var(--sp5) 75%, var(--sp5) 100%); }
.ramp-ticks { display: flex; justify-content: space-between; width: 150px; font: 500 10px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ped-key { display: inline-flex; align-items: center; gap: 5px; }
.ped-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ped); border: 1px solid var(--ped-ring); }
.ped-dot.late { border: 2px solid var(--bad); }

main { padding-block: 6px 48px; }

.block-top { padding-block: 6px 24px; }
.block-top > h2 { margin-top: 0; }
.verdict { margin-block: 12px 8px; padding: 16px 18px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); }
.verdict .eyebrow { margin-bottom: 4px; }
.verdict h3 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.sum-title { margin: 26px 0 6px; font-size: 18px; font-weight: 600; }
#note-gen .note-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 18px; margin-bottom: 12px; }
.nf { display: grid; gap: 4px; min-width: 0; }
.nf > span { color: var(--muted); font: 500 11px/1.2 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.nf select, .nf input, .ptable input { font: 500 14px/1.2 var(--font-body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); min-width: 0; width: 100%; }
.nf select:focus-visible, .nf input:focus-visible, .ptable input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ptable { min-width: 560px; }
.ptable td { text-align: start; }
.ptable td:nth-child(2) { width: 130px; }
.ptable input { text-align: right; direction: ltr; }
.guide details { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 16px; }
.guide summary { cursor: pointer; padding: 12px 0; font: 600 17px/1.3 var(--font-display); }
.guide summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.guide .gbody { padding-bottom: 14px; max-width: 115ch; font-size: 14.5px; }
.guide .gbody h3 { margin: 14px 0 4px; font-size: 15px; font-weight: 600; }
.guide .gbody ol, .guide .gbody ul { padding-inline-start: 22px; margin: 4px 0; }
.guide .gbody li { margin: 4px 0; }
.guide .gbody table { min-width: 680px; }
.guide .gbody td, .guide .gbody th { text-align: start; }
.prof { margin-bottom: 18px; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.prof h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.prof h4 { margin: 16px 0 6px; font: 600 14px/1.3 var(--font-display); }
.prof-tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; margin: 8px 0; }
.prof-tools label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.prof-tools input, .prof-tools select { font: 500 14px/1.2 var(--font-body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.prof-tools input { width: 90px; direction: ltr; text-align: right; }
.prof-preset { display: contents; }
.prof-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
.prof-hint { margin: 4px 0 6px; }
.prof-status { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 0 0 6px; font-size: 13.5px; color: var(--muted); }
.prof-status select { font: 500 14px/1.2 var(--font-body); padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); margin-inline-start: 6px; }
#pf-acts { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.prof-palette { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 10px; }
.prof-palette .btn { padding: 6px 9px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(0, 0, 0, .25); flex: none; }
.prof-draw { direction: ltr; border-radius: 4px; border: 1px solid var(--line); overflow-x: auto; background: #eef3f6; }
.prof-draw svg { display: block; width: 100%; min-width: 620px; height: auto; max-height: 360px; }
.prof-segs { direction: ltr; display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; }
.pseg { flex: 0 0 auto; width: 138px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 6px; display: grid; gap: 5px; font-size: 12.5px; cursor: grab; }
.pseg.dragging { opacity: .35; }
.prof-segs { position: relative; }
#pf-insbar { position: absolute; top: 4px; bottom: 0; width: 4px; border-radius: 2px; background: var(--accent); pointer-events: none; }
.prof-draw svg, .pseg, .prof-palette .btn { user-select: none; }
.prof-draw svg { cursor: grab; }
body.pf-dragging, body.pf-dragging * { cursor: grabbing !important; user-select: none; }
.pf-ghost { position: fixed; z-index: 50; pointer-events: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 5px; background: var(--surface); border: 1px solid var(--accent); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); font: 600 12.5px/1.2 var(--font-display); color: var(--ink); }
.pseg .nm { font: 600 12.5px/1.2 var(--font-display); display: flex; align-items: center; gap: 6px; min-height: 30px; }
.pseg .wrow { display: flex; align-items: center; gap: 3px; }
.pseg input { width: 58px; font: 500 13px/1.2 var(--font-display); padding: 3px 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--ink); text-align: right; }
.pseg .mini { padding: 3px 7px; font-size: 12px; line-height: 1.2; }
.pseg .mini.dir { width: 100%; }
.prof-checks { margin-top: 6px; font-size: 13.5px; display: grid; gap: 3px; }
@keyframes pf-blink { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }
@keyframes pf-card-bad { 0%, 100% { box-shadow: 0 0 0 3px var(--bad); } 50% { box-shadow: 0 0 0 3px transparent; } }
@keyframes pf-card-warn { 0%, 100% { box-shadow: 0 0 0 3px var(--warn); } 50% { box-shadow: 0 0 0 3px transparent; } }
.prof-draw .pf-flag { animation: pf-blink 1.1s ease-in-out infinite; }
.pseg.flag-bad { border-color: var(--bad); animation: pf-card-bad 1.1s ease-in-out infinite; }
.pseg.flag-warn { border-color: var(--warn); animation: pf-card-warn 1.1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .prof-draw .pf-flag, .pseg.flag-bad, .pseg.flag-warn { animation: none; } .pseg.flag-bad { box-shadow: 0 0 0 3px var(--bad); } .pseg.flag-warn { box-shadow: 0 0 0 3px var(--warn); } }
.prof-checks .bad { color: var(--bad); } .prof-checks .warn { color: var(--warn); } .prof-checks .ok { color: var(--ok); } .prof-checks .info { color: var(--muted); }
.site-map { margin-bottom: 18px; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.site-map h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.map-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.map-tools input { flex: 1 1 220px; min-width: 0; font: 500 14px/1.2 var(--font-body); padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.map-tools input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#map { height: 360px; border-radius: 4px; border: 1px solid var(--line); direction: ltr; background: var(--verge); }
.map-msg { font-size: 13px; color: var(--muted); }
#site-info { margin-top: 12px; display: grid; gap: 10px; font-size: 14px; }
#site-info:empty { display: none; }
#site-info h4 { margin: 6px 0 2px; font: 600 13px/1.3 var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
#site-info ul { margin: 0; padding-inline-start: 20px; }
#site-info .warn { color: var(--warn); }
#site-info .reco { padding: 10px 12px; border: 1px solid var(--accent); border-radius: 6px; }
.day-in { margin-top: 18px; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.day-in h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.day-in .modes { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0; font-size: 14px; }
table.dayin { min-width: 900px; font-size: 12.5px; }
table.dayin th, table.dayin td { padding: 4px 5px; text-align: center; }
table.dayin th:first-child, table.dayin td:first-child { text-align: start; white-space: nowrap; }
table.dayin input { width: 52px; font: 500 12.5px/1.2 var(--font-display); padding: 3px 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); color: var(--ink); text-align: right; direction: ltr; }
table.dayin input:disabled { opacity: .45; }
table.dayres { min-width: 1000px; font-size: 12px; }
table.dayres th, table.dayres td { padding: 4px 3px; text-align: center; border-bottom: 1px solid var(--line); }
table.dayres td:first-child, table.dayres th:first-child { text-align: start; white-space: nowrap; padding-inline: 8px; }
table.dayres td:last-child { text-align: start; white-space: nowrap; padding-inline: 8px; }
table.dayres td.c-ok { background: var(--day-ok); color: var(--day-ink); }
table.dayres td.c-files { background: var(--day-files); color: var(--day-ink); }
table.dayres td.c-sat { background: var(--day-sat); color: var(--day-ink); font-weight: 600; }
table.dayres tr.focus td:first-child { font-weight: 700; }
#day-reco { margin-top: 10px; font-size: 14px; }
#day-reco ul { margin: 4px 0; padding-inline-start: 20px; }
details.prices { margin-bottom: 14px; }
details.prices summary { cursor: pointer; font: 600 13px/1.4 var(--font-display); color: var(--accent); padding-block: 4px; }
.verdict p { margin: 4px 0; max-width: 110ch; font-size: 14px; }
.verdict .v-rule, .verdict .v-excl { color: var(--muted); font-size: 13px; }
.verdict .v-warn { color: var(--bad); font-weight: 600; }

.strip { padding-block: 16px 14px; border-bottom: 1px solid var(--line); }
.strip.ref, .strip.best { margin-inline: calc(-1 * clamp(8px, 1.5vw, 18px)); padding-inline: clamp(8px, 1.5vw, 18px); border-radius: 6px; }
.strip.ref { background: linear-gradient(var(--zone), var(--zone)); }
.strip.best { box-shadow: inset 0 0 0 2px var(--accent); }
.strip-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 22px; margin-bottom: 10px; }
.thumb { flex: none; width: 176px; aspect-ratio: 16 / 9; padding: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--verge); cursor: zoom-in; align-self: center; max-width: 100%; }
.thumb:hover { border-color: var(--accent); }
.thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
body.no3d .thumb { display: none; }
.strip-title { flex: 1 1 320px; min-width: 0; }
.strip h3 { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 19px; line-height: 1.25; font-weight: 600; }
.desc { margin: 3px 0 0; font-size: 13px; color: var(--muted); max-width: 86ch; }
.pill { font: 600 10.5px/1 var(--font-display); letter-spacing: .07em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.pill.rec { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sh { display: none; }
.kpis { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 22px; margin: 0; }
.kpis dt { font: 500 10.5px/1.2 var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.kpis dd { margin: 2px 0 0; font: 600 19px/1.1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpis dd small { font-size: 12px; font-weight: 500; color: var(--muted); }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .bad-t { color: var(--bad); }
canvas.plan { display: block; width: 100%; border-radius: 4px; }
.qrow { direction: ltr; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; min-height: 18px; margin-bottom: 4px; font: 600 12px/18px var(--font-display); letter-spacing: .02em; color: var(--bad); font-variant-numeric: tabular-nums; }
.qrow span:last-child { margin-left: auto; text-align: right; }

section.block { padding-top: 34px; }
h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.note { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; max-width: 100ch; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 1000px; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: end; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: start; }
thead th { font: 600 11px/1.25 var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; }
thead th span { display: block; font-weight: 500; text-transform: none; letter-spacing: 0; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.ref td { background: var(--zone); }
tbody tr.best td { box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); font-weight: 600; }
td.name { font-family: var(--font-display); font-weight: 600; font-size: 14px; white-space: nowrap; }

form#params { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }

  method: crit => `
    <div>
      <h3>ما يتمّ حسابه</h3>
      <ul>
        <li><strong>حركة المرور.</strong> تتبع كل عربة نموذج التتبّع IDM: تتسارع نحو سرعتها المرغوبة وتفرمل للمحافظة على فاصل زمني مع العربة التي أمامها. ومن ذلك تنتج الفرملة والطوابير وتلاشيها.</li>
        <li><strong>نفس الوصولات في كل الشرائح.</strong> تُسحب العربات (لحظة الوصول، النوع، طبع السائق) والمترجّلون مرّة واحدة، ثم تُحقن بشكل مطابق في كل الشرائح. وبالتالي فإنّ الفوارق بين الشرائح ناتجة عن التهيئة وحدها.</li>
        <li><strong>المترجّلون.</strong> يعبر المترجّل عندما تكون الفجوة كافية (زمن العبور مع هامش) أو عندما يُفسح له سائق المرور. كل سائق يرى مترجّلًا ينتظر يقرّر مرّة واحدة ما دام قادرًا على التوقّف بتباطؤ 3 م/ث²، واحتمال إفساحه مرتبط بالسرعة التي سيمرّ بها عند الممرّ. إذا رأى المترجّل متأخّرًا لا يُفسح. والسائق الذي توقّف دون جدوى ينطلق بعد 8 ث. دون جزيرة، يفرض المترجّل الذي شرع في عبور المسلك الأوّل التوقّف على المسلك الثاني إذا كانت العربة قادرة على التوقّف بتباطؤ 3 م/ث². ومع جزيرة لا يقلّ عرضها عن 1,50 م يتمّ العبور على مرحلتين.</li>
        <li><strong>الخطورة.</strong> يظهر مترجّل فجأة على بعد <em>D</em> متر أمام كل عربة: يتفاعل السائق ثم يفرمل بأقصى قوّة. وتعطي السرعة المتبقّية لحظة الصدم خطر الوفاة <span class="formula">P = 1 / (1 + e<sup>6,9 − 0,090 v</sup>)</span> (Rosén وSander، 2009؛ v بالكم/س).</li>
        <li><strong>التقييم.</strong> الأرقام المعروضة هي متوسّط خمس محاكاة مدّة كل منها ساعة، بسحوبات مختلفة لكنها محدّدة مسبقًا. ولذلك لا يمكن اختيار سحب ملائم.</li>
        <li><strong>المؤشّرات.</strong> تُقاس V85 في وسط الممرّ. يُحتسب زمن القطع انطلاقًا من موعد الوصول المتوقّع، بما في ذلك الانتظار عند المدخل. الطابور: العربات التي تقلّ سرعتها عن 8 كم/س قبل التهيئة.</li>
      </ul>
    </div>
    <div>
      <h3>ما يُعطى كمُدخل</h3>
      <ul>
        <li><strong>سرعة عبور المطبّات</strong> (V85 حسب صنف العربة). لا يحسبها أيّ نموذج لحركة المرور، بل مصدرها القياسات. والقيم المقترحة تقريبية ويجب تعويضها بقياسات على منشآت مماثلة.</li>
        <li><strong>التعرّج.</strong> تُستنتج سرعته من الهندسة: نصف قطر المسار الأسرع <span class="formula">R = L² / (4 e<sub>eff</sub>)</span>، حيث <em>e<sub>eff</sub></em> هي الإزاحة ناقص الهامش الجانبي المتاح داخل المسلك، ثم <span class="formula">V = 8,76 R<sup>0,386</sup></span>.</li>

/* ---------- demande commune ---------- */
class Demand {
  constructor(P) {
    this.P = P; this.nextId = 1;
    this.lanes = [0, 1].map(k => ({ r: mulberry32(P.seed * 1009 + 11 + k * 7919), list: [], tNext: 0 }));
    for (const ln of this.lanes) ln.tNext = this.headway(ln.r, 0) * ln.r();
    this.ped = { r: mulberry32(P.seed * 1009 + 5003), list: [], tNext: 0 };
    this.ped.tNext = this.pedGap(0);
  }
  // débit éventuellement variable dans le temps (journée simulée : P.qAt, P.pedAt)
  headway(r, t) { const q = this.P.qAt ? this.P.qAt(t) : this.P.q, m = 3600 / Math.max(1, q), hmin = Math.min(1, m); return hmin + (m - hmin) * -Math.log(1 - r()); }
  pedGap(t) {
    const q = this.P.pedAt ? this.P.pedAt(t) : this.P.qPed;
    return q > 0 ? -Math.log(1 - this.ped.r()) * 3600 / q : (this.P.pedAt ? 600 : Infinity);
  }
  veh(k, t) {
    const ln = this.lanes[k];
    while (ln.tNext <= t + 1) {
      const r = ln.r;
      ln.list.push({ id: this.nextId++, t: ln.tNext, pl: r() < this.P.pPL / 100, z: clampZ(gauss(r)) });
      ln.tNext += this.headway(r, ln.tNext);
    }
    return ln.list;
  }
  peds(t) {
    const p = this.ped;
    while (p.tNext <= t + 1) {
      const q = this.P.pedAt ? this.P.pedAt(p.tNext) : this.P.qPed;
      if (q > 0) p.list.push({ t: p.tNext, side: p.r() < 0.5 ? 0 : 1, xo: (p.r() - 0.5) * 2.6 });
      p.tNext += this.pedGap(p.tNext);
    }
    return p.list;
  }
}

/* ---------- scénarios (géométrie indépendante de la langue) ---------- */
function chicaneSpeed(P, wVeh) {
  const slack = Math.max(0, P.chLane - wVeh - 0.6);
  const eEff = Math.max(0.3, P.chOff - slack);
  const R = P.chTrans * P.chTrans / (4 * eEff);
  return { R, v: 8.76 * Math.pow(R, 0.3861) };
}
function buildScenarios(P) {
  const capZ = (xa, xb, vl, pl) => ({ xa, xb, kind: 'cap', VL: vl / KMH, PL: pl / KMH });
  const facZ = (xa, xb, p, lane) => ({ xa, xb, kind: 'fac', f: 1 - p / 100, lane });
  const W = P.laneW, flat = () => ({ yc: 0, lw: W, wi: 0 });
  const cVL = chicaneSpeed(P, CLS.VL.w), cPL = chicaneSpeed(P, CLS.PL.w), Lt = P.chTrans;
  const reg = 2 * P.q * 10 > 3000;   // heure de pointe ≈ 10 % du trafic journalier
  return [
    { id: 'ref', zones: [], geom: flat, feats: [], info: {} },
    { id: 'dos', reg, zones: [capZ(XC - 12, XC - 8, P.dosVL, P.dosPL), capZ(XC + 8, XC + 12, P.dosVL, P.dosPL)], geom: flat,
      feats: [{ t: 'hump', xa: XC - 12, xb: XC - 8 }, { t: 'hump', xa: XC + 8, xb: XC + 12 }], info: {} },
    { id: 'trap', reg, zones: [capZ(XC - 3.2, XC + 3.2, P.trapVL, P.trapPL)], geom: flat,
      feats: [{ t: 'table', xa: XC - 3.2, xb: XC + 3.2, ramp: 1.2, raised: false }], info: {} },
    { id: 'plat', zones: [capZ(XC - 5.5, XC + 5.5, P.platVL, P.platPL)], geom: flat,
      feats: [{ t: 'table', xa: XC - 5.5, xb: XC + 5.5, ramp: 1.5, raised: true }], info: {} },
    { id: 'cous', zones: [capZ(XC - 11.5, XC - 8.5, P.cousVL, P.cousPL), capZ(XC + 8.5, XC + 11.5, P.cousVL, P.cousPL)], geom: flat,
      feats: [{ t: 'cushion', xa: XC - 11.5, xb: XC - 8.5 }, { t: 'cushion', xa: XC + 8.5, xb: XC + 11.5 }], info: {} },
    { id: 'ret', zones: [facZ(XC - 15, XC + 15, P.retPct)],
      geom: x => { const r = bell(x, XC - 15, XC - 7, XC + 7, XC + 15); return { yc: 0, lw: W + (P.retLane - W) * r, wi: P.retIsl * r }; },
      feats: [{ t: 'island' }], info: { island: P.retIsl >= ISLAND_MIN } },
    { id: 'chi', zones: [capZ(XC - 5 - Lt, XC + 5 + Lt, cVL.v, cPL.v)],
      geom: x => { const r = bell(x, XC - 5 - Lt, XC - 5, XC + 5, XC + 5 + Lt); return { yc: -P.chOff / 2 + P.chOff * r, lw: W + (P.chLane - W) * r, wi: 0 }; },
      feats: [], info: { R: cVL.R, vVL: cVL.v, vPL: cPL.v } },
    { id: 'rev', zones: [facZ(XC - 20, XC + 20, P.revPct)], geom: flat, feats: [{ t: 'pave', xa: XC - 20, xb: XC + 20 }], info: {} },
    // bandes rugueuses : seulement sur la voie qui s'approche du passage
    { id: 'rug', zones: [facZ(XC - 62, XC - 2, P.rugPct, 0), facZ(XC + 2, XC + 62, P.rugPct, 1)], geom: flat,
      feats: [XC - 62, XC - 42, XC - 22].map(x0 => ({ t: 'rumble', lane: 0, x0 })).concat([XC + 18, XC + 38, XC + 58].map(x0 => ({ t: 'rumble', lane: 1, x0 }))), info: {} },
    // feu piéton : aucun effet sur la vitesse désirée ; le rouge arrête les véhicules
    { id: 'sig', signal: true, zones: [], geom: flat, feats: [{ t: 'signal' }], info: { clear: Math.ceil(2 * W / SIG.vClear) } }

function stats(sim) {
  const st = sim.st, tm = Math.max(DT, sim.t - WARMUP);

    tt: st.nExit ? st.sumTT / st.nExit : NaN,
    flow, pending,
    sat: flow < 0.96 * sim.P.q && pending >= 5,
    stopPct: st.nExit ? 100 * st.nStop / st.nExit : NaN,
    qAvg: st.qInt / tm, qMax: st.qMax,
    pedW: st.pedN ? st.pedSum / st.pedN : NaN,
    yieldPct: st.yYes + st.yNo ? 100 * st.yYes / (st.yYes + st.yNo) : NaN,
    surgStop: st.surgN ? 100 * st.surgStop / st.surgN : NaN,

function aggregate(acc) {
  return acc.map(list => {
    const m = k => mean(list.map(s => s[k]));
    const satN = list.filter(s => s.sat).length;
    return { v85: m('v85'), tt: m('tt'), flow: m('flow'), stopPct: m('stopPct'), qAvg: m('qAvg'), qMax: m('qMax'), pedW: m('pedW'),
      yieldPct: m('yieldPct'), surgStop: m('surgStop'), surgRisk: m('surgRisk'), sat: satN * 2 > list.length, satN, pending: 0,
      nVeh: list.reduce((a, s) => a + s.nVeh, 0) };
  });
}

/* ---------- recommandation : règle lexicographique, sans pondération ---------- */
function recommend(E, scs) {
  const excluded = [], cands = [];
  E.forEach((e, i) => {
    if (i === 0) return;
    const why = [];
    if (e.sat) why.push('sat');
    if (scs[i].reg) why.push('reg');
    if (why.length) excluded.push({ i, why }); else cands.push({ i, e });
  });
  if (!cands.length) return { best: -1, excluded };
  const rMin = Math.min(...cands.map(c => c.e.surgRisk));
  const pool = cands.filter(c => c.e.surgRisk <= rMin + 0.25);
  pool.sort((a, b) => Math.abs(a.e.tt - b.e.tt) > 2 ? a.e.tt - b.e.tt : a.e.pedW - b.e.pedW);
  return { best: pool[0].i, excluded };
}

let viewMode = 'full';

    this.roadH = (Y1 - Y0) * this.sy; this.profH = profH; this.ch = Math.round(this.roadH + this.profH);

// quantités sommaires, déduites de la géométrie simulée
function quantities(sc) {
  const lw = P.laneW, W = 2 * lw, gz = sc.geom(XC);
  const q = { zebra: 2 * gz.lw * 4 * 0.5, sign: 2, light: 2, kerbRamp: 2 };
  const add = (k, v) => { q[k] = (q[k] || 0) + v; };
  switch (sc.id) {
    case 'dos': add('asphalt', 2 * W * 4 * (2 / 3) * 0.10 * 2.35); add('sign', 4); add('zebra', 0.5 * W); break;
    case 'trap': add('table', W * 6.4); add('sign', 4); add('zebra', 0.25 * W); break;
    case 'plat': add('table', W * 11); add('sign', 2); add('zebra', 0.25 * W); break;
    case 'cous': add('cushion', 4); add('sign', 2); add('zebra', 4 * 0.45); break;
    case 'ret': add('kerb', 4 * 13 + 2 * 30); add('island', P.retIsl * 18); add('pavement', 2 * Math.max(0, P.retIsl / 2 + P.retLane - lw) * 30);
      add('bollard', 2); add('sign', 2); add('kerbRamp', 2); break;
    case 'chi': add('kerb', 2 * (2 * P.chTrans + 10)); add('pavement', P.chOff * (P.chTrans + 10)); add('island', P.chOff * (P.chTrans + 10));
      add('bollard', 4); add('line', 2 * P.chTrans + 10); break;
    case 'rev': add('pavers', W * 40); break;
    case 'rug': add('rumble', 6 * 0.25 * (lw - 0.3) * 3 * 2); add('sign', 2); break;
    case 'sig': add('signals', 1); add('line', 2 * lw); add('sign', 2); break;
  }
  return q;
}
function costing(sc) {
  const q = quantities(sc), rows = [];
  for (const p of PRICE_DEF) if (p.k !== 'fees' && q[p.k] > 0) {
    const qty = p.u[0] === 'u' || p.u[0] === 'ens.' ? Math.round(q[p.k]) : Math.round(q[p.k] * 10) / 10;
    rows.push({ p, qty, amount: qty * PRICES[p.k] });
  }
  const sub = rows.reduce((a, r) => a + r.amount, 0), fees = sub * PRICES.fees / 100;
  const total = Math.round((sub + fees) / 100) * 100;
  return { rows, sub, fees, total, low: Math.round(total * 0.7 / 100) * 100, high: Math.round(total * 1.3 / 100) * 100, eur: Math.round(total / RATE / 10) * 10 };
}

// dimensions principales [clé, valeur affichée]
function dims(sc) {

  const add = (...r) => out.push(...r);
  switch (sc.id) {
    case 'dos': add(['humpL', f(4)], ['height', f(0.10)], ['humpDist', f(10)]); break;
    case 'trap': add(['tableL', f(4)], ['rampL', f(1.2)], ['height', f(0.10)], ['rampSlope', nf1.format(8.3) + ' %']); break;
    case 'plat': add(['tableL', f(8)], ['rampL', f(1.5)], ['height', f(0.10)], ['rampSlope', nf1.format(6.7) + ' %']); break;
    case 'cous': add(['cushL', f(3)], ['cushW', f(1.8)], ['cushH', f(0.07)], ['rampL', f(0.8)], ['humpDist', f(10)]); break;
    case 'ret': add(['laneN', f(P.retLane)], ['islW', f(P.retIsl)], ['islL', f(30)], ['taper', f(8)], ['refugeL', f(4)]); break;
    case 'chi': add(['offset', f(P.chOff)], ['transL', f(P.chTrans)], ['palier', f(10)], ['laneC', f(P.chLane)], ['radius', f0(sc.info.R)]); break;
    case 'rev': add(['paveL', f(40)]); break;

    case 'sig': add(['stopDist', f(1)], ['pedGreen', SIG.walk + ' s'], ['clear', sc.info.clear + ' s'], ['minGreen', f0(P.sigGreen) + ' s']); break;

  return out;
}

/* ---------- plan de principe coté, A4 paysage (SVG en millimètres) ---------- */
function planSVG(sc, meta, N) {
  const ar = lang === 'ar', D = N.plan, f2 = v => nf2.format(v);
  const halfX = ({ ref: 16, dos: 18, trap: 14, plat: 15, cous: 18, ret: 22, chi: P.chTrans + 13, rev: 26, rug: 66, sig: 16 })[sc.id] || 18;
  let S = 1000;
  for (const s of [100, 125, 200, 250, 500, 1000]) { const kk = 1000 / s; if (2 * halfX * kk <= 262 && 17 * kk <= 86) { S = s; break; } }
  const k = 1000 / S, cx = 148.5, cy = 76;
  const PX = x => cx + (x - XC) * k, PY = y => cy - y * k;
  const o = [];
  const fx = v => v.toFixed(2);
  const txt = (x, y, s, size = 2.4, anchor = 'middle', rot = 0) => o.push(`<text x="${fx(x)}" y="${fx(y)}" font-size="${size}" text-anchor="${anchor}" fill="#000"${rot ? ` transform="rotate(${rot} ${fx(x)} ${fx(y)})"` : ''}${ar ? ' direction="rtl"' : ''}>${esc(s)}</text>`);
  const line = (x1, y1, x2, y2, w = 0.25, extra = '') => o.push(`<line x1="${fx(x1)}" y1="${fx(y1)}" x2="${fx(x2)}" y2="${fx(y2)}" stroke="#000" stroke-width="${w}"${extra}/>`);
  const poly = (pts, fill, stroke = 'none', w = 0.2) => o.push(`<polygon points="${pts.map(p => fx(p[0]) + ',' + fx(p[1])).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${w}"/>`);
  const pl = (pts, w, extra = '') => o.push(`<polyline points="${pts.map(p => fx(p[0]) + ',' + fx(p[1])).join(' ')}" fill="none" stroke="#000" stroke-width="${w}"${extra}/>`);
  const rectW = (xa, xb, ya, yb, fill, stroke = '#000', w = 0.2) => poly([[PX(xa), PY(ya)], [PX(xb), PY(ya)], [PX(xb), PY(yb)], [PX(xa), PY(yb)]], fill, stroke, w);
  const xs = []; for (let x = XC - halfX; x <= XC + halfX + 1e-9; x += halfX > 40 ? 1 : 0.5) xs.push(x);
  const G = x => { const g = sc.geom(x); g.s = g.yc - g.wi / 2 - g.lw; g.n = g.yc + g.wi / 2 + g.lw; return g; };
  const band = (fa, fb, fill) => poly(xs.map(x => [PX(x), PY(fa(G(x)))]).concat(xs.slice().reverse().map(x => [PX(x), PY(fb(G(x)))])), fill);
  const edge = (f, w) => pl(xs.map(x => [PX(x), PY(f(G(x)))]), w);
  const gs = 0.2 * k;   // maille des pavés
  o.push(`<defs>
    <clipPath id="clipPlan"><rect x="9" y="12" width="279" height="127"/></clipPath>
    <pattern id="hatch" width="1.2" height="1.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.2" stroke="#000" stroke-width="0.12"/></pattern>
    <pattern id="hatch2" width="0.7" height="0.7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="0.7" stroke="#000" stroke-width="0.1"/></pattern>
    <pattern id="dots" width="0.8" height="0.8" patternUnits="userSpaceOnUse"><circle cx="0.4" cy="0.4" r="0.16" fill="#000"/></pattern>
    <pattern id="grid" width="${fx(Math.max(0.7, gs))}" height="${fx(Math.max(0.7, gs))}" patternUnits="userSpaceOnUse"><path d="M0 0H${fx(Math.max(0.7, gs))}M0 0V${fx(Math.max(0.7, gs))}" fill="none" stroke="#000" stroke-width="0.08"/></pattern>
    <pattern id="green" width="1.6" height="1.6" patternUnits="userSpaceOnUse"><circle cx="0.8" cy="0.8" r="0.28" fill="none" stroke="#000" stroke-width="0.1"/></pattern>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6z" fill="#000"/></marker>
  </defs>`);
  o.push('<rect x="5" y="5" width="287" height="200" fill="#fff" stroke="#000" stroke-width="0.5"/>');
  txt(ar ? 287 : 10, 10.2, `${D.title} — ${meta.name}`, 3.4, 'start');
  o.push('<g clip-path="url(#clipPlan)">');

      const g = G(f.xa); rectW(f.xa, f.xb, g.s, g.n, 'url(#grid)', '#000', 0.25);
    } else if (f.t === 'rumble') {
      const g = G(f.x0), ya = f.lane === 0 ? g.s : g.yc;

    } else if (f.t === 'island') {
      for (const [a, b] of [[XC - 15, XC - ZEBRA_HALF], [XC + ZEBRA_HALF, XC + 15]]) {

        poly(xi.map(x => [PX(x), PY(G(x).yc + G(x).wi / 2)]).concat(xi.slice().reverse().map(x => [PX(x), PY(G(x).yc - G(x).wi / 2)])), 'url(#green)', '#000', 0.35);
      }
      rectW(XC - ZEBRA_HALF, XC + ZEBRA_HALF, gm.yc - gm.wi / 2, gm.yc + gm.wi / 2, '#e6e6e6', '#000', 0.15);
      for (const xb of [XC - 12, XC + 12]) o.push(`<circle cx="${fx(PX(xb))}" cy="${fx(PY(G(xb).yc))}" r="0.7" fill="#fff" stroke="#000" stroke-width="0.25"/>`);
    } else if (f.t === 'signal') {
      line(PX(XC - 3), PY(gm.s), PX(XC - 3), PY(gm.yc), Math.max(0.5, 0.3 * k));

  for (let y = gm.s + 0.3; y + 0.5 <= gm.n - 0.2; y += 1.0) {
    if (gm.wi > 0.05 && y + 0.5 > gm.yc - gm.wi / 2 && y < gm.yc + gm.wi / 2) continue;
    rectW(XC - ZEBRA_HALF, XC + ZEBRA_HALF, y, y + 0.5, '#cfcfcf', '#000', 0.12);
  }
  // axe discontinu (3 m / 3,5 m)
  const busy = sc.feats.filter(f => f.xa !== undefined);
  for (let x = XC - halfX; x < XC + halfX; x += 6.5) {
    const xe = x + 3;
    if (xe > XC - ZEBRA_HALF - 2 && x < XC + ZEBRA_HALF + 2) continue;
    if (busy.some(f => xe > f.xa - 0.5 && x < f.xb + 0.5)) continue;

  rectW(XC - ZEBRA_HALF, XC + ZEBRA_HALF, gm.n + 0.5, gm.n + 0.92, 'url(#dots)', '#000', 0.1);

    rectW(XC - ZEBRA_HALF, XC + ZEBRA_HALF, gm.yc + gm.wi / 2 - 0.5, gm.yc + gm.wi / 2 - 0.1, 'url(#dots)', '#000', 0.1);
  }
  // éclairage : en amont de chaque sens, trottoir de droite du conducteur
  const lamp = (x, y, lab) => { const px = PX(x), py = PY(y); o.push(`<circle cx="${fx(px)}" cy="${fx(py)}" r="1.25" fill="#fff" stroke="#000" stroke-width="0.25"/>`); line(px - 0.9, py - 0.9, px + 0.9, py + 0.9, 0.2); line(px - 0.9, py + 0.9, px + 0.9, py - 0.9, 0.2); txt(px, py + 3.4, lab, 1.9); };
  lamp(XC - 3.8, gm.s - 1.5, 'E1'); lamp(XC + 3.8, gm.n + 1.5, 'E2');
  // panneaux
  const sign = (type, code, x, side) => {
    const g = G(x), y = side === 'S' ? g.s - 1.6 : side === 'N' ? g.n + 1.6 : g.yc, px = PX(x), py = PY(y);
    if (type === 'A') poly([[px, py - 1.5], [px + 1.4, py + 1.0], [px - 1.4, py + 1.0]], '#fff', '#000', 0.25);
    else if (type === 'B') o.push(`<circle cx="${fx(px)}" cy="${fx(py)}" r="1.3" fill="#fff" stroke="#000" stroke-width="0.25"/>`);
    else if (type === 'C') o.push(`<rect x="${fx(px - 1.2)}" y="${fx(py - 1.2)}" width="2.4" height="2.4" fill="#fff" stroke="#000" stroke-width="0.25"/>`);
    else o.push(`<rect x="${fx(px - 0.5)}" y="${fx(py - 1.2)}" width="1" height="2.4" fill="#fff" stroke="#000" stroke-width="0.25"/>`);
    txt(px, side === 'N' ? py - 2.0 : py + 3.3, code, 1.8);
  };
  const far = halfX - 2.5;
  sign('C', 'C20a', XC - 6.5, 'S'); sign('C', 'C20a', XC + 6.5, 'N');
  if (sc.id === 'dos' || sc.id === 'trap') { sign('A', 'A2b', XC - far, 'S'); sign('A', 'A2b', XC + far, 'N'); sign('B', 'B14', XC - far + 3.5, 'S'); sign('B', 'B14', XC + far - 3.5, 'N'); }
  if (sc.id === 'plat' || sc.id === 'cous') { sign('C', 'C27', XC - far, 'S'); sign('C', 'C27', XC + far, 'N'); }
  if (sc.id === 'ret') { sign('B', 'B21-1', XC - 13.5, 'I'); sign('B', 'B21-1', XC + 13.5, 'I'); }
  if (sc.id === 'chi') { const xc1 = XC - 5 - P.chTrans / 2, xc2 = XC + 5 + P.chTrans / 2; sign('J', 'J5', xc1, 'S'); sign('J', 'J5', xc2, 'N'); }
  if (sc.id === 'rug') { sign('A', 'A14', XC - far, 'S'); sign('A', 'A14', XC + far, 'N'); }
  if (sc.id === 'sig') {
    sign('A', 'A17', XC - far, 'S'); sign('A', 'A17', XC + far, 'N');
    for (const [x, side] of [[XC - 3.4, 'S'], [XC + 3.4, 'N']]) {
      const g = G(x), px = PX(x), py = PY(side === 'S' ? g.s - 0.9 : g.n + 0.9);
      o.push(`<rect x="${fx(px - 0.8)}" y="${fx(py - 1.6)}" width="1.6" height="3.2" fill="#fff" stroke="#000" stroke-width="0.25"/>`);

  line(PX(xB), PY(laneY(G(xB), 1)), PX(xB) - 9, PY(laneY(G(xB), 1)), 0.3, ' marker-end="url(#arr)"');
  // trait de coupe A-A sur la voie sens →

  if (vert) {
    const ya = laneY(G(vert.xa), 0), a = PX(vert.xa - 1.5), b = PX(vert.xb + 1.5);
    line(a, PY(ya), b, PY(ya), 0.25, ' stroke-dasharray="2 0.8 0.4 0.8"'); txt(a - 1.6, PY(ya) + 0.9, 'A', 2.6); txt(b + 1.6, PY(ya) + 0.9, 'A', 2.6);
  } else {
    line(PX(XC), PY(gm.s - 2.5) + 1, PX(XC), PY(gm.n + 2.5) - 1, 0.25, ' stroke-dasharray="2 0.8 0.4 0.8"');
    txt(PX(XC) - 2.2, PY(gm.n + 1.0), 'B', 2.6); txt(PX(XC) - 2.2, PY(gm.s - 1.0) + 2.4, 'B', 2.6);
  }
  o.push('</g>');
  // cotes
  const nMax = Math.max(...xs.map(x => G(x).n)), sMin = Math.min(...xs.map(x => G(x).s));
  const yTop = r => PY(nMax + 2.5) - 4 - 5 * r, yBot = r => PY(sMin - 2.5) + 5 + 5 * r;
  const tick = (x, y) => line(x - 0.7, y + 0.7, x + 0.7, y - 0.7, 0.3);
  const dimH = (x1, x2, yP, label, refY) => {
    const a = PX(x1), b = PX(x2); line(a, yP, b, yP, 0.15); tick(a, yP); tick(b, yP);
    if (refY !== undefined) { line(a, refY, a, yP, 0.1, ' stroke-dasharray="0.8 0.6"'); line(b, refY, b, yP, 0.1, ' stroke-dasharray="0.8 0.6"'); }
    txt((a + b) / 2, yP - 0.9, label, 2.1);
  };
  const dimV = (y1, y2, xP, label) => { const a = PY(y1), b = PY(y2); line(xP, a, xP, b, 0.15); tick(xP, a); tick(xP, b); txt(xP - 1.0, (a + b) / 2, label, 2.0, 'middle', -90); };
  const refTop = PY(nMax + 2.5), refBot = PY(sMin - 2.5);
  dimH(XC - ZEBRA_HALF, XC + ZEBRA_HALF, yBot(0), f2(4), refBot);
  const H = (x1, x2, r, lab) => dimH(x1, x2, yTop(r), lab, refTop);
  switch (sc.id) {

    case 'plat': H(XC - 5.5, XC - 4, 0, f2(1.5)); H(XC - 4, XC + 4, 0, f2(8)); H(XC + 4, XC + 5.5, 0, f2(1.5)); break;
    case 'cous': H(XC - 11.5, XC - 8.5, 0, f2(3)); H(XC + 8.5, XC + 11.5, 0, f2(3)); H(XC - 10, XC, 1, f2(10)); H(XC, XC + 10, 1, f2(10)); break;
    case 'ret': H(XC - 15, XC - 7, 0, f2(8)); H(XC - ZEBRA_HALF, XC + ZEBRA_HALF, 0, f2(4)); H(XC + 7, XC + 15, 0, f2(8)); H(XC - 15, XC + 15, 1, f2(30)); break;
    case 'chi': H(XC - 5 - P.chTrans, XC - 5, 0, f2(P.chTrans)); H(XC - 5, XC + 5, 0, f2(10)); H(XC + 5, XC + 5 + P.chTrans, 0, f2(P.chTrans)); break;

    case 'rug': H(XC - 22, XC - 2, 0, '20'); H(XC - 42, XC - 2, 1, '40'); H(XC - 62, XC - 2, 2, '60'); break;

    const g = G(x);
    dimV(g.s - 2.5, g.s, xP, f2(2.5)); dimV(g.s, g.yc - g.wi / 2, xP, f2(g.lw));
    if (g.wi > 0.05) dimV(g.yc - g.wi / 2, g.yc + g.wi / 2, xP, f2(g.wi));
    dimV(g.yc + g.wi / 2, g.n, xP, f2(g.lw)); dimV(g.n, g.n + 2.5, xP, f2(2.5));

  vChain(XC - halfX + 4, PX(XC - halfX + 4));
  if (sc.id === 'ret') vChain(XC + 5, PX(XC + 5));   // partie de largeur constante de l'îlot
  if (sc.id === 'chi') {
    vChain(XC, PX(XC) + 9);
    const e = P.chOff; line(PX(XC - 5 - P.chTrans), PY(-e / 2), PX(XC + 5 + P.chTrans), PY(-e / 2), 0.12, ' stroke-dasharray="1.2 0.8"');
    dimV(-e / 2, e / 2, PX(XC) - 9, f2(e));

  // barre d'échelle
  const sb = S >= 500 ? 20 : 10, sbL = sb * k, x0 = 12, ySb = 142.5;
  line(x0, ySb, x0 + sbL, ySb, 0.3); for (const t of [0, sb / 2, sb]) { line(x0 + t * k, ySb - 1, x0 + t * k, ySb + 1, 0.25); txt(x0 + t * k, ySb - 1.6, String(t), 1.8); }
  txt(x0 + sbL + 3, ySb + 0.7, `m — ${D.scale} 1:${S}`, 2.0, 'start');
  txt(ar ? 287 : 10, 145.8, D.disclaimer, 1.9, 'start');
  txt(148.5, 203.4, N.genBy, 1.9, 'middle');
  // coupe A-A (dispositif surélevé) ou B-B (profil en travers au droit du passage)

  o.push(`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="none" stroke="#000" stroke-width="0.25"/>`);
  if (vert) {
    txt(bx + bw / 2, by + 4, D.secA, 2.3);
    const prof = sc.id === 'dos' ? { L: 4, h: 0.10, fn: u => { const c = 2, R = 20.05; return u <= 0 || u >= 4 ? 0 : Math.sqrt(R * R - (u - c) * (u - c)) - (R - 0.10); }, segs: [[0, 4, f2(4)]], slope: '' }
      : sc.id === 'cous' ? { L: 3, h: 0.07, fn: u => u <= 0 || u >= 3 ? 0 : Math.min(0.07, 0.07 * u / 0.8, 0.07 * (3 - u) / 0.8), segs: [[0, 0.8, f2(0.8)], [0.8, 2.2, f2(1.4)], [2.2, 3, f2(0.8)]], slope: '8,8 %' }
      : { L: vert.xb - vert.xa, h: 0.10, fn: u => { const Lr = vert.ramp, L2 = vert.xb - vert.xa; return u <= 0 || u >= L2 ? 0 : Math.min(0.10, 0.10 * u / Lr, 0.10 * (L2 - u) / Lr); },
          segs: [[0, vert.ramp, f2(vert.ramp)], [vert.ramp, vert.xb - vert.xa - vert.ramp, f2(vert.xb - vert.xa - 2 * vert.ramp)], [vert.xb - vert.xa - vert.ramp, vert.xb - vert.xa, f2(vert.ramp)]], slope: sc.id === 'trap' ? '8,3 %' : '6,7 %' };
    const span = prof.L + 4, ks = Math.min(66 / span, 14), kv = ks * 10, x1 = bx + (bw - span * ks) / 2, y0 = by + bh - 16;
    const pts = []; for (let u = -2; u <= prof.L + 2 + 1e-9; u += 0.05) pts.push([x1 + (u + 2) * ks, y0 - prof.fn(u) * kv]);

    txt(bx + bw / 2, by + 4, D.secB, 2.3);
    const g = G(XC), parts = [[2.5, 0.15, 'walk'], [g.lw, 0, 'lane']];

    pl(pts, 0.35);
    xc = x1; for (const [w] of parts) { const yd = y0 + 6; line(xc, yd, xc + w * ks, yd, 0.15); tick(xc, yd); tick(xc + w * ks, yd); txt(xc + w * ks / 2, yd - 0.9, f2(w), 1.9); xc += w * ks; }

  o.push(`<rect x="${lx}" y="${ly}" width="${lw2}" height="52" fill="none" stroke="#000" stroke-width="0.25"/>`);
  txt(ar ? lx + lw2 - 3 : lx + 3, ly + 4.5, D.legend, 2.5, 'start');

  txt(ar ? lx + lw2 - 3 : lx + 3, ly + 50, D.cotes, 1.9, 'start');
  // cartouche : texte noir, jamais en gras, sans bande de couleur
  const kx0 = 184, ky0 = 148, kw = 103, rowsC = [[D.commune, meta.commune], [D.lieu, meta.lieu], [D.objet, `${D.title} — ${meta.name}`], [D.scale, `1:${S}`], [D.formatL, D.format],
    [D.date, meta.date], [D.auteur, meta.auteur], [D.indice, 'A'], [D.calib, meta.fp]];
  const rh = 52 / rowsC.length;
  o.push(`<rect x="${kx0}" y="${ky0}" width="${kw}" height="52" fill="none" stroke="#000" stroke-width="0.3"/>`);
  line(ar ? kx0 + kw - 26 : kx0 + 26, ky0, ar ? kx0 + kw - 26 : kx0 + 26, ky0 + 52, 0.2);
  rowsC.forEach(([l, v], j) => {
    const yy = ky0 + rh * (j + 1);

}

function buildNote(id) {
  const N = NOTE[lang], i = scenarios.findIndex(s => s.id === id), sc = scenarios[i], V = VDOC[id] ? VDOC[id][lang](P) : null;
  const E = evalRes, e = E[i], r = E[0], R = recommend(E, scenarios), ui = uiIdx();
  const name = scName(sc), fp = fingerprint(P), fpTxt = calibModified ? t('calibMod', fp) : t('calibRef', fp);
  const meta = { commune: META.commune || N.unknown, lieu: META.lieu || N.unknown, auteur: META.auteur || N.unknown, date: new Date().toLocaleDateString(lang === 'en' ? 'en-GB' : 'fr-FR', lang === 'en' ? { day: 'numeric', month: 'long', year: 'numeric' } : undefined), name, fp: fpTxt, objet: N.objet, outil: N.outil };
  const c = { P, e, r, sc, i, n: scenarios.length - 1, name, mja: 2 * P.q * 10, lane: laneAt(sc), dVis: stopDist(P.v85free), rec: R.best, recName: R.best >= 0 ? scName(scenarios[R.best]) : '' };
  c.cost = costing(sc);
  const conds = (VCOND[id] || []).map(k => ({ st: COND[k].test(c), txt: COND[k][lang](c) }));
  c.nKo = conds.filter(x => x.st === 'ko').length; c.nCheck = conds.filter(x => x.st === 'check').length;
  const li = arr => '<ul>' + arr.map(s => `<li>${esc(s)}</li>`).join('') + '</ul>';
  const u = N.u, B = N.brief;
  const tbl = (cols, rows) => `<table><thead><tr>${cols.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
  // sections facultatives : le lieu (carte analysée) et la journée (simulée)
  const hasSite = SITE.lat !== null, hasDay = !!DAY.res;
  c.condNo = 3 + (hasSite ? 1 : 0) + (hasDay ? 1 : 0);
  if (hasDay) { const sat = DAY.res[i].filter(r => r.state === 'sat').map(r => r.h); c.daySat = sat.length ? hourRanges(sat) : ''; }
  if (SITE.data && SITE.data.school && SITE.data.school.dist <= 300) c.school = SITE.data.school;
  let sn = 0; const H2 = key => `<h2>${++sn}. ${esc(N.s[key])}</h2>`;
  // mention de l’application, avec lien, en page de garde, en fin de note et sur le plan
  const genLine = esc(N.genBy).replace('urbain.ksr-infra.org', '<a href="https://urbain.ksr-infra.org" class="num">urbain.ksr-infra.org</a>');
  let h1 = `<h1>${esc(N.title)}</h1><p class="sub">${esc(N.sub)}</p><p class="small gen">${genLine}</p>`;
  h1 += `<table class="cover"><tbody>${N.cover.map(([k2, l]) => `<tr><td>${esc(l)}</td><td>${esc(meta[k2])}</td></tr>`).join('')}</tbody></table>`;
  h1 += `<h3>${esc(N.glossTitle)}</h3><table class="gloss"><tbody>${N.gloss.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</tbody></table>`;
  const briefKeys = ['site', 'variant', 'speed', 'risk', 'ped', 'traffic'].concat(hasDay ? ['day'] : [], ['cost', 'cond', 'rec']);
  const briefItems = briefKeys.map(k2 => `<li>${B[k2](c)}</li>`);
  if (c.school) briefItems.splice(1, 0, `<li>${esc(B.school(c))}</li>`);
  h1 += `${H2('brief')}<ul class="brief">${briefItems.join('')}</ul>`;
  if (hasSite) {
    // le lieu : cartes dès que le passage est pointé, détails de la rue et des abords si le lieu a été analysé
    const d = SITE.data, la = SITE.lat, lo = SITE.lon, ll = `${la.toFixed(5)},${lo.toFixed(5)}`;
    const osm = `https://www.openstreetmap.org/?mlat=${la.toFixed(5)}&mlon=${lo.toFixed(5)}#map=18/${la.toFixed(5)}/${lo.toFixed(5)}`, gm = `https://www.google.com/maps/search/?api=1&query=${ll}`;
    h1 += `${H2('site')}<p>${esc(N.siteCoords(la, lo))} <a href="${osm}">${esc(N.osmLink)}</a> · <a href="${gm}">${esc(N.gmLink)}</a></p>`;
    h1 += `<figure class="map-fig">${tileMapSVG(la, lo, 17, 'osm', 700, 470, d)}<figcaption class="small">${esc(d ? N.siteFig : N.siteFig0)} ${esc(d ? t('osmCredit') : N.osmAttr)}</figcaption></figure>`;
    h1 += `<figure class="map-fig">${tileMapSVG(la, lo, 18, 'sat', 700, 400, null)}<figcaption class="small">${esc(N.satFig)} ${esc(N.satAttr)}</figcaption></figure>`;
    if (!d) h1 += `<p class="small">${esc(N.siteNoData)}</p>`;
    else {
      const F = siteFacts(d), K = t('poiKind');
      if (F.roadTitle) h1 += `<h3>${esc(t('hRoad'))}</h3><p>${esc(F.roadTitle)}</p>${li(F.road)}`;
      if (F.warn.length) h1 += li(F.warn);
      if (F.pop) h1 += `<h3>${esc(t('hPop'))}</h3><p>${esc(F.pop)}</p>`;
      h1 += `<h3>${esc(t('hPoi'))}</h3>` + (d.pois.length ? tbl(t('poiCols'), d.pois.map((p, j) => `<tr><td class="n">${j + 1}</td><td>${esc(p.name || t('unnamed'))}</td><td>${esc(K[p.kind] || p.kind)}</td><td class="n">${f0(p.dist)} m</td></tr>`)) : `<p>${esc(t('poiNone'))}</p>`);

  const M = N.mean, ind = N.ind;
  const rows2 = [
    ['v85', `${f0(r.v85)} ${u.kmh}`, `${f0(e.v85)} ${u.kmh}`, M.v85(r, e)],
    ['tt', `${f0(r.tt)} ${u.s}`, `${f0(e.tt)} ${u.s}`, M.tt(r, e)],
    ['flow', f0(r.flow), f0(e.flow), M.flow(r, e)],
    ['q', `${f0(r.qMax)} ${u.m}`, `${f0(e.qMax)} ${u.m}`, M.q(r, e)],
    ['ped', `${f0(r.pedW)} ${u.s}`, `${f0(e.pedW)} ${u.s}`, M.ped(r, e)],
    ['yield', `${f0(r.yieldPct)} %`, sc.signal ? '–' : `${f0(e.yieldPct)} %`, M.yield(r, e, sc)],
    ['stop', `${f0(r.surgStop)} %`, `${f0(e.surgStop)} %`, M.stop(r, e)],
    ['risk', `${f1(r.surgRisk)} %`, `${f1(e.surgRisk)} %`, M.risk(r, e)]
  ].map(([k2, a, b, m]) => `<tr><td>${esc(ind[k2])}</td><td class="n">${esc(a)}</td><td class="n">${esc(b)}</td><td>${esc(m)}</td></tr>`);
  h1 += `${H2('change')}<p>${esc(N.changeIntro)}</p>${tbl(N.changeCols, rows2)}`;
  if (hasDay) {
    // journée : référence, variante retenue et, si elle diffère, variante recommandée
    const pick = [0, i].concat(R.best > 0 && R.best !== i ? [R.best] : []), cell = 'text-align:center;padding:1mm 0.5mm';
    const head = `<tr><th></th>${DAY.res[0].map(r => `<th style="${cell}">${r.h}</th>`).join('')}</tr>`
      + `<tr><th>${esc(t('dayDemand'))}</th>${DAY.res[0].map(r => `<th style="${cell};font-weight:400">${f0(r.demand)}</th>`).join('')}</tr>`;
    const body = pick.map(j => `<tr><td>${esc(scShort(scenarios[j]))}</td>${dayCells(DAY.res[j], true)}</tr>`).join('');
    h1 += `${H2('day')}<p>${esc(t('dayResNote', DAY.src === 'counts' ? t('srcCounts') : t('srcProfile', P)))}</p><table style="font-size:7.5pt">${head}${body}</table>${li(dayReco(i))}`;
  }
  h1 += `${H2('cond')}<p>${esc(N.condIntro)}</p>${tbl(N.condCols, conds.map(x => `<tr><td>${esc(x.txt)}</td><td class="st st-${x.st}">${esc(N.st[x.st])}</td></tr>`))}`;
  h1 += `${H2('dims')}<p>${esc(N.dimsIntro)}</p>${tbl(N.dimCols, dims(sc).map(([k2, v]) => `<tr><td>${esc(N.dim[k2])}</td><td class="n">${esc(v)}</td></tr>`))}`;
  // profil en travers : existant, projeté en section courante, au droit du passage pour la variante retenue
  const SN = t('segNames'), PC = crossOf(id), ckl = arr => '<ul>' + arr.map(([l, m]) => `<li class="ck-${l}">${esc(m)}</li>`).join('') + '</ul>';
  const segRow = s => `<tr><td>${esc(SN[s.t][0] + (SEG[s.t].dir ? ` (${s.d > 0 ? t('dir1') : t('dir2')})` : ''))}</td><td class="n">${fm(s.w)}</td></tr>`;
  const totRow = `<tr><th>${esc(t('pfTotal'))}</th><th class="n">${fm(PROF.total)}</th></tr>`;
  h1 += `${H2('profile')}<p>${esc(N.profIntro)}</p>`;
  h1 += `<h3>${esc(t('pfExisting'))}</h3><figure class="pf-fig">${profileSVG(PROF.segs, PROF.total, { flags: profFlags(profChecks(PROF)) })}</figure>`;

  h1 += `<h3>${esc(t('pfProjected'))}</h3>`;
  if (!PROJ || sameSegs(PROJ, PROF.segs)) h1 += `<p>${esc(t('pfProjSame'))}</p>`;
  else h1 += `<figure class="pf-fig">${profileSVG(PROJ, PROF.total, { flags: profFlags(profChecks({ total: PROF.total, segs: PROJ })) })}</figure>` + tbl(N.profCols, PROJ.map(segRow).concat(totRow)) + ckl(profChecks({ total: PROF.total, segs: PROJ }));
  h1 += `<h3>${esc(t('pfCrossTitle', name))}</h3><figure class="pf-fig">${profileSVG(PC.segs, PROF.total, { stages: PC.stages, flags: profFlags(PC.notes) })}</figure>`;
  h1 += tbl(N.profCols, PC.segs.map(segRow).concat(totRow)) + ckl(PC.notes);
  // 5-12
  let h2 = '';
  if (V) {
    h2 += `${H2('implant')}${li(V.implant)}`;
    h2 += `${H2('visib')}<p>${esc(N.visib(c))}</p>${li(N.visibList)}`;
    h2 += `${H2('signs')}<h3>${esc(N.signV)}</h3>${li(V.signs)}<h3>${esc(N.marks)}</h3>${li(V.marks)}<p class="small">${esc(N.signNote)}</p>`;
    h2 += `${H2('light')}${li(N.light)}`;
    h2 += `${H2('walks')}${li(N.walks.concat(V.walks))}<p class="small">${esc(N.walksNote)}</p>`;
    h2 += `${H2('water')}${li(N.water.concat(V.water))}`;
  }
  const C2 = c.cost, nfp = v => nf0.format(v), nq = v => (Number.isInteger(v) ? nf0 : nf1).format(v);
  const crow = C2.rows.map(x => `<tr><td>${esc(x.p[lang])}</td><td class="n">${nq(x.qty)}</td><td>${esc(x.p.u[ui])}</td><td class="n">${nfp(PRICES[x.p.k])}</td><td class="n">${nfp(x.amount)}</td></tr>`);
  crow.push(`<tr><td colspan="4">${esc(N.costSub)}</td><td class="n">${nfp(C2.sub)}</td></tr>`);
  crow.push(`<tr><td colspan="4">${esc(N.costFees(PRICES.fees))}</td><td class="n">${nfp(C2.fees)}</td></tr>`);
  crow.push(`<tr><th colspan="4">${esc(N.costTotal)}</th><th class="n">${nfp(C2.total)}</th></tr>`);
  crow.push(`<tr><td colspan="4">${esc(N.costRange)}</td><td class="n"><span class="num">${nfp(C2.low)} – ${nfp(C2.high)}</span></td></tr>`);
  crow.push(`<tr><td colspan="4">${esc(N.costEur)}</td><td class="n">≈ ${nfp(C2.eur)} €</td></tr>`);
  h2 += `${H2('cost')}${tbl(N.costCols, crow)}<p class="small">${esc(N.costNote(RATE))}</p>`;
  const A = N.actions, acts = [];
  if (c.nKo) acts.push([1, A.ko]);
  if (e.sat) acts.push([1, A.sat]);
  acts.push([1, A.count], [2, A.exec], [2, A.market], [2, A.inform], [3, A.after], [3, A.maint]);
  h2 += `${H2('plan')}${tbl(N.planCols, acts.map(([p, [a, w, q]]) => `<tr><td class="prio p${p}">P${p}</td><td>${esc(a)}</td><td>${esc(w)}</td><td>${esc(q)}</td></tr>`))}`;
  // annexes
  const st = x => x.sat ? N.stateTxt.sat : N.stateTxt.ok;
  h2 += `<section class="annex"><h2>${esc(N.s.annA)}</h2><div class="box">${esc(N.annexBox)}</div>`;
  h2 += tbl(N.annACols, E.map((x, j) => `<tr${j === i ? ' style="font-weight:600"' : ''}><td>${esc(scName(scenarios[j]))}</td><td class="n">${f0(x.v85)}</td><td class="n">${f0(x.tt)}</td><td class="n">${f0(x.flow)}</td><td class="n">${f0(x.pedW)}</td><td class="n">${f1(x.surgRisk)}</td><td>${esc(st(x))}</td></tr>`));
  h2 += `<p>${esc(t('vCriteria'))}</p><p>${esc(R.best >= 0 ? N.recLine(scName(scenarios[R.best])) : N.recNone)}</p></section>`;
  const calibRows = FIELDS.find(g => g.lock).items.map(f => `<tr><td>${esc(f[lang])}</td><td class="n">${esc(nfa.format(P[f.k]))} ${esc(f.u[ui])}</td></tr>`);
  h2 += `<section><h2>${esc(N.s.annB)}</h2>${li(N.method)}${tbl(N.calibCols, calibRows)}<p class="small">${esc(fpTxt)}</p></section>`;
  h2 += `<section><h2>${esc(N.s.annC)}</h2><ol dir="ltr">${SOURCES}</ol></section>`;
  h2 += `<p class="small gen gen-end">${genLine} · ${esc(meta.date)}</p>`;
  const dir = lang === 'ar' ? 'rtl' : 'ltr';
  return `<!doctype html><html lang="${lang}" dir="${dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(N.title)} — ${esc(name)}</title><style>${NOTE_CSS}</style></head><body>
<div class="toolbar"><button type="button" onclick="window.print()">${esc(N.print)}</button><span>${esc(N.title)} — ${esc(name)}</span></div>
<div class="sheet">${h1}</div>

/* ---------- état global ---------- */
let P = derive({ ...DEFAULTS }), scenarios = [], sims = [], views = [];
let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let speed = 1, busy = false, accT = 0, last = performance.now(), lastKpi = 0;
let calibUnlocked = false, calibModified = false;
let evalRes = null, evalJob = 0, evalProg = 0, evalP = null;
const thumbs = new Map();          // id → image (data URL), pour la géométrie courante
let thumbKey = '', thumbJob = 0;
const $ = s => document.querySelector(s);
const stripsEl = $('#strips');
let io = null;

function buildStrips() {
  stripsEl.textContent = '';
  if (io) io.disconnect();
  views = scenarios.map((sc, i) => {
    const art = document.createElement('article');
    art.className = 'strip' + (sc.id === 'ref' ? ' ref' : '');
    art.id = 'bande-' + sc.id;
    const lg = (a, b) => `<span class="lg">${a}</span><span class="sh">${b}</span>`;
    art.innerHTML = `
      <div class="strip-head">
        <button class="thumb" type="button" data-k="thumb" aria-label="${esc(t('thumbAria', scName(sc)))}"><img alt=""></button>
        <div class="strip-title">
          <h3>${lg(scName(sc), scShort(sc))}<span class="pill rec" data-k="rec" hidden>${lg(...t('rec'))}</span><span class="pill ok" data-k="state">${lg(...t('stFluid'))}</span>${sc.reg ? `<span class="pill warn" title="${esc(t('regTitle'))}">${lg(...t('reg'))}</span>` : ''}</h3>
          <p class="desc">${scDesc(sc)}</p>
        </div>
        <dl class="kpis">
          <div><dt>${t('kV85')}</dt><dd data-k="v85">–</dd></div>
          <div><dt>${t('kTT')}</dt><dd data-k="tt">–</dd></div>
          <div><dt>${t('kQ')}</dt><dd data-k="q">–</dd></div>
          <div><dt>${t('kPed')}</dt><dd data-k="ped">–</dd></div>
          <div><dt>${t('kRisk')}</dt><dd data-k="risk">–</dd></div>
        </dl>
      </div>
      <div class="qrow"><span data-k="q0"></span><span data-k="q1"></span></div>
      <canvas class="plan" role="img" aria-label="${esc(t('planAria', scName(sc)))}"></canvas>`;
    const img = art.querySelector('.thumb img');
    if (thumbs.has(sc.id)) img.src = thumbs.get(sc.id);
    art.querySelector('.thumb').addEventListener('click', () => open3D(sc));
    stripsEl.appendChild(art);
    return new View(i, art);
  });
  io = new IntersectionObserver(es => { for (const e of es) { const vw = views.find(v => v.art === e.target); if (vw) vw.visible = e.isIntersecting; } });
  views.forEach(v => io.observe(v.art));
}

// noms courts, ligne de légende du mode présentation
function layoutAll() {
  for (const v of views) v.layout();
  const prof = views.length && views[0].profH >= 10;
  $('#ch-view').textContent = t('chView', viewMode === 'zoom', prof, isCompact());
}

/* mode présentation : hauteur de chaque bande = (hauteur d'écran − barre − en-tête) / nombre de bandes */
let compactRowH = 100;
const isCompact = () => document.body.classList.contains('compact');
function computeCompactRowH() {
  const bar = document.querySelector('.bar').getBoundingClientRect().height;
  const head = $('#compact-head').getBoundingClientRect().height;
  compactRowH = Math.floor((window.innerHeight - bar - head - 4) / Math.max(1, scenarios.length)) - 7;
  document.documentElement.style.setProperty('--rowh', Math.max(40, compactRowH) + 'px');
}
function setHash() {
  const tok = [isCompact() ? 'presentation' : '', lang !== 'fr' ? lang : ''].filter(Boolean).join('-');
  try { history.replaceState(null, '', tok ? '#' + tok : location.href.split('#')[0]); } catch (e) { /* adresse non modifiable : sans effet */ }
}
function setCompact(on) {
  document.body.classList.toggle('compact', on);
  $('#btn-compact').setAttribute('aria-pressed', String(on));
  $('#btn-compact').textContent = on ? t('fullPage') : t('presentation');
  setHash();
  if (on) { window.scrollTo(0, 0); computeCompactRowH(); }
  layoutAll();
  if (!busy) updateKpis();
}

function build() {
  scenarios = buildScenarios(P);
  const D = new Demand(P);
  sims = scenarios.map(sc => new Sim(sc, D, P));
  buildStrips();
  if (isCompact()) computeCompactRowH();
  layoutAll();
  $('#bar-sub').textContent = t('barSub', P);
  $('#lede').textContent = t('lede', P);
  $('#eyebrow').textContent = t('eyebrow', P);
  buildDayInput();
}

/* ---------- évaluation : cinq simulations d'une heure, tirages fixés, en tâche de fond ---------- */
function startEvaluation() {
  const job = ++evalJob, Pe = P, scs = buildScenarios(Pe), acc = scs.map(() => []);
  evalRes = null; evalProg = 0; evalP = Pe;
  let rep = 0, cur = null;
  const tick = () => {
    if (job !== evalJob) return;
    const t0 = performance.now();
    while (performance.now() - t0 < 22) {
      if (!cur) { const Pr = { ...Pe, seed: Pe.seed + rep }; const D = new Demand(Pr); cur = scs.map(sc => new Sim(sc, D, Pr)); }
      for (let n = 0; n < 40; n++) for (const s of cur) s.step();
      if (cur[0].t >= EVAL_T - 1e-6) {
        cur.forEach((s, i) => acc[i].push(stats(s)));
        cur = null; rep++;
        if (rep >= REPS) { evalRes = aggregate(acc); evalProg = 1; if (!busy) updateKpis(); buildNoteUI(); renderProfileCross(); startDay(); return; }
      }
    }
    evalProg = (rep + (cur ? cur[0].t / EVAL_T : 0)) / REPS;
    setTimeout(tick, 0);
  };
  setTimeout(tick, 0);
}

/* ---------- affichage des chiffres ---------- */
function setClass(el, cls) { el.classList.remove('ok-t', 'warn-t', 'bad-t'); if (cls) el.classList.add(cls); }
const lvl = (v, good, mid, lowerIsBetter = true) => !Number.isFinite(v) ? '' : lowerIsBetter ? (v <= good ? 'ok-t' : v <= mid ? 'warn-t' : 'bad-t') : (v >= good ? 'ok-t' : v >= mid ? 'warn-t' : 'bad-t');
let verdictHTML = '', lastTable = '';

function updateKpis() {
  const S = evalRes || sims.map(stats), ref = S[0], rec = evalRes ? recommend(evalRes, scenarios) : null;
  const u = k => t(k);
  S.forEach((s, i) => {
    const art = views[i].art, q = k => art.querySelector(`[data-k="${k}"]`);
    const e1 = q('v85'); e1.innerHTML = `${f0(s.v85)} <small>${u('kmh')}</small>`; setClass(e1, lvl(s.v85, 30, 40));
    q('tt').innerHTML = `${f0(s.tt)} ${u('s')}` + (i ? ` <small>${sgn(s.tt - ref.tt)}</small>` : '');
    q('q').innerHTML = `${f0(s.qMax)} <small>${u('m')}</small>`;
    const e4 = q('ped'); e4.innerHTML = `${f0(s.pedW)} <small>${u('s')}</small>`; setClass(e4, lvl(s.pedW, 10, 30));
    const e5 = q('risk'); e5.innerHTML = `${f1(s.surgRisk)} <small>%</small>`; setClass(e5, lvl(s.surgRisk, 0.5, 2));
    for (const k of [0, 1]) { const el = q('q' + k), txt = views[i].queueText(k); if (el.textContent !== txt) el.textContent = txt; }
    const state = s.sat ? ['bad', t('stSat')] : (s.qAvg >= 15 || s.qMax >= 100) ? ['warn', t('stFiles')] : ['ok', t('stFluid')];
    const pill = q('state'), html = `<span class="lg">${state[1][0]}</span><span class="sh">${state[1][1]}</span>`;
    if (pill.innerHTML !== html) { pill.className = 'pill ' + state[0]; pill.innerHTML = html; }
    const isBest = !!rec && rec.best === i;
    q('rec').hidden = !isBest; art.classList.toggle('best', isBest);
  });
  const rows = S.map((s, i) => {
    const c = (v, cls) => `<td class="${cls}">${v}</td>`;
    const cl = [i ? '' : 'ref', rec && rec.best === i ? 'best' : ''].join(' ');
    return `<tr class="${cl}"><td class="name">${scName(scenarios[i])}</td>`
      + c(f0(s.v85), lvl(s.v85, 30, 40))
      + c(f0(s.tt), '')
      + c(i ? sgn(s.tt - ref.tt) : '–', '')
      + c(f0(s.flow), lvl(s.flow, 0.97 * P.q, 0.9 * P.q, false))
      + c(f0(s.stopPct), lvl(s.stopPct, 20, 50))
      + c(f0(s.qMax), lvl(s.qMax, 50, 150))
      + c(f1(s.pedW), lvl(s.pedW, 10, 30))
      + c(f0(s.yieldPct), lvl(s.yieldPct, 70, 40, false))
      + c(f0(s.surgStop) + ' %', lvl(s.surgStop, 90, 60, false))
      + c(f1(s.surgRisk) + ' %', lvl(s.surgRisk, 0.5, 2)) + '</tr>';
  }).join('');
  if (rows !== lastTable) { lastTable = rows; $('#summary tbody').innerHTML = rows; }
  const fp = fingerprint(P), fpTxt = calibModified ? t('calibMod', fp) : t('calibRef', fp);
  $('#summary-note').textContent = evalRes ? t('sumNote', P, fpTxt) : t('sumRunning', Math.round(evalProg * 100));
  renderVerdict();
  const flag = $('#calib-flag'); flag.hidden = !calibModified; flag.textContent = t('calibFlag');
}

function renderVerdict() {
  let h = '';
  if (calibModified) h += `<p class="v-warn">${t('vCalib')}</p>`;
  if (!evalRes) h += `<p class="eyebrow">${t('vEyebrow')}</p><p>${t('vRunning', Math.round(evalProg * 100))}</p>`;
  else {
    const r = recommend(evalRes, scenarios), ref = evalRes[0];
    if (r.best < 0) h += `<p class="eyebrow">${t('vEyebrow')}</p><h3>${t('vNoneTitle')}</h3><p>${t('vNone')}</p>`;
    else {
      const e = evalRes[r.best];
      h += `<p class="eyebrow">${t('vEyebrow')}</p><h3>${scName(scenarios[r.best])}</h3><p>${t('vMetrics', e, ref)}</p>`;
      h += `<p class="${e.v85 <= 30 ? 'ok-t' : 'warn-t'}">${e.v85 <= 30 ? t('vSafeOk') : t('vSafeKo', e.v85)}</p>`;
      if (ref.surgRisk - e.surgRisk < 0.1) h += `<p class="warn-t">${t('vSmallGain')}</p>`;
    }
    if (r.excluded.length) {
      const why = x => x.why.map(w => w === 'sat' ? t('reasonSat', evalRes[x.i], evalP) : t('reasonReg')).join(t('sep'));
      h += `<p class="v-excl"><strong>${t('vExcluded')}</strong> ${r.excluded.map(x => `${scName(scenarios[x.i])} (${why(x)})`).join(' · ')}</p>`;
    }
    h += `<p class="v-rule">${t('vCriteria')}</p>`;
  }
  if (h !== verdictHTML) { verdictHTML = h; $('#verdict').innerHTML = h; }
}

function clock() {
  const tt = sims.length ? sims[0].t : 0, h = Math.floor(tt / 3600), m = Math.floor(tt % 3600 / 60), s = String(Math.floor(tt % 60)).padStart(2, '0');
  $('#clock').innerHTML = `${t('clock', h, m, s)}<small>${t('simTime')}</small>`;
}

function advance(seconds, btn) {
  busy = true;
  const target = sims[0].t + seconds, start = sims[0].t;
  document.querySelectorAll('.bar button, #params button').forEach(b => { b.disabled = b !== $('#btn-play') && !b.dataset.speed && !b.dataset.view && !b.dataset.color && !b.dataset.free; });
  const chunk = () => {
    const t0 = performance.now();
    while (performance.now() - t0 < 35 && sims[0].t < target - 1e-6) for (const s of sims) s.step();
    if (btn) btn.textContent = t('computing', Math.round(100 * (sims[0].t - start) / seconds));
    if (sims[0].t < target - 1e-6) setTimeout(chunk, 0);
    else {
      busy = false;
      if (btn) btn.textContent = t('hour');
      document.querySelectorAll('.bar button, #params button').forEach(b => { b.disabled = false; });
      updateKpis();
    }
  };
  chunk();
}

function frame(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !busy) {
    accT += dtReal * speed;
    let n = 0;
    while (accT >= DT && n < 400) { for (const s of sims) s.step(); accT -= DT; n++; }
    if (n >= 400) accT = 0;
  }
  for (const v of views) if (v.visible) v.draw();
  if (now - lastKpi > 400) { lastKpi = now; clock(); if (!busy) updateKpis(); }
  requestAnimationFrame(frame);
}

/* ---------- formulaire : site et conception modifiables, calibrage verrouillé ---------- */
// données de la rue et conception en haut de page ; calibrage verrouillé en bas
function buildForm() {
  const G = t('groups'), ui = uiIdx();
  const fs = grp => {
    const locked = grp.lock && !calibUnlocked;
    const fields = grp.items.map(f => `<div class="field"><label for="p-${f.k}">${f[lang]}</label><input id="p-${f.k}" name="${f.k}" type="number" step="${f.step}"${f.min !== undefined ? ` min="${f.min}" max="${f.max}"` : ''} inputmode="decimal" value="${P[f.k]}"${locked ? ' readonly' : ''}><span class="unit">${f.u[ui]}</span></div>`).join('');
    return `<fieldset class="${grp.lock ? 'calib' : ''}"><legend>${G[grp.g][0]}</legend><div class="fields">${fields}</div><p class="src">${G[grp.g][1]}</p>${grp.lock ? `<button class="btn" type="button" id="btn-unlock">${calibUnlocked ? t('lock') : t('unlock')}</button>` : ''}</fieldset>`;
  };
  $('#params').innerHTML = FIELDS.filter(g => !g.lock).map(fs).join('')
    + `<div class="form-actions"><button class="btn primary" type="submit">${t('apply')}</button><button class="btn" type="button" id="btn-defaults">${t('defaults')}</button><span class="msg" id="form-msg"></span></div>`;
  $('#params-calib').innerHTML = FIELDS.filter(g => g.lock).map(fs).join('')
    + `<div class="form-actions"><button class="btn primary" type="submit" id="btn-apply-calib"${calibUnlocked ? '' : ' hidden'}>${t('applyCalib')}</button><span class="msg" id="form-msg-c"></span></div>`;
}
let formMsg = '#form-msg';
function onFormClick(e) {
  const id = e.target && e.target.id;
  if (id === 'btn-unlock') {
    calibUnlocked = !calibUnlocked;
    document.querySelectorAll('fieldset.calib input').forEach(i => { i.readOnly = !calibUnlocked; });
    e.target.textContent = calibUnlocked ? t('lock') : t('unlock');
    $('#btn-apply-calib').hidden = !calibUnlocked;
    $('#form-msg-c').textContent = calibUnlocked ? t('msgUnlocked') : t('msgLocked');
  } else if (id === 'btn-defaults') {
    for (const grp of FIELDS) for (const f of grp.items) if (!grp.lock || calibUnlocked) $('#p-' + f.k).value = DEFAULTS[f.k];
    $('#form-msg').textContent = t('msgDefaults');
  }
}
$('#params').addEventListener('click', onFormClick);
$('#params-calib').addEventListener('click', onFormClick);
$('#params').addEventListener('submit', e => { formMsg = '#form-msg'; applyParams(e); });
$('#params-calib').addEventListener('submit', e => { formMsg = '#form-msg-c'; applyParams(e); });
function applyParams(e) {
  e.preventDefault();
  const next = { ...P }, bad = [];
  for (const grp of FIELDS) for (const f of grp.items) {
    if (grp.lock && !calibUnlocked) continue;
    const val = parseFloat(String($('#p-' + f.k).value).replace(',', '.'));
    if (!Number.isFinite(val) || val < 0) { bad.push(f[lang]); continue; }
    if (f.min !== undefined && (val < f.min || val > f.max)) { bad.push(t('msgRange', f[lang], nfa.format(f.min), nfa.format(f.max))); continue; }
    next[f.k] = val;
  }
  if (next.retLane >= next.laneW) bad.push(t('msgLane'));
  if (next.vPed < 0.3) bad.push(FIELDS[2].items[3][lang]);
  if (bad.length) { $(formMsg).textContent = t('msgFix', bad.join(t('sep'))); return; }
  P = derive(next);
  calibModified = fingerprint(P) !== FP_REF;
  $(formMsg).textContent = t('msgApplied');
  restart(true);
}

function restart(paramsChanged) {
  build();
  advance(PRERUN, null);
  if (paramsChanged) { startEvaluation(); renderThumbs(); }
}

/* ---------- vignettes 3D et agrandissement ---------- */
function geomKey() { return ['laneW', 'retLane', 'retIsl', 'chOff', 'chTrans', 'chLane'].map(k => P[k]).join('|'); }
function renderThumbs() {
  if (!V3D.ok()) { document.body.classList.add('no3d'); return; }
  document.body.classList.remove('no3d');
  const key = geomKey();
  if (key === thumbKey && thumbs.size === scenarios.length) return;
  thumbKey = key; thumbs.clear();
  const job = ++thumbJob, list = scenarios.slice();
  let i = 0;
  const next = () => {
    if (job !== thumbJob || i >= list.length) return;
    const sc = list[i++];
    try {
      const url = V3D.render(sc, 768, 432, 2048).toDataURL('image/jpeg', 0.9);
      thumbs.set(sc.id, url);
      const img = document.querySelector(`#bande-${sc.id} .thumb img`); if (img) img.src = url;
    } catch (err) { document.body.classList.add('no3d'); return; }
    setTimeout(next, 30);
  };
  setTimeout(next, 30);
}
let dlgUrl = null;
function open3D(sc) {
  const dlg = $('#dlg3d');
  $('#dlg-cap').textContent = scName(sc);
  $('#dlg-note').textContent = t('dlgNote');
  $('#dlg-close').textContent = t('dlgClose');
  $('#dlg-img').src = thumbs.get(sc.id) || '';
  $('#dlg-img').alt = scName(sc);
  const dl = $('#dlg-dl'); dl.hidden = true;
  $('#dlg-status').textContent = t('dlgRendering');
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  setTimeout(() => {
    try {
      V3D.render(sc, 3840, 2160, 4096).toBlob(blob => {
        if (!blob) return;
        if (dlgUrl) URL.revokeObjectURL(dlgUrl);
        dlgUrl = URL.createObjectURL(blob);
        $('#dlg-img').src = dlgUrl;
        dl.href = dlgUrl; dl.download = `vue-3d-${sc.id}.png`; dl.textContent = t('dlgDownload'); dl.hidden = false;
        $('#dlg-status').textContent = t('dlgReady');
      }, 'image/png');
    } catch (err) { $('#dlg-status').textContent = ''; }
  }, 60);
}
$('#dlg-close').addEventListener('click', () => { const d = $('#dlg3d'); if (d.close) d.close(); else d.removeAttribute('open'); });
$('#dlg3d').addEventListener('click', e => { if (e.target === e.currentTarget && e.currentTarget.close) e.currentTarget.close(); });

// --- géométrie locale (mètres autour du point) ---
function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  const u = L2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)) : 0, q = [a[0] + u * dx, a[1] + u * dy];
  return { d: Math.hypot(p[0] - q[0], p[1] - q[1]), q };
}
function lineDist(p, pts, closed) {
  let best = { d: Infinity, q: null };
  const n = pts.length - (closed ? 0 : 1);
  for (let i = 0; i < n; i++) { const s = segDist(p, pts[i], pts[(i + 1) % pts.length]); if (s.d < best.d) best = s; }
  return best;
}
function inPoly(p, pts) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++)
    if ((pts[i][1] > p[1]) !== (pts[j][1] > p[1]) && p[0] < (pts[j][0] - pts[i][0]) * (p[1] - pts[i][1]) / (pts[j][1] - pts[i][1]) + pts[i][0]) c = !c;
  return c;
}
function elemLL(el) {
  if (el.type === 'node') return [[[el.lat, el.lon]]];
  if (el.type === 'way' && el.geometry) return [el.geometry.map(g => [g.lat, g.lon])];
  if (el.type === 'relation' && el.members) return el.members.filter(m => m.geometry && m.role !== 'inner').map(m => m.geometry.map(g => [g.lat, g.lon]));
  return [];
}
function distRings(p, rings) {
  let d = Infinity;
  for (const r of rings) {
    if (r.length === 1) { d = Math.min(d, Math.hypot(p[0] - r[0][0], p[1] - r[0][1])); continue; }
    if (r.length > 2 && inPoly(p, r)) return 0;
    d = Math.min(d, lineDist(p, r, true).d);
  }
  return d;
}

const SITE = { lat: null, lon: null, data: null, pop: null, popState: '' };
let MAP = null, mkPoint = null, siteLayer = null;
function initMap() {
  if (MAP) return;
  if (typeof window.L === 'undefined') { $('#map').hidden = true; $('#map-msg').textContent = t('mapOffline'); return; }
  MAP = window.L.map('map', { scrollWheelZoom: false }).setView([36.8065, 10.1815], 13);
  const osm = window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  const sat = window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' });
  osm.addTo(MAP);
  window.L.control.layers({ [t('mapPlan')]: osm, [t('mapSat')]: sat }, null, { position: 'topright' }).addTo(MAP);
  siteLayer = window.L.layerGroup().addTo(MAP);
  MAP.on('click', e => { MAP.scrollWheelZoom.enable(); setPoint(e.latlng.lat, e.latlng.lng); });
  $('#map-msg').textContent = t('mapClick');
}
function setPoint(lat, lon) {

/* carte de la note : tuiles OpenStreetMap (plan) ou Esri (vue aérienne) assemblées dans un SVG, surcharge vectorielle

const TILE_SRC = {
  osm: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,

      o.push(`<polygon points="${fx(q[0])},${fx(q[1] - 10)} ${fx(q[0] + 9)},${fx(q[1] + 6)} ${fx(q[0] - 9)},${fx(q[1] + 6)}" fill="#ef8f00" stroke="#000" stroke-width="1"/>`);

  o.push(`<path d="M${fx(W / 2)} ${fx(H / 2)}l-9 -16a11 11 0 1 1 18 0z" fill="#c62828" stroke="#fff" stroke-width="2.5"/><circle cx="${fx(W / 2)}" cy="${fx(H / 2 - 21)}" r="4" fill="#fff"/>`);

  guideBody: `<p><strong>Purpose.</strong> Help a municipality choose the design that best protects pedestrians at a crossing, without blocking traffic, and produce the design report that justifies this choice. Under exactly the same traffic, the tool compares nine speed-moderation measures and the current situation.</p>
    <h3>The steps</h3>

      <li><strong>Locate the site</strong> on the map, then click “Analyze the site”: street, nearby schools and health facilities, bus stops, population density.</li>

      <li><strong>Adjust the measures</strong>: dimensions of the narrowing and the chicane, signal timing. Then click “Apply and rerun”.</li>
      <li><strong>Watch the simulations</strong>: one animated strip per measure, with its key figures and a 3D view (click the thumbnail). Presentation mode shows them all on one screen.</li>

      <li><strong>Choose the option and produce the design report</strong>, to print or save as a PDF.</li>

// trois profils sur la même largeur de façade à façade : existant (PROF), projeté en section courante (PROJ, null = identique
// à l'existant) et, par variante, profil au droit du passage modifié à la main (CROSS[id], absent = calculé)
const cloneSegs = segs => segs.map(s => ({ t: s.t, w: s.w, d: s.d }));
const okSegs = a => Array.isArray(a) && a.length > 0 && a.every(g => g && SEG[g.t] && g.w > 0);
const readSegs = a => a.map(g => ({ t: g.t, w: +g.w, d: g.d < 0 ? -1 : 1 }));
const sameSegs = (a, b) => a.length === b.length && a.every((s, i) => s.t === b[i].t && Math.abs(s.w - b[i].w) < 0.005 && s.d === b[i].d);
let PROF = presetProfile('defaut'), PROJ = null, pfTab = 'ex';
const CROSS = {};
try {
  const s = JSON.parse(localStorage.getItem('mv-prof') || 'null');
  if (s && okSegs(s.segs)) {
    PROF = { total: +s.total || 12, segs: readSegs(s.segs) };
    if (okSegs(s.proj)) PROJ = readSegs(s.proj);
    if (s.cross) for (const k of Object.keys(s.cross)) if (okSegs(s.cross[k])) CROSS[k] = readSegs(s.cross[k]);
