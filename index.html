    const list = (ttl, arr, cls) => arr.length ? `<p class="jx-l ${cls}"><strong>${esc(ttl)}</strong></p><ul class="${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
    h += `<tr class="${R.top[0] === id ? 'best' : ''} st-${r.status}"><td class="name">${esc(T[id])}</td><td>${pill(r.status)}</td><td class="jx-cap ${r.status === 'excl' ? 'na' : r.cap.lvl}">${r.status === 'excl' ? '–' : esc(CP[r.cap.lvl])}</td>`
      + `<td class="jx-why"><details><summary>${esc(main)}</summary>${list(jt('exclWhy'), r.excl, 'bad')}${list(jt('cons'), r.cons, 'warn')}${list(jt('pros'), r.pros, 'ok')}${r.cap.txt.length ? `<ul class="info">${r.cap.txt.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</details></td></tr>`;
  }
  h += '</tbody></table></div>';
  const pick = jxPicked && R.r[jxPicked] ? jxPicked : a;
  if (pick) {
    const A = jxAssoc(pick, JX, d);
    h += `<h3>${esc(jt('assocTitle'))} — ${esc(T[pick])}</h3><ul class="jx-assoc">${A.assoc.concat(A.dims, [A.sign]).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  }
  $('#jx-res').innerHTML = h;
  // choix du type et note
  const opts = R.order.map(id => `<option value="${id}"${id === pick ? ' selected' : ''}>${esc(T[id])}${id === a ? esc(jt('recSuffix')) : ''} — ${esc(ST[R.r[id].status])}</option>`).join('');
  $('#jx-note').innerHTML = `<h3>${esc(jt('chooseTitle'))}</h3><p class="note">${esc(jt('chooseIntro'))}</p>
    <div class="note-grid"><label class="nf"><span>${esc(jt('chooseLabel'))}</span><select id="jx-pick">${opts}</select></label>
    <label class="nf"><span>${t('mCommune')}</span><input id="jx-commune" type="text" value="${esc(META.commune)}" autocomplete="off"></label>
    <label class="nf"><span>${t('mLieu')}</span><input id="jx-lieu" type="text" value="${esc(META.lieu)}" autocomplete="off"></label>
    <label class="nf"><span>${t('mAuteur')}</span><input id="jx-auteur" type="text" value="${esc(META.auteur)}" autocomplete="off"></label></div>
    <div class="form-actions"><button class="btn primary" type="button" id="jx-btn-note">${esc(jt('btnNote'))}</button><span class="msg" id="jx-note-msg"></span></div>`;
}
$('#jx-form').addEventListener('input', e => {
  const el = e.target, k = el.dataset.jx; if (!k) return;
  if (el.type === 'checkbox') JX[k] = el.checked;
  else if (el.tagName === 'SELECT') JX[k] = typeof JX_DEF[k] === 'number' ? +el.value : el.value;
  else { const v = parseFloat(el.value); if (!Number.isFinite(v)) return; JX[k] = Math.min(+el.max, Math.max(+el.min, v)); }
  saveJx(); renderJx();
});
$('#jx-res').addEventListener('click', e => { const tr = e.target.closest('tr[class*="st-"]'); if (tr && !e.target.closest('summary, details')) tr.querySelector('details').open ^= true; });
$('#jx-note').addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'jx-pick') { jxPicked = el.value; renderJx(); return; }
  if (/^jx-(commune|lieu|auteur)$/.test(el.id)) { META[el.id.slice(3)] = el.value; try { localStorage.setItem('mv-meta', JSON.stringify(META)); } catch (err) { /* stockage indisponible */ } }
});
let jxNoteUrl = null;
$('#jx-note').addEventListener('click', async e => {
  if (e.target.id !== 'jx-btn-note') return;
  const id = $('#jx-pick').value;
  jxNoteUrl = await openNote(() => buildJxNote(id), '#jx-note-msg', jxNoteUrl);
});

/* ---------- note de choix du carrefour ---------- */
function buildJxNote(id) {
  const R = JXR || jxEval(JX), d = R.d, r = R.r[id], N = jt('n'), T = jt('types'), ST = jt('st'), CP = jt('cap'), F = jt('f'), O = jt('o'), U = jt('u');
  const NN = NOTE[lang] || NOTE.fr, A = jxAssoc(id, JX, d);
  const meta = { commune: META.commune || NN.unknown, lieu: META.lieu || NN.unknown, auteur: META.auteur || NN.unknown, objet: N.objet, name: T[id], outil: NN.outil,
    date: new Date().toLocaleDateString(lang === 'en' ? 'en-GB' : 'fr-FR', lang === 'en' ? { day: 'numeric', month: 'long', year: 'numeric' } : undefined) };
  const li = arr => '<ul>' + arr.map(s => `<li>${esc(s)}</li>`).join('') + '</ul>';
  const tbl = (cols, rows) => `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
  let sn = 0; const H2 = k => `<h2>${++sn}. ${esc(N.s[k])}</h2>`;
  const genLine = esc(NN.genBy).replace('urbain.ksr-infra.org', '<a href="https://urbain.ksr-infra.org" class="num">urbain.ksr-infra.org</a>');
  let h = `<h1>${esc(N.title)}</h1><p class="sub">${esc(N.sub)}</p><p class="small gen">${genLine}</p>`;
  h += `<table class="cover"><tbody>${N.cover.map(([k, l]) => `<tr><td>${esc(l)}</td><td>${esc(meta[k])}</td></tr>`).join('')}</tbody></table>`;
  // en bref
  const a = R.top[0], b = R.top[1], nEx = R.order.filter(x => R.r[x].status === 'excl').length;
  h += `${H2('brief')}<ul class="brief">${[a ? N.brief.rec(T[a], b ? T[b] : '') : jt('recNone'), N.brief.chosen(T[id]), N.brief.traffic(f0(d.E), f0(d.daily)), N.brief.excl(nEx), N.brief.next].map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
  // le lieu
  if (SITE.lat !== null) {
    const la = SITE.lat, lo = SITE.lon, gm = `https://www.google.com/maps/search/?api=1&query=${la.toFixed(5)},${lo.toFixed(5)}`, osm = `https://www.openstreetmap.org/?mlat=${la.toFixed(5)}&mlon=${lo.toFixed(5)}#map=18/${la.toFixed(5)}/${lo.toFixed(5)}`;
    h += `${H2('site')}<p>${esc(NN.siteCoords(la, lo))} <a href="${osm}">${esc(NN.osmLink)}</a> · <a href="${gm}">${esc(NN.gmLink)}</a></p>`;
    h += `<figure class="map-fig">${tileMapSVG(la, lo, 17, 'osm', 700, 470, SITE.data)}<figcaption class="small">${esc(SITE.data ? NN.siteFig : NN.siteFig0)} ${esc(NN.osmAttr)}</figcaption></figure>`;
    h += `<figure class="map-fig">${tileMapSVG(la, lo, 18, 'sat', 700, 400, null)}<figcaption class="small">${esc(NN.satFig)} ${esc(NN.satAttr)}</figcaption></figure>`;
  }
  // les données
  const val = ([k, kind, opt, unit]) => kind === 'chk' ? (JX[k] ? O.yes : O.no) : kind === 'sel' ? (unit ? O[unit][JX[k]] : `${JX[k]} ${U.kmh}`) : `${fm2(JX[k])} ${U[unit] || ''}`;
  const rows = [];
  for (const g of ['ctx', 'geo', 'traf', 'users']) { rows.push(`<tr><th colspan="2">${esc(jt('g')[g])}</th></tr>`); for (const f of JXF[g]) rows.push(`<tr><td>${esc(F[f[0]])}</td><td>${esc(val(f))}</td></tr>`); }
  const objs = JXF.obj.filter(f => JX[f[0]]).map(f => F[f[0]]);
  rows.push(`<tr><th colspan="2">${esc(jt('g').obj)}</th></tr><tr><td colspan="2">${esc(objs.join(' ; ') || '–')}</td></tr>`);
  h += `${H2('data')}${tbl(N.dataCols, rows)}<p class="small">${esc(jt('traffic', f0(d.E), f0(d.P), f0(d.S), f0(d.daily)))}</p>`;
  // la démarche
  h += `${H2('method')}${li(N.method)}<p>${esc(jt('rule'))}</p>`;
  // l'analyse critère par critère
  const hn = x => jt('hName')[x], hk = d.hierKey.split('|');
  const hl = d.hierList.map(x => x === 'gir' ? jt('girName') : T[x]).join(', ');
  h += `${H2('analysis')}<h3>${esc(N.hAn.hier)}</h3><p>${esc(d.hierList.length ? jt('hierList', hn(hk[0]), hn(hk[1]), hl) : jt('hierVoid'))}</p>`;
  h += `<h3>${esc(N.hAn.traf)}</h3>${li([jt('traffic', f0(d.E), f0(d.P), f0(d.S), f0(d.daily))].concat(R.r.clp.cap.txt.slice(1), R.r.feux.cap.txt, R.r.compact.cap.txt, R.r.moyen.cap.txt))}`;
  h += `<figure class="pf-fig" style="max-width:120mm">${jxSPChart(d.P, d.S)}<figcaption class="small">${esc(N.figSP)}</figcaption></figure>`;
  const usersL = [...new Set(JX_TYPES.flatMap(x => R.r[x].pros.concat(R.r[x].cons)).filter(s => /piéton|cycl|transport|bus|tram|pedestrian|cyclist|transit|مترجّل|درّاج|نقل|حافل|ترامواي/i.test(s)))];
  h += `<h3>${esc(N.hAn.users)}</h3>${li(usersL.slice(0, 10))}`;
  const geoL = [...new Set(JX_TYPES.flatMap(x => R.r[x].excl.concat(R.r[x].cons)).filter(s => /emprise|branche|pente|angle|voie par sens|footprint|branch|slope|gradient|lane per direction|عرض|فرع|انحدار|زاوي/i.test(s)))];
  h += `<h3>${esc(N.hAn.geo)}</h3>${li(geoL.length ? geoL : ['–'])}`;
  // la comparaison
  h += `${H2('compare')}${tbl(N.cmpCols, R.order.map(x => { const q = R.r[x]; return `<tr${x === id ? ' style="font-weight:600"' : ''}><td>${esc(T[x])}</td><td>${esc(ST[q.status])}</td><td>${esc(CP[q.cap.lvl])}</td><td>${esc(q.excl[0] || q.cons[0] || q.pros[0] || '')}</td></tr>`; }))}`;
  // le type retenu
  h += `${H2('chosen')}<p><strong>${esc(N.chosenIntro(T[id]))}</strong></p>`;
  if (id !== a) h += `<p>${esc(N.notRec)}</p>`;
  if (r.excl.length) h += `<p class="ck-bad"><strong>${esc(N.exclWarn)}</strong></p>${li(r.excl)}`;
  h += `<figure class="pf-fig" style="max-width:140mm">${jxSketch(id, JX)}<figcaption class="small">${esc(N.figSketch)}</figcaption></figure>`;
  h += `<h3>${esc(N.dims)}</h3>${li(A.dims)}<h3>${esc(N.assoc)}</h3>${li(A.assoc)}<h3>${esc(N.signs)}</h3><p>${esc(A.sign)}</p>`;
  if (r.cons.length) h += `<h3>${esc(N.vigil)}</h3>${li(r.cons)}`;
  // ce que l'outil ne tranche pas
  h += `${H2('open')}${li(N.open)}`;
  // plan d'action
  const ac = N.actions, acts = [[1, ac.count], [1, ac.acc], [1, ac.variants]];
  if (GIR.includes(id) && d.E > 1500) acts.push([1, ac.capRb]);
  if (id === 'feux' || id === 'feuxIlot') acts.push([1, ac.capFx]);
  if (JX.tc !== 'aucun') acts.push([2, ac.tc]);
  acts.push([2, ac.exec], [3, ac.after]);
  h += `${H2('plan')}${tbl(N.planCols, acts.map(([p, [x, w, q]]) => `<tr><td class="prio p${p}">P${p}</td><td>${esc(x)}</td><td>${esc(w)}</td><td>${esc(q)}</td></tr>`))}`;
  // annexe
  h += `<section class="annex"><h2>${esc(N.s.annex)}</h2>${li(N.hyp)}<ol dir="ltr">${N.sources.map(s => `<li>${esc(s)}</li>`).join('')}</ol></section>`;
  h += `<p class="small gen gen-end">${genLine} · ${esc(meta.date)}</p>`;
  const dir = lang === 'ar' ? 'rtl' : 'ltr';
  return `<!doctype html><html lang="${lang}" dir="${dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(N.title)} — ${esc(T[id])}</title><style>${NOTE_CSS}</style></head><body>
<div class="toolbar"><button type="button" onclick="window.print()">${esc(NN.print)}</button><span>${esc(N.title)} — ${esc(T[id])}</span></div>
<div class="sheet">${h}</div></body></html>`;
}
const fm2 = v => (Number.isInteger(v) ? nf0 : nfa).format(v);

Object.assign(PVT.fr, { guideBody: `<p><strong>Objectif.</strong> Donner à la commune un <strong>prédimensionnement</strong> de la structure de chaussée — les couches et leurs épaisseurs — dans plusieurs matériaux, pour préparer un projet et comparer des solutions. Il s’appuie sur le guide Cerema « Voirie urbaine » (2016) et, pour les matériaux locaux, sur le catalogue tunisien de 1984. <strong>Ce n’est pas un dimensionnement :</strong> en cas de doute, une étude géotechnique et de chaussée par un bureau d’études est nécessaire.</p>
    <h3>Les étapes</h3>
    <ol>
      <li><strong>Choisir l’espace</strong> : chaussée de rue, giratoire, voie de bus, stationnement, piste cyclable ou trottoir.</li>
      <li><strong>Indiquer le trafic de poids lourds</strong> (véhicules de plus de 3,5 t : camions, bus, bennes) par jour et par sens, en choisissant la situation la plus proche ou en saisissant un comptage ; la durée de service et la croissance du trafic.</li>
      <li><strong>Décrire le sol</strong> : sa nature, ou mieux l’indice CBR s’il a été mesuré ; signaler un sol mal drainé.</li>
      <li><strong>Lire les structures proposées</strong> : chacune a son avis (adapté, sous conditions, étude spécifique, déconseillé), sa coupe et ses épaisseurs.</li>
      <li><strong>Choisir la structure retenue et produire la note</strong>.</li>
    </ol>
    <h3>Les données nécessaires</h3>
    <div class="table-wrap"><table><thead><tr><th>Donnée</th><th>Comment l’obtenir</th><th>Indispensable ?</th></tr></thead><tbody>
      <tr><td>Poids lourds par jour et par sens</td><td>Comptage, ou situation la plus proche proposée par l’outil</td><td>Oui</td></tr>
      <tr><td>Nature du sol</td><td>Observation lors d’un sondage ou des travaux voisins</td><td>Oui</td></tr>
      <tr><td>Indice CBR</td><td>Essai de laboratoire ou in situ</td><td>Fortement conseillé</td></tr>
      <tr><td>Drainage du sol</td><td>Nappe proche, point bas, eaux stagnantes</td><td>Oui</td></tr>
      <tr><td>Durée de service</td><td>Choix de la commune (15 ans en général)</td><td>Oui</td></tr>
    </tbody></table></div>
    <h3>Où trouver les résultats</h3>
    <ul>
      <li><strong>Dans « Résultat »</strong> : la classe de trafic, le trafic cumulé, la classe de plate-forme, puis les structures comparées avec leurs coupes.</li>
      <li><strong>Dans « Quand faire une étude approfondie »</strong> : les cas où le prédimensionnement ne suffit pas.</li>
      <li><strong>Dans la note</strong> (bouton « Générer la note de chaussée ») : l’avertissement, les données, la démarche, la comparaison, la structure retenue et les sources.</li>
    </ul>
    <p class="note">Les épaisseurs sont des ordres de grandeur. Le sol doit être reconnu avant les travaux, et les réseaux enterrés protégés.</p>` });
Object.assign(PVT.ar, { guideBody: `<p><strong>الهدف.</strong> تمكين البلدية من <strong>تصميم أوّلي</strong> لهيكل المعبّد — الطبقات وسُمكها — بعدّة موادّ، لإعداد مشروع ومقارنة الحلول. ويستند إلى دليل Cerema «Voirie urbaine» (2016)، وبالنسبة إلى الموادّ المحلية إلى الدليل التونسي لسنة 1984. <strong>ليس تصميمًا نهائيًا:</strong> عند الشكّ، تلزم دراسة جيوتقنية ودراسة للمعبّد من قِبل مكتب دراسات.</p>
    <h3>المراحل</h3>
    <ol>
      <li><strong>اختيار الفضاء</strong>: معبّد نهج، مفترق دائري، مسلك حافلات، أماكن وقوف، مسلك درّاجات أو رصيف.</li>
      <li><strong>تحديد حركة العربات الثقيلة</strong> (أكثر من 3,5 طن: شاحنات، حافلات، شاحنات الفضلات) في اليوم وفي كل اتجاه، باختيار الوضعية الأقرب أو بإدخال عدّ؛ ومدّة الخدمة ونموّ الحركة.</li>
      <li><strong>وصف التربة</strong>: طبيعتها، أو أفضل من ذلك مؤشّر CBR إن قيس؛ والإشارة إلى تربة سيّئة الصرف.</li>
      <li><strong>قراءة الهياكل المقترحة</strong>: لكلّ منها رأي (ملائم، بشروط، دراسة خاصّة، غير مستحسن)، ومقطع وسُمك.</li>
      <li><strong>اختيار الهيكل المعتمد وإعداد المذكّرة</strong>.</li>
    </ol>
    <h3>المعطيات اللازمة</h3>
    <div class="table-wrap"><table><thead><tr><th>المعطى</th><th>كيفية الحصول عليه</th><th>ضروري؟</th></tr></thead><tbody>
      <tr><td>العربات الثقيلة في اليوم وفي كل اتجاه</td><td>عدّ، أو أقرب وضعية تقترحها الأداة</td><td>نعم</td></tr>
      <tr><td>طبيعة التربة</td><td>ملاحظة عند سبر أو أشغال مجاورة</td><td>نعم</td></tr>
      <tr><td>مؤشّر CBR</td><td>تجربة مخبرية أو ميدانية</td><td>يُنصح به بشدّة</td></tr>
      <tr><td>صرف مياه التربة</td><td>مائدة مائية قريبة، نقطة منخفضة، مياه راكدة</td><td>نعم</td></tr>
      <tr><td>مدّة الخدمة</td><td>اختيار البلدية (15 سنة عادةً)</td><td>نعم</td></tr>
    </tbody></table></div>
    <h3>أين توجد النتائج</h3>
    <ul>
      <li><strong>في «النتيجة»</strong>: صنف الحركة، والحركة المتراكمة، وصنف أرضية المعبّد، ثم الهياكل المقارنة مع مقاطعها.</li>
      <li><strong>في «متى تلزم دراسة معمّقة»</strong>: الحالات التي لا يكفي فيها التصميم الأوّلي.</li>
      <li><strong>في المذكّرة</strong> (زرّ «إعداد مذكّرة المعبّد»): التنبيه، والمعطيات، والمنهجية، والمقارنة، والهيكل المعتمد، والمصادر.</li>
    </ul>
    <p class="note">السُّمك المقترح تقريبي. يجب التعرّف على التربة قبل الأشغال وحماية الشبكات المدفونة.</p>` });
Object.assign(PVT.en, { guideBody: `<p><strong>Purpose.</strong> Give the municipality a <strong>preliminary design</strong> of the pavement structure — the layers and their thicknesses — in several materials, to prepare a project and compare solutions. It is based on the Cerema guide “Voirie urbaine” (2016) and, for local materials, on the 1984 Tunisian catalogue. <strong>It is not a structural design:</strong> when in doubt, a geotechnical and pavement study by a design consultant is required.</p>
    <h3>The steps</h3>
    <ol>
      <li><strong>Choose the space</strong>: street carriageway, roundabout, bus lane, parking, cycle track or sidewalk.</li>
      <li><strong>Enter the heavy-vehicle traffic</strong> (over 3.5 t: trucks, buses, refuse trucks) per day and per direction, by choosing the closest situation or entering a count; the design life and traffic growth.</li>
      <li><strong>Describe the soil</strong>: its nature, or better the CBR value if it was measured; flag poorly drained soil.</li>
      <li><strong>Read the proposed structures</strong>: each has a rating (suitable, with conditions, specific study, not recommended), a cross-section and thicknesses.</li>
      <li><strong>Choose the selected structure and produce the report</strong>.</li>
    </ol>
    <h3>Data needed</h3>
    <div class="table-wrap"><table><thead><tr><th>Data</th><th>How to obtain it</th><th>Required?</th></tr></thead><tbody>
      <tr><td>Heavy vehicles per day and per direction</td><td>Count, or the closest situation offered by the tool</td><td>Yes</td></tr>

}

  if (/^pv-(commune|lieu|auteur)$/.test(el.id)) { META[el.id.slice(3)] = el.value; try { localStorage.setItem('mv-meta', JSON.stringify(META)); } catch (err) { /* stockage indisponible */ } }
});
let pvNoteUrl = null;
$('#pv-note').addEventListener('click', async e => {
  if (e.target.id !== 'pv-btn-note') return;

/* ---------- note de prédimensionnement ---------- */
function buildPvNote(id) {
  const R = PVR || pvEval(PV), d = R.d, s = R.sols.find(x => x.id === id) || R.sols[0], N = pt('n'), ST = pt('st'), F = pt('f'), O = pt('o'), U = pt('u'), NN = NOTE[lang] || NOTE.fr;
  const meta = { commune: META.commune || NN.unknown, lieu: META.lieu || NN.unknown, auteur: META.auteur || NN.unknown, objet: N.objet, name: s.name, outil: NN.outil,
    date: new Date().toLocaleDateString(lang === 'en' ? 'en-GB' : 'fr-FR', lang === 'en' ? { day: 'numeric', month: 'long', year: 'numeric' } : undefined) };
  const li = arr => '<ul>' + arr.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>';
  const tbl = (cols, rows) => `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
  let sn = 0; const H2 = k => `<h2>${++sn}. ${esc(N.s[k])}</h2>`;
  const genLine = esc(NN.genBy).replace('urbain.ksr-infra.org', '<a href="https://urbain.ksr-infra.org" class="num">urbain.ksr-infra.org</a>');
  const tot = L => L.length && !L.some(l => l.txt === '?') ? `${fm2(Math.round(L.reduce((a, l) => a + (l.m === 'FORME' ? 0 : l.e), 0)))} ${U.cm}` : pt('toStudy');
  let h = `<h1>${esc(N.title)}</h1><p class="sub">${esc(N.sub)}</p><p class="small gen">${genLine}</p>`;
  h += `<table class="cover"><tbody>${N.cover.map(([k, l]) => `<tr><td>${esc(l)}</td><td>${esc(meta[k])}</td></tr>`).join('')}</tbody></table>`;
  h += `${H2('warn')}<div class="box"><strong>${esc(pt('warnTitle'))}.</strong> ${esc(pt('warn'))}</div>`;
  if (SITE.lat !== null) {
    const la = SITE.lat, lo = SITE.lon;
    h += `${H2('site')}<p>${esc(NN.siteCoords(la, lo))} <a href="https://www.google.com/maps/search/?api=1&query=${la.toFixed(5)},${lo.toFixed(5)}">${esc(NN.gmLink)}</a></p>`;
    h += `<figure class="map-fig">${tileMapSVG(la, lo, 17, 'osm', 700, 470, SITE.data)}<figcaption class="small">${esc(SITE.data ? NN.siteFig : NN.siteFig0)} ${esc(NN.osmAttr)}</figcaption></figure>`;
  }
  const rows = [];
  for (const g of Object.keys(PVF)) for (const [k, kind, , unit] of PVF[g]) {
    const v = kind === 'chk' ? (PV[k] ? O.yes : O.no) : kind === 'sel' ? O[unit][PV[k]] : kind === 'txt' ? (PV[k] || '–') : `${fm2(PV[k])} ${U[unit] || ''}`;
    rows.push(`<tr><td>${esc(F[k])}</td><td>${esc(v)}</td></tr>`);
  }
  h += `${H2('data')}${tbl(N.dataCols, rows)}<p>${esc(pt('classLine', d.T, f0(d.mja), nf0.format(Math.round(d.NE)), pfName(d.pf), d.q, d.risk))}</p><p class="small">${esc(d.hasCbr ? pt('pfFromCbr', fm2(d.cbr), f0(d.E)) : pt('pfFromSoil'))}</p>`;
  h += `${H2('method')}${li(N.method)}`;
  h += `${H2('sols')}${tbl(N.cmpCols, R.sols.map(x => `<tr${x.id === s.id ? ' style="font-weight:600"' : ''}><td>${esc(x.name)}</td><td>${esc(ST[x.st])}</td><td>${esc(tot(x.layers))}</td><td>${esc(x.notes[0] || '')}</td></tr>`))}`;
  h += `${H2('chosen')}<p><strong>${esc(N.chosenIntro(s.name))}</strong> (${esc(ST[s.st])})</p>`;
  if (s.layers.length) h += `<figure class="pf-fig pv-fig" style="max-width:110mm">${pvSection(s.layers)}<figcaption class="small">${esc(N.figSec)}</figcaption></figure>`;
  h += li(s.notes);
  h += `${H2('study')}${li(R.study)}`;
  h += `<section class="annex"><h2>${esc(N.s.annex)}</h2>${li(N.hyp)}<ol dir="ltr">${N.sources.map(x => `<li>${esc(x)}</li>`).join('')}</ol></section>`;
  h += `<p class="small gen gen-end">${genLine} · ${esc(meta.date)}</p>`;
  const dir = lang === 'ar' ? 'rtl' : 'ltr';
  return `<!doctype html><html lang="${lang}" dir="${dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(N.title)}</title><style>${NOTE_CSS} .pv-fig svg{width:100%;height:auto} .pv-tot{font-size:9.5pt;margin:1mm 0}</style></head><body>
<div class="toolbar"><button type="button" onclick="window.print()">${esc(NN.print)}</button><span>${esc(N.title)}</span></div>
<div class="sheet">${h}</div></body></html>`;
}
function buildPvUI() {
  $('#pv-title').textContent = pt('title'); $('#pv-warn').innerHTML = `<strong>${esc(pt('warnTitle'))}.</strong> ${esc(pt('warn'))}`;
  $('#pv-intro').textContent = pt('intro'); $('#pv-site-hint').textContent = pt('siteHint');

/* ---------- navigation entre modules : traversée piétonne, carrefour, chaussée ---------- */
let MOD = 'cross', modWasPlaying = false;
const MOD_SLOT = { jx: '#jx-site-slot', pv: '#pv-site-slot' };
function setModule(m) {
  MOD = m === 'jx' || m === 'pv' ? m : 'cross';
  document.body.classList.toggle('mod-jx', MOD === 'jx'); document.body.classList.toggle('mod-pv', MOD === 'pv');
  document.querySelectorAll('[data-mod]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mod === MOD)));
  // la carte du lieu est commune aux modules : on la déplace dans le module affiché ; l'animation s'arrête hors du module traversée
  const map = $('#site-map');
  if (MOD !== 'cross') { if (isCompact()) setCompact(false); if (playing) { modWasPlaying = true; setPlaying(false); } $(MOD_SLOT[MOD]).appendChild(map); }
  else { $('#donnees').insertBefore(map, $('#profil')); if (modWasPlaying) { modWasPlaying = false; setPlaying(true); } }
  if (MAP) setTimeout(() => MAP.invalidateSize(), 0);
  setHeaderTexts(); setHash();
}
function setHeaderTexts() {
  const tr = MOD === 'jx' ? jt : MOD === 'pv' ? pt : null;
  $('#guide-body').innerHTML = tr ? tr('guideBody') : t('guideBody');
  if (tr) { $('#eyebrow').textContent = tr(MOD + 'Eyebrow'); $('h1[data-i18n="h1"]').textContent = tr(MOD + 'H1'); $('#lede').textContent = tr(MOD + 'Lede'); }
  else { $('#eyebrow').textContent = t('eyebrow', P); $('h1[data-i18n="h1"]').textContent = t('h1'); $('#lede').textContent = t('lede', P); }
}
function buildJxUI() {
  $('#mod-switch').innerHTML = `<button class="btn" type="button" data-mod="cross">${esc(jt('modCross'))}</button><button class="btn" type="button" data-mod="jx">${esc(jt('modJx'))}</button><button class="btn" type="button" data-mod="pv">${esc(pt('modPv'))}</button>`;
  document.querySelectorAll('[data-mod]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mod === MOD)));
  $('#jx-title').textContent = jt('title'); $('#jx-intro').textContent = jt('intro'); $('#jx-site-hint').textContent = jt('siteHint');
  buildJxForm(); renderJx(); setHeaderTexts();
}
$('#mod-switch').addEventListener('click', e => { const b = e.target.closest('[data-mod]'); if (b && b.dataset.mod !== MOD) setModule(b.dataset.mod); });


/* =====================================================================================================
   PROJET : enregistrer (fichier sur le poste + copie archivée par l'administrateur, avec l'adresse IP)
   et ouvrir un projet. Le fichier contient tout l'état utile : lieu, données, profils, journée, carrefour.
   ===================================================================================================== */
Object.assign(I18N.fr, {
  projSave: 'Enregistrer le projet', projOpen: 'Ouvrir un projet',
  projNotice: 'À chaque enregistrement, le projet est téléchargé sur votre poste ; une copie et l’adresse IP de l’ordinateur sont aussi transmises à l’administrateur de l’application, pour le suivi des usages.',
  projSaved: f => `Projet enregistré sur votre poste : ${f}.`, projArchived: 'Copie transmise à l’administrateur.',
  projArchFail: 'La copie n’a pas pu être transmise à l’administrateur ; le fichier est bien enregistré sur votre poste.',
  projOpened: f => `Projet ouvert : ${f}.`, projBad: 'Ce fichier n’est pas un projet de cette application.', projFile: 'projet'
});
Object.assign(I18N.ar, {
  projSave: 'حفظ المشروع', projOpen: 'فتح مشروع',
  projNotice: 'عند كل حفظ، يُنزَّل المشروع على حاسوبك، وتُرسَل نسخة منه وعنوان IP للحاسوب أيضًا إلى مشرف التطبيق لمتابعة الاستعمال.',
  projSaved: f => `حُفظ المشروع على حاسوبك: ${f}.`, projArchived: 'أُرسلت نسخة إلى المشرف.',
  projArchFail: 'تعذّر إرسال النسخة إلى المشرف؛ أمّا الملف فقد حُفظ على حاسوبك.',
  projOpened: f => `فُتح المشروع: ${f}.`, projBad: 'هذا الملف ليس مشروعًا من هذا التطبيق.', projFile: 'مشروع'
});
Object.assign(I18N.en, {
  projSave: 'Save the project', projOpen: 'Open a project',
  projNotice: 'Each time you save, the project is downloaded to your computer; a copy and the computer’s IP address are also sent to the application administrator to monitor usage.',
  projSaved: f => `Project saved on your computer: ${f}.`, projArchived: 'Copy sent to the administrator.',
  projArchFail: 'The copy could not be sent to the administrator; the file is saved on your computer.',
  projOpened: f => `Project opened: ${f}.`, projBad: 'This file is not a project from this application.', projFile: 'project'
});

function projSnapshot() {
  const params = {}; for (const g of FIELDS) for (const f of g.items) params[f.k] = P[f.k];
  return { app: 'urbain.ksr-infra.org', kind: 'urb-projet', version: 1, savedAt: new Date().toISOString(), lang, module: MOD,
    meta: { ...META }, site: SITE.lat === null ? null : { lat: SITE.lat, lon: SITE.lon, data: SITE.data, pop: SITE.pop, popState: SITE.popState === 'run' ? '' : SITE.popState },
    params, calibModified, profile: { total: PROF.total, segs: PROF.segs, proj: PROJ, cross: CROSS }, day: { mode: DAY.mode, counts: DAY.counts },
    variant: pickedVariant, prices: { ...PRICES }, rate: RATE, jx: { ...JX }, jxPicked, pv: { ...PV }, pvPicked };
}
function projApply(s) {
  if (!s || s.kind !== 'urb-projet' || !s.params) throw new Error('bad');
  Object.assign(META, { commune: '', lieu: '', auteur: '' }, s.meta || {});
  try { localStorage.setItem('mv-meta', JSON.stringify(META)); } catch (e) { /* stockage indisponible */ }
  // paramètres : seules les clés connues, ramenées dans leurs bornes
  const next = { ...DEFAULTS };
  for (const g of FIELDS) for (const f of g.items) { const v = +s.params[f.k]; if (Number.isFinite(v)) next[f.k] = f.min !== undefined ? Math.min(f.max, Math.max(f.min, v)) : v; }
  P = derive(next); calibModified = fingerprint(P) !== FP_REF;
  if (s.profile && okSegs(s.profile.segs)) {
    PROF = { total: +s.profile.total || 12, segs: readSegs(s.profile.segs) };
    PROJ = okSegs(s.profile.proj) ? readSegs(s.profile.proj) : null;
    for (const k of Object.keys(CROSS)) delete CROSS[k];
    if (s.profile.cross) for (const k of Object.keys(s.profile.cross)) if (okSegs(s.profile.cross[k])) CROSS[k] = readSegs(s.profile.cross[k]);
    saveProf();
  }
  if (s.day) { DAY.mode = s.day.mode === 'counts' ? 'counts' : 'profile'; if (Array.isArray(s.day.counts)) DAY.counts = s.day.counts.slice(0, 24).concat(Array(24).fill('')).slice(0, 24); saveDay(); }
  if (s.prices) for (const k of Object.keys(PRICES)) if (Number.isFinite(+s.prices[k])) PRICES[k] = +s.prices[k];
  if (Number.isFinite(+s.rate) && +s.rate > 0) RATE = +s.rate;
  pickedVariant = scenariosIds().includes(s.variant) ? s.variant : null;
  if (s.jx) { for (const k of Object.keys(JX_DEF)) if (k in s.jx && typeof s.jx[k] === typeof JX_DEF[k]) JX[k] = s.jx[k]; saveJx(); }
  jxPicked = JX_TYPES.includes(s.jxPicked) ? s.jxPicked : null;
  if (s.pv) { for (const k of Object.keys(PV_DEF)) if (k in s.pv && typeof s.pv[k] === typeof PV_DEF[k]) PV[k] = s.pv[k]; savePv(); }
  pvPicked = typeof s.pvPicked === 'string' ? s.pvPicked : null;
  if (s.site && Number.isFinite(s.site.lat) && Number.isFinite(s.site.lon)) {
    if (MAP) { MAP.setView([s.site.lat, s.site.lon], 17); setPoint(s.site.lat, s.site.lon); } else Object.assign(SITE, { lat: s.site.lat, lon: s.site.lon });
    Object.assign(SITE, { data: s.site.data || null, pop: s.site.pop || null, popState: s.site.popState || '' });
    if (MAP && SITE.data) drawSiteLayers();
  }
  restart(true);
  setLang(LANGS.includes(s.lang) ? s.lang : lang);
  setModule(s.module);
}
const scenariosIds = () => scenarios.map(sc => sc.id);
async function projSave() {
  const snap = projSnapshot(), txt = JSON.stringify(snap, null, 1);
  const slug = (META.commune || t('projFile')).normalize('NFKD').replace(/[^\w؀-ۿ-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'projet';
  const fname = `urb-${slug}-${snap.savedAt.slice(0, 16).replace(/[-:T]/g, '')}.json`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  const msg = $('#proj-msg'); msg.textContent = t('projSaved', fname);
  // copie archivée par l'administrateur (fonction serveur api/projets), seulement en ligne
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch('api/projets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: txt });
    const j = await r.json().catch(() => ({}));
    msg.textContent = t('projSaved', fname) + ' ' + (r.ok && j.stored ? t('projArchived') : t('projArchFail'));
  } catch (e) { msg.textContent = t('projSaved', fname) + ' ' + t('projArchFail'); }
}
function buildProjBar() {
  $('#proj-bar').innerHTML = `<button class="btn" type="button" id="proj-save">${esc(t('projSave'))}</button><button class="btn" type="button" id="proj-open">${esc(t('projOpen'))}</button><input type="file" id="proj-file" accept=".json,application/json" hidden>`;
  $('#proj-notice').textContent = t('projNotice');
}
$('#proj-bar').addEventListener('click', e => {
  if (e.target.id === 'proj-save') projSave();
  else if (e.target.id === 'proj-open') $('#proj-file').click();
});
$('#proj-bar').addEventListener('change', e => {
  if (e.target.id !== 'proj-file' || !e.target.files[0]) return;
  const file = e.target.files[0], rd = new FileReader();
  rd.onload = () => {
    try { projApply(JSON.parse(rd.result)); $('#proj-msg').textContent = t('projOpened', file.name); }
    catch (err) { $('#proj-msg').textContent = t('projBad'); }
    e.target.value = '';
  };
  rd.readAsText(file);
});

/* filet de sécurité de l'anglais : une clé ou une fiche non traduite reprend le français au lieu de provoquer une erreur */
function fillMissing(dst, src) {
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  for (const k of Object.keys(src)) { if (!(k in dst)) dst[k] = src[k]; else if (obj(src[k]) && obj(dst[k])) fillMissing(dst[k], src[k]); }
}
fillMissing(I18N.en, I18N.fr); fillMissing(NOTE.en, NOTE.fr); fillMissing(JXT.ar, JXT.fr); fillMissing(JXT.en, JXT.fr); fillMissing(PVT.ar, PVT.fr); fillMissing(PVT.en, PVT.fr);
for (const p of PRICE_DEF) { if (!p.en) p.en = p.fr; if (p.u[2] === undefined) p.u[2] = p.u[0]; }
for (const k of Object.keys(COND)) if (!COND[k].en) COND[k].en = COND[k].fr;
for (const k of Object.keys(VDOC)) if (!VDOC[k].en) VDOC[k].en = VDOC[k].fr;

/* ---------- démarrage ---------- */
const hashTok = location.hash.slice(1).split('-');
let startLang = LANGS.find(l => hashTok.includes(l)) || 'fr';
if (!LANGS.some(l => hashTok.includes(l))) { try { const s = localStorage.getItem('mv-lang'); if (LANGS.includes(s)) startLang = s; } catch (e) { /* stockage indisponible */ } }
setNumLocale(startLang);
lang = startLang;
document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
readColors();
viewMode = stripsEl.clientWidth >= 900 ? 'full' : 'zoom';
document.querySelectorAll('[data-view]').forEach(o => o.setAttribute('aria-pressed', String(o.dataset.view === viewMode)));
build();
for (let i = 0; i < PRERUN / DT; i++) for (const s of sims) s.step();   // dix minutes déjà simulées à l'ouverture
setLang(lang);
setView(viewMode);
if (hashTok.includes('presentation')) setCompact(true);
if (hashTok.includes('carrefour')) setModule('jx');
else if (hashTok.includes('chaussee')) setModule('pv');
updateKpis(); clock();
startEvaluation();
requestAnimationFrame(frame);
// les vignettes 3D attendent three.js (chargé en différé)
// carte (Leaflet) et vignettes 3D (three.js) : bibliothèques chargées en différé
const onLibs = () => {
  try { initMap(); } catch (e) { $('#map').hidden = true; $('#map-msg').textContent = t('mapOffline'); }
  renderThumbs();
};
if (document.readyState === 'complete') onLibs(); else window.addEventListener('load', onLibs);

// accès console pour vérification
window.__mv = { pvNote: id => buildPvNote(id), jxNote: id => buildJxNote(id), proj: { snap: () => projSnapshot(), apply: s => projApply(s) }, jx: () => JXR, prof: { get: () => PROF, proj: () => PROJ, cross: () => CROSS, PRESETS, presetProfile, crossProfile, crossOf, profChecks, crossStages, profileSVG }, stats: () => sims.map(s => ({ id: s.sc.id, ...stats(s) })), sims: () => sims, evalRes: () => evalRes, rec: () => evalRes && recommend(evalRes, scenarios), P: () => P,
  note: id => buildNote(id), setLang: l => setLang(l),
  site: (la, lo) => { if (MAP) MAP.setView([la, lo], 17); setPoint(la, lo); return analyseSite(); }, siteData: () => SITE, day: () => DAY };
})();
