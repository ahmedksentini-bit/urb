<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparateur de modération des vitesses</title>
<style>
/* Mise en page : planche technique. Bandeau de commandes collant, une bande en plan par aménagement
   (vignette 3D devant), empilées sur la même échelle ; verdict, synthèse, hypothèses, méthode. */
:root {
  --bg: #eceff0;
  --surface: #f7f9f9;
  --ink: #17212b;
  --muted: #5b6770;
  --line: #ccd4d8;
  --accent: #1b5ea8;
  --accent-ink: #ffffff;
  --ok: #23774a;
  --warn: #9a6512;
  --bad: #b0303c;
  --zone: rgba(27, 94, 168, .10);
  /* plan */
  --verge: #d3dcd4;
  --walk: #c3c9cc;
  --curb: #8f989e;
  --asphalt: #3b4148;
  --mark: #f3f5f6;
  --bump: #5d656e;
  --bump-ramp: #4c535b;
  --raised: #8a5443;
  --raised-ramp: #6f4336;
  --pave: #6e6a66;
  --pave-joint: #8b8681;
  --island: #9db28d;
  --ped: #ffd23f;
  --ped-ring: #1d1f22;
  --brake: #ff4040;
  --shadow: rgba(0, 0, 0, .30);
  --glass: #1c2834;
  --roof: rgba(255, 255, 255, .18);
  --roof-unit: #d5d9dd;
  --headlight: #fff7d9;
  --tail: #7d1d23;
  --rib: rgba(0, 0, 0, .16);
  --shade: rgba(0, 0, 0, .18);
  --box: #e2e5e8;
  --sp1: #23b5a5; --sp2: #74c45a; --sp3: #f1c232; --sp4: #f08a2c; --sp5: #e5414b;
  --font-display: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --leftcol: clamp(290px, 22vw, 390px);
  --rowh: 90px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418; --surface: #171c21; --ink: #e4e9ec; --muted: #98a4ad; --line: #2b333a;
    --accent: #72aaea; --accent-ink: #0c1622; --ok: #5cc08a; --warn: #e3ab4c; --bad: #f07a83;
    --zone: rgba(114, 170, 234, .13);
    --verge: #1a231f; --walk: #3d444a; --curb: #59626a; --asphalt: #2a2f35; --mark: #d9dee2;
    --bump: #4c535a; --bump-ramp: #3e444b; --raised: #74463a; --raised-ramp: #5d372d;
    --pave: #57534f; --pave-joint: #6d6863; --island: #4c5e43; --ped-ring: #0d0f11; --brake: #ff5050;
    --shadow: rgba(0, 0, 0, .42); --glass: #121a22; --roof: rgba(255, 255, 255, .14); --roof-unit: #a7aeb5;
    --headlight: #f4ecc8; --tail: #6d1a1f; --rib: rgba(0, 0, 0, .22); --shade: rgba(0, 0, 0, .22); --box: #c9cdd2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418; --surface: #171c21; --ink: #e4e9ec; --muted: #98a4ad; --line: #2b333a;
  --accent: #72aaea; --accent-ink: #0c1622; --ok: #5cc08a; --warn: #e3ab4c; --bad: #f07a83;
  --zone: rgba(114, 170, 234, .13);
  --verge: #1a231f; --walk: #3d444a; --curb: #59626a; --asphalt: #2a2f35; --mark: #d9dee2;
  --bump: #4c535a; --bump-ramp: #3e444b; --raised: #74463a; --raised-ramp: #5d372d;
  --pave: #57534f; --pave-joint: #6d6863; --island: #4c5e43; --ped-ring: #0d0f11; --brake: #ff5050;
  --shadow: rgba(0, 0, 0, .42); --glass: #121a22; --roof: rgba(255, 255, 255, .14); --roof-unit: #a7aeb5;
  --headlight: #f4ecc8; --tail: #6d1a1f; --rib: rgba(0, 0, 0, .22); --shade: rgba(0, 0, 0, .22); --box: #c9cdd2;
  color-scheme: dark;
}
/* arabe : polices système qui portent l'écriture arabe ; jamais d'espacement de lettres (il casse les liaisons) */
html[lang="ar"] {
  --font-display: "Segoe UI", Tahoma, "Noto Sans Arabic", "Geeza Pro", Arial, sans-serif;
  --font-body: "Segoe UI", Tahoma, "Noto Sans Arabic", "Geeza Pro", Arial, sans-serif;
}
html[lang="ar"] * { letter-spacing: 0 !important; text-transform: none !important; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 36px); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
.num { unicode-bidi: isolate; direction: ltr; }

header.top { padding-block: 30px 18px; }
.eyebrow { margin: 0 0 8px; font: 600 12px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0 0 10px; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.12; font-weight: 600; }
.lede { margin: 0; max-width: 72ch; color: var(--muted); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-block: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.group-label { font: 500 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-inline-end: 2px; }
.btn { font: 600 13px/1 var(--font-display); letter-spacing: .02em; padding: 8px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: progress; }
#btn-lang { font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-size: 14px; }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; margin-inline-start: -1px; }
.seg .btn:first-child { border-start-start-radius: 6px; border-end-start-radius: 6px; margin-inline-start: 0; }
.seg .btn:last-child { border-start-end-radius: 6px; border-end-end-radius: 6px; }
.clock { font: 600 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.clock small { display: block; font: 500 11px/1.3 var(--font-body); color: var(--muted); }
.legend { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.ramp-wrap { display: grid; gap: 2px; direction: ltr; }
.ramp { width: 150px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, var(--sp1) 0%, var(--sp1) 25%, var(--sp2) 37.5%, var(--sp3) 50%, var(--sp4) 62.5%, var(--sp5) 75%, var(--sp5) 100%); }
.ramp-ticks { display: flex; justify-content: space-between; width: 150px; font: 500 10px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ped-key { display: inline-flex; align-items: center; gap: 5px; }
.ped-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ped); border: 1px solid var(--ped-ring); }
.ped-dot.late { border: 2px solid var(--bad); }

main { padding-block: 6px 48px; }

.verdict { margin-block: 20px 8px; padding: 16px 18px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); }
.verdict .eyebrow { margin-bottom: 4px; }
.verdict h2 { margin: 0 0 6px; font-size: 24px; }
.verdict p { margin: 4px 0; max-width: 110ch; font-size: 14px; }
.verdict .v-rule, .verdict .v-excl { color: var(--muted); font-size: 13px; }
.verdict .v-warn { color: var(--bad); font-weight: 600; }

.strip { padding-block: 16px 14px; border-bottom: 1px solid var(--line); }
.strip.ref, .strip.best { margin-inline: calc(-1 * clamp(8px, 1.5vw, 18px)); padding-inline: clamp(8px, 1.5vw, 18px); border-radius: 6px; }
.strip.ref { background: linear-gradient(var(--zone), var(--zone)); }
.strip.best { box-shadow: inset 0 0 0 2px var(--accent); }
.strip-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 22px; margin-bottom: 10px; }
.thumb { flex: none; width: 176px; aspect-ratio: 16 / 9; padding: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--verge); cursor: zoom-in; align-self: center; max-width: 100%; }
.thumb:hover { border-color: var(--accent); }
.thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
body.no3d .thumb { display: none; }
.strip-title { flex: 1 1 320px; min-width: 0; }
.strip h3 { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 19px; line-height: 1.25; font-weight: 600; }
.desc { margin: 3px 0 0; font-size: 13px; color: var(--muted); max-width: 86ch; }
.pill { font: 600 10.5px/1 var(--font-display); letter-spacing: .07em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.pill.rec { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sh { display: none; }
.kpis { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 22px; margin: 0; }
.kpis dt { font: 500 10.5px/1.2 var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.kpis dd { margin: 2px 0 0; font: 600 19px/1.1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpis dd small { font-size: 12px; font-weight: 500; color: var(--muted); }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .bad-t { color: var(--bad); }
canvas.plan { display: block; width: 100%; border-radius: 4px; }
.qrow { direction: ltr; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; min-height: 18px; margin-bottom: 4px; font: 600 12px/18px var(--font-display); letter-spacing: .02em; color: var(--bad); font-variant-numeric: tabular-nums; }
.qrow span:last-child { margin-left: auto; text-align: right; }

section.block { padding-top: 34px; }
h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.note { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; max-width: 100ch; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 1000px; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: end; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: start; }
thead th { font: 600 11px/1.25 var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; }
thead th span { display: block; font-weight: 500; text-transform: none; letter-spacing: 0; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.ref td { background: var(--zone); }
tbody tr.best td { box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); font-weight: 600; }
td.name { font-family: var(--font-display); font-weight: 600; font-size: 14px; white-space: nowrap; }

form#params { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
fieldset { margin: 0; padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
fieldset.calib { grid-column: 1 / -1; }
fieldset.calib .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); column-gap: 28px; }
legend { padding: 0 6px; font: 600 13px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.field { display: grid; grid-template-columns: 1fr 86px 56px; align-items: center; gap: 8px; padding-block: 3px; font-size: 13.5px; }
.field label { min-width: 0; }
.field input { width: 100%; font: 500 14px/1.2 var(--font-display); font-variant-numeric: tabular-nums; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); direction: ltr; text-align: right; }
.field input[readonly] { background: var(--surface); color: var(--muted); border-style: dashed; }
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field .unit { color: var(--muted); font-size: 12px; }
fieldset .src { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
fieldset .btn { margin-top: 8px; }
.form-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.form-actions .msg { font-size: 13px; color: var(--muted); }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 8px 36px; }
.cols > div { min-width: 0; }
.cols h3 { margin: 14px 0 4px; font-size: 16px; font-weight: 600; }
.cols p, .cols li { font-size: 14px; max-width: 72ch; }
.cols ul, .cols ol { padding-inline-start: 20px; margin: 4px 0; }
.formula { font-family: var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; unicode-bidi: isolate; direction: ltr; }

dialog#dlg3d { width: min(1200px, 94vw); padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
dialog#dlg3d::backdrop { background: rgba(10, 14, 18, .7); }
#dlg3d figure { margin: 0; }
#dlg3d img { display: block; width: 100%; height: auto; background: var(--verge); }
#dlg3d figcaption { padding: 10px 14px 0; font: 600 16px/1.3 var(--font-display); }
#dlg3d .dlg-note { margin: 4px 14px 0; font-size: 12.5px; color: var(--muted); }
#dlg3d .dlg-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px 14px; }

@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  .legend { margin-inline-start: 0; }
  .field { grid-template-columns: 1fr 78px 50px; }
  .thumb { width: 100%; }
}

/* Mode présentation : toutes les bandes tiennent dans la hauteur de l'écran.
   Colonnes : vignette 3D, nom et chiffres clés (sous un en-tête commun), vue en plan. */
body:not(.compact) .compact-only { display: none; }
body.compact .lg { display: none; }
body.compact .sh { display: inline; }
.bar-title { font: 600 17px/1.15 var(--font-display); }
.bar-title small { display: block; font: 500 11.5px/1.3 var(--font-body); color: var(--muted); }
body.compact #compact-head { display: grid; }
#compact-head { grid-template-columns: calc(var(--rowh) * 1.7778) var(--leftcol) minmax(0, 1fr); column-gap: 12px; padding-block: 5px 3px; font: 500 10px/1.2 var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
body.no3d #compact-head { grid-template-columns: 0 var(--leftcol) minmax(0, 1fr); }
#compact-head .ch-kpis { grid-column: 2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 8px; align-items: end; }
#compact-head #ch-view { grid-column: 3; }
body.compact header.top, body.compact #synthese, body.compact #hypotheses, body.compact #methode, body.compact .desc,
body.compact .ped-key:first-of-type, body.compact #verdict { display: none; }
body.compact .bar { position: static; }
body.compact .bar .wrap { padding-block: 6px; gap: 6px 14px; }
body.compact main { padding-block: 0; }
body.compact .strip { display: grid; grid-template-columns: calc(var(--rowh) * 1.7778) var(--leftcol) minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: 12px; padding-block: 3px; overflow: hidden; }
body.compact.no3d .strip { grid-template-columns: 0 var(--leftcol) minmax(0, 1fr); }
body.compact .strip.ref, body.compact .strip.best { border-radius: 0; }
body.compact .strip-head { display: contents; }
body.compact .thumb { grid-column: 1; grid-row: 1 / 4; width: 100%; height: var(--rowh); align-self: center; }
body.compact .strip-title { grid-column: 2; grid-row: 1; min-width: 0; }
body.compact .strip h3 { font-size: 15px; flex-wrap: nowrap; gap: 6px; white-space: nowrap; overflow: hidden; }
body.compact .kpis { grid-column: 2; grid-row: 2; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 8px; margin-top: 2px; width: 100%; }
body.compact .kpis > div:nth-child(3), body.compact .kpis dt { display: none; }
body.compact .kpis dd { margin: 0; font-size: 15px; }
body.compact .qrow { grid-column: 2; grid-row: 3; min-height: 0; margin: 2px 0 0; font-size: 11px; line-height: 14px; }
body.compact canvas.plan { grid-column: 3; grid-row: 1 / 4; align-self: center; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
<!-- three.js, pour les vues 3D de synthèse seulement. Sans connexion, la page fonctionne sans les vignettes. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="h1"></h1>
    <p class="lede" id="lede"></p>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="bar-title compact-only"><span data-i18n="h1"></span><small id="bar-sub"></small></div>
    <div class="group">
      <button class="btn" id="btn-lang" type="button" data-free="1"></button>
      <button class="btn" id="btn-compact" type="button" aria-pressed="false" data-free="1"></button>
      <button class="btn compact-only" id="btn-fs" type="button" data-free="1"></button>
    </div>
    <div class="group">
      <button class="btn primary" id="btn-play" type="button" aria-pressed="true"></button>
      <div class="seg" role="group" data-i18n-aria="speedAria">
        <button class="btn" type="button" data-speed="1" aria-pressed="true">×1</button>
        <button class="btn" type="button" data-speed="4" aria-pressed="false">×4</button>
        <button class="btn" type="button" data-speed="15" aria-pressed="false">×15</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label" data-i18n="view"></span>
      <div class="seg" role="group" data-i18n-aria="viewAria">
        <button class="btn" type="button" data-view="full" aria-pressed="false" data-i18n="viewFull"></button>
        <button class="btn" type="button" data-view="zoom" aria-pressed="false" data-i18n="viewZoom"></button>
      </div>
    </div>
    <div class="group">
      <span class="group-label" data-i18n="colors"></span>
      <div class="seg" role="group" data-i18n-aria="colorAria">
        <button class="btn" type="button" data-color="speed" aria-pressed="true" data-i18n="colSpeed"></button>
        <button class="btn" type="button" data-color="paint" aria-pressed="false" data-i18n="colPaint"></button>
      </div>
    </div>
    <div class="group">
      <button class="btn" id="btn-hour" type="button"></button>
      <button class="btn" id="btn-reset" type="button" data-i18n="reset"></button>
    </div>
    <div class="clock" id="clock" aria-live="off"></div>
    <span class="pill bad" id="calib-flag" hidden></span>
    <div class="legend">
      <div class="ramp-wrap" id="legend-speed" data-i18n-aria="rampAria">
        <div class="ramp"></div>
        <div class="ramp-ticks"><span>0</span><span>20</span><span>40</span><span data-i18n="ramp60"></span></div>
      </div>
      <span class="ped-key"><span class="ped-dot"></span><span data-i18n="pedKey"></span></span>
      <span class="ped-key"><span class="ped-dot late"></span><span data-i18n="pedLate"></span></span>
    </div>
  </div>
</div>

<div class="wrap compact-only" id="compact-head" aria-hidden="true">
  <div class="ch-kpis"><span data-i18n="kV85"></span><span data-i18n="kTT"></span><span data-i18n="kPed"></span><span data-i18n="kRisk"></span></div>
  <div id="ch-view"></div>
</div>

<main class="wrap">
  <section class="verdict" id="verdict" aria-live="polite"></section>
  <section id="strips"></section>

  <section class="block" id="synthese">
    <h2 data-i18n="sumTitle"></h2>
    <p class="note" id="summary-note"></p>
    <div class="table-wrap">
      <table id="summary"><thead></thead><tbody></tbody></table>
    </div>
  </section>

  <section class="block" id="hypotheses">
    <h2 data-i18n="hypTitle"></h2>
    <p class="note" data-i18n="hypNote"></p>
    <form id="params" novalidate></form>
  </section>

  <section class="block" id="methode">
    <h2 data-i18n="methTitle"></h2>
    <div class="cols" id="method-body"></div>
  </section>
</main>

<dialog id="dlg3d">
  <figure>
    <img id="dlg-img" alt="">
    <figcaption id="dlg-cap"></figcaption>
  </figure>
  <p class="dlg-note" id="dlg-note"></p>
  <div class="dlg-actions">
    <a class="btn primary" id="dlg-dl" href="#" hidden></a>
    <span class="dlg-note" id="dlg-status"></span>
    <button class="btn" id="dlg-close" type="button"></button>

        <li><strong>Mêmes arrivées partout.</strong> Les véhicules (instant, type, tempérament du conducteur) et les piétons sont tirés une seule fois, puis injectés à l’identique dans toutes les bandes. Les écarts entre bandes viennent donc de l’aménagement seul.</li>
        <li><strong>Piétons.</strong> Un piéton traverse quand le créneau suffit (temps de traversée + marge) ou quand un conducteur lui cède le passage. Chaque conducteur qui voit un piéton attendre décide une fois, tant qu’il peut encore s’arrêter à 3 m/s² ; sa probabilité de céder dépend de la vitesse qu’il aurait au passage. S’il voit le piéton trop tard, il ne cède pas. Un conducteur arrêté pour rien repart au bout de 8 s. Sans îlot, un piéton engagé sur la première voie impose l’arrêt sur la seconde si le véhicule peut s’arrêter à 3 m/s². Avec un îlot d’au moins 1,50 m, la traversée se fait en deux temps.</li>

/* ---------- demande commune ---------- */
class Demand {
  constructor(P) {
    this.P = P; this.nextId = 1;
    this.lanes = [0, 1].map(k => ({ r: mulberry32(P.seed * 1009 + 11 + k * 7919), list: [], tNext: 0 }));
    for (const ln of this.lanes) ln.tNext = this.headway(ln.r) * ln.r();
    this.ped = { r: mulberry32(P.seed * 1009 + 5003), list: [], tNext: 0 };
    this.ped.tNext = this.pedGap();
  }
  headway(r) { const m = 3600 / Math.max(1, this.P.q), hmin = Math.min(1, m); return hmin + (m - hmin) * -Math.log(1 - r()); }
  pedGap() { return this.P.qPed > 0 ? -Math.log(1 - this.ped.r()) * 3600 / this.P.qPed : Infinity; }
  veh(k, t) {
    const ln = this.lanes[k];
    while (ln.tNext <= t + 1) {
      const r = ln.r;
      ln.list.push({ id: this.nextId++, t: ln.tNext, pl: r() < this.P.pPL / 100, z: clampZ(gauss(r)) });
      ln.tNext += this.headway(r);
    }
    return ln.list;
  }
  peds(t) {
    const p = this.ped;
    while (p.tNext <= t + 1) { p.list.push({ t: p.tNext, side: p.r() < 0.5 ? 0 : 1, xo: (p.r() - 0.5) * 2.6 }); p.tNext += this.pedGap(); }
    return p.list;
  }
}

/* ---------- scénarios (géométrie indépendante de la langue) ---------- */
function chicaneSpeed(P, wVeh) {
  const slack = Math.max(0, P.chLane - wVeh - 0.6);
  const eEff = Math.max(0.3, P.chOff - slack);
  const R = P.chTrans * P.chTrans / (4 * eEff);
  return { R, v: 8.76 * Math.pow(R, 0.3861) };
}
function buildScenarios(P) {
  const capZ = (xa, xb, vl, pl) => ({ xa, xb, kind: 'cap', VL: vl / KMH, PL: pl / KMH });
  const facZ = (xa, xb, p, lane) => ({ xa, xb, kind: 'fac', f: 1 - p / 100, lane });
  const W = P.laneW, flat = () => ({ yc: 0, lw: W, wi: 0 });
  const cVL = chicaneSpeed(P, CLS.VL.w), cPL = chicaneSpeed(P, CLS.PL.w), Lt = P.chTrans;
  const reg = 2 * P.q * 10 > 3000;   // heure de pointe ≈ 10 % du trafic journalier
  return [
    { id: 'ref', zones: [], geom: flat, feats: [], info: {} },
    { id: 'dos', reg, zones: [capZ(XC - 12, XC - 8, P.dosVL, P.dosPL), capZ(XC + 8, XC + 12, P.dosVL, P.dosPL)], geom: flat,
      feats: [{ t: 'hump', xa: XC - 12, xb: XC - 8 }, { t: 'hump', xa: XC + 8, xb: XC + 12 }], info: {} },
    { id: 'trap', reg, zones: [capZ(XC - 3.2, XC + 3.2, P.trapVL, P.trapPL)], geom: flat,
      feats: [{ t: 'table', xa: XC - 3.2, xb: XC + 3.2, ramp: 1.2, raised: false }], info: {} },
    { id: 'plat', zones: [capZ(XC - 5.5, XC + 5.5, P.platVL, P.platPL)], geom: flat,
      feats: [{ t: 'table', xa: XC - 5.5, xb: XC + 5.5, ramp: 1.5, raised: true }], info: {} },
    { id: 'cous', zones: [capZ(XC - 11.5, XC - 8.5, P.cousVL, P.cousPL), capZ(XC + 8.5, XC + 11.5, P.cousVL, P.cousPL)], geom: flat,
      feats: [{ t: 'cushion', xa: XC - 11.5, xb: XC - 8.5 }, { t: 'cushion', xa: XC + 8.5, xb: XC + 11.5 }], info: {} },
    { id: 'ret', zones: [facZ(XC - 15, XC + 15, P.retPct)],
      geom: x => { const r = bell(x, XC - 15, XC - 7, XC + 7, XC + 15); return { yc: 0, lw: W + (P.retLane - W) * r, wi: P.retIsl * r }; },
      feats: [{ t: 'island' }], info: { island: P.retIsl >= ISLAND_MIN } },
    { id: 'chi', zones: [capZ(XC - 5 - Lt, XC + 5 + Lt, cVL.v, cPL.v)],
      geom: x => { const r = bell(x, XC - 5 - Lt, XC - 5, XC + 5, XC + 5 + Lt); return { yc: -P.chOff / 2 + P.chOff * r, lw: W + (P.chLane - W) * r, wi: 0 }; },
      feats: [], info: { R: cVL.R, vVL: cVL.v, vPL: cPL.v } },
    { id: 'rev', zones: [facZ(XC - 20, XC + 20, P.revPct)], geom: flat, feats: [{ t: 'pave', xa: XC - 20, xb: XC + 20 }], info: {} },
    // bandes rugueuses : seulement sur la voie qui s'approche du passage
    { id: 'rug', zones: [facZ(XC - 62, XC - 2, P.rugPct, 0), facZ(XC + 2, XC + 62, P.rugPct, 1)], geom: flat,
      feats: [XC - 62, XC - 42, XC - 22].map(x0 => ({ t: 'rumble', lane: 0, x0 })).concat([XC + 18, XC + 38, XC + 58].map(x0 => ({ t: 'rumble', lane: 1, x0 }))), info: {} }
  ];
}
const scName = sc => t('names')[sc.id];
const scShort = sc => t('short')[sc.id];
const scDesc = sc => t('desc')[sc.id](P, sc.info);

/* ---------- apparence des véhicules (tirée de l'identifiant : même allure dans toutes les bandes) ---------- */
const PAINTS = ['#e9eaec', '#c5c9ce', '#8b9198', '#2d3137', '#21457c', '#8f222b', '#3f5e3c', '#d8cfbb', '#b8661f', '#4f6f8f'];
const CAR_STYLES = {
  berline:  { w0: 0.35, w1: 0.95, r0: -1.05, r1: 0.35, b0: -1.5, b1: -1.05 },
  citadine: { w0: 0.5, w1: 1.1, r0: -1.45, r1: 0.5, b0: -1.85, b1: -1.45 },
  fourgon:  { w0: 1.05, w1: 1.5, r0: -2.1, r1: 1.05, b0: null, b1: null }

function vehicleLook(rec) {
  const h = hash32(rec.id), r = h % 100;
  const style = rec.pl ? (r < 45 ? 'bus' : 'camion') : (r < 50 ? 'berline' : r < 82 ? 'citadine' : 'fourgon');
  return { style, paint: (h >>> 8) % PAINTS.length };

/* ---------- microsimulation ---------- */
function aInt(v, gap, vl) {
  if (gap <= 0.05) return -9;
  const ss = v.s0 + Math.max(0, v.v * v.T + v.v * (v.v - vl) / (2 * Math.sqrt(v.a * v.b)));
  const r = ss / gap;
  return v.a * (1 - r * r);
}

class Sim {
  constructor(sc, D, P) {
    this.sc = sc; this.D = D; this.P = P; this.n = 0; this.t = 0;
    this.rng = mulberry32(P.seed * 7919 + 17);

      lanes: [{ y0: 0, y1: g.lw }, { y0: g.lw + g.wi, y1: 2 * g.lw + g.wi }] };

      const zones = sc.zones.map((z, i) => ({ z, i })).filter(o => o.z.lane === undefined || o.z.lane === k)
        .map(({ z, i }) => k === 0 ? { i, sa: z.xa, sb: z.xb, kind: z.kind } : { i, sa: L - z.xb, sb: L - z.xa, kind: z.kind })
        .sort((a, b) => a.sa - b.sa);

  makeVeh(rec) {

        const m = new THREE.Mesh(new THREE.BoxGeometry(w - 0.4, h, d), new THREE.MeshStandardMaterial({ color: new THREE.Color(col).convertSRGBToLinear(), map: tex, roughness: 0.95 }));

      scene.add(tree(x - XC, -(G(x).s - 1.8), 5.5 + (hash32(Math.round(x)) % 100) / 60));
      scene.add(tree(x + 6 - XC, -(G(x + 6).n + 1.8), 5.5 + (hash32(Math.round(x) + 7) % 100) / 60));
    }
    // véhicules et piétons (mêmes positions partout)
    // cap : avant du modèle vers +x ; sens ← = demi-tour, même pente latérale
    const onLane = (x, k) => { const g = G(x), y = laneY(g, k), y2 = laneY(G(x + 1), k); return { z: -y, head: Math.atan2(y2 - y, 1) + (k === 0 ? 0 : Math.PI), h: hR(x) }; };

    place(XC - 16, 0, PAINT3[3]); place(XC - 31, 0, PAINT3[0]); place(XC - 47, 0, PAINT3[4]);
    place(XC + 14, 1, PAINT3[1]); place(XC + 33, 1, 0xf2f2f2, 'bus'); place(XC + 52, 1, PAINT3[2]);
    const gp = G(XC);
    scene.add(person(-0.6, -(gp.s + gp.lw * 0.45), hR(XC), 0xf2b51d));
    scene.add(person(0.9, -(gp.n + 0.8), KERB, 0x2e6fb0));
    if (gp.wi >= ISLAND_MIN) scene.add(person(0.2, -gp.yc, 0.02, 0xb03a2e));

    sun.castShadow = true;
    const sc2 = sun.shadow.camera; sc2.left = -70; sc2.right = 70; sc2.top = 50; sc2.bottom = -50; sc2.near = 1; sc2.far = 220;
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;

    const camera = new THREE.PerspectiveCamera(38, 16 / 9, 0.5, 400);

  function addTri(scene, material, xBase, xTip, y, fh) {

    const p = [xBase - XC, fh(xBase), -(y - 0.3), xTip - XC, fh(xTip), -y, xBase - XC, fh(xBase), -(y + 0.3)];
    geo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); geo.computeVertexNormals();

  }
  function dispose(scene) {

    });
  }
  // rendu dans le canevas du moteur ; renvoie ce canevas (à copier aussitôt)
  function render(sc, w, h, shadowSize) {
    const r = renderer(); r.setSize(w, h, false);
    const { scene, camera, sun } = buildScene(sc);
    sun.shadow.mapSize.set(shadowSize, shadowSize);

/* ---------- état global ---------- */
let P = derive({ ...DEFAULTS }), scenarios = [], sims = [], views = [];
let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let speed = 1, busy = false, accT = 0, last = performance.now(), lastKpi = 0;
let calibUnlocked = false, calibModified = false;
let evalRes = null, evalJob = 0, evalProg = 0, evalP = null;
const thumbs = new Map();          // id → image (data URL), pour la géométrie courante
let thumbKey = '', thumbJob = 0;
const $ = s => document.querySelector(s);
const stripsEl = $('#strips');
let io = null;

function buildStrips() {
  stripsEl.textContent = '';
  if (io) io.disconnect();
  views = scenarios.map((sc, i) => {
    const art = document.createElement('article');
    art.className = 'strip' + (sc.id === 'ref' ? ' ref' : '');
    art.id = 'bande-' + sc.id;
    const lg = (a, b) => `<span class="lg">${a}</span><span class="sh">${b}</span>`;
    art.innerHTML = `
      <div class="strip-head">
        <button class="thumb" type="button" data-k="thumb" aria-label="${esc(t('thumbAria', scName(sc)))}"><img alt=""></button>
        <div class="strip-title">
          <h3>${lg(scName(sc), scShort(sc))}<span class="pill rec" data-k="rec" hidden>${lg(...t('rec'))}</span><span class="pill ok" data-k="state">${lg(...t('stFluid'))}</span>${sc.reg ? `<span class="pill warn" title="${esc(t('regTitle'))}">${lg(...t('reg'))}</span>` : ''}</h3>
          <p class="desc">${scDesc(sc)}</p>
        </div>
        <dl class="kpis">
          <div><dt>${t('kV85')}</dt><dd data-k="v85">–</dd></div>
          <div><dt>${t('kTT')}</dt><dd data-k="tt">–</dd></div>
          <div><dt>${t('kQ')}</dt><dd data-k="q">–</dd></div>
          <div><dt>${t('kPed')}</dt><dd data-k="ped">–</dd></div>
          <div><dt>${t('kRisk')}</dt><dd data-k="risk">–</dd></div>
        </dl>
      </div>

      <canvas class="plan" role="img" aria-label="${esc(t('planAria', scName(sc)))}"></canvas>`;
    const img = art.querySelector('.thumb img');
    if (thumbs.has(sc.id)) img.src = thumbs.get(sc.id);
    art.querySelector('.thumb').addEventListener('click', () => open3D(sc));
    stripsEl.appendChild(art);
    return new View(i, art);
  });
  io = new IntersectionObserver(es => { for (const e of es) { const vw = views.find(v => v.art === e.target); if (vw) vw.visible = e.isIntersecting; } });
  views.forEach(v => io.observe(v.art));
}

// noms courts, ligne de légende du mode présentation
function layoutAll() {

/* mode présentation : hauteur de chaque bande = (hauteur d'écran − barre − en-tête) / nombre de bandes */
let compactRowH = 100;

}
function setHash() {

function build() {
  scenarios = buildScenarios(P);
  const D = new Demand(P);
  sims = scenarios.map(sc => new Sim(sc, D, P));
  buildStrips();
  if (isCompact()) computeCompactRowH();

  $('#lede').textContent = t('lede', P);

/* ---------- évaluation : cinq simulations d'une heure, tirages fixés, en tâche de fond ---------- */
function startEvaluation() {
  const job = ++evalJob, Pe = P, scs = buildScenarios(Pe), acc = scs.map(() => []);
  evalRes = null; evalProg = 0; evalP = Pe;
  let rep = 0, cur = null;
  const tick = () => {
    if (job !== evalJob) return;
    const t0 = performance.now();
    while (performance.now() - t0 < 22) {
      if (!cur) { const Pr = { ...Pe, seed: Pe.seed + rep }; const D = new Demand(Pr); cur = scs.map(sc => new Sim(sc, D, Pr)); }
      for (let n = 0; n < 40; n++) for (const s of cur) s.step();
      if (cur[0].t >= EVAL_T - 1e-6) {
        cur.forEach((s, i) => acc[i].push(stats(s)));
        cur = null; rep++;
        if (rep >= REPS) { evalRes = aggregate(acc); evalProg = 1; if (!busy) updateKpis(); return; }
      }
    }
    evalProg = (rep + (cur ? cur[0].t / EVAL_T : 0)) / REPS;
    setTimeout(tick, 0);
  };
  setTimeout(tick, 0);
}

/* ---------- affichage des chiffres ---------- */
function setClass(el, cls) { el.classList.remove('ok-t', 'warn-t', 'bad-t'); if (cls) el.classList.add(cls); }
const lvl = (v, good, mid, lowerIsBetter = true) => !Number.isFinite(v) ? '' : lowerIsBetter ? (v <= good ? 'ok-t' : v <= mid ? 'warn-t' : 'bad-t') : (v >= good ? 'ok-t' : v >= mid ? 'warn-t' : 'bad-t');
let verdictHTML = '', lastTable = '';

function updateKpis() {
  const S = evalRes || sims.map(stats), ref = S[0], rec = evalRes ? recommend(evalRes, scenarios) : null;
  const u = k => t(k);
  S.forEach((s, i) => {
    const art = views[i].art, q = k => art.querySelector(`[data-k="${k}"]`);
    const e1 = q('v85'); e1.innerHTML = `${f0(s.v85)} <small>${u('kmh')}</small>`; setClass(e1, lvl(s.v85, 30, 40));
    q('tt').innerHTML = `${f0(s.tt)} ${u('s')}` + (i ? ` <small>${sgn(s.tt - ref.tt)}</small>` : '');
    q('q').innerHTML = `${f0(s.qMax)} <small>${u('m')}</small>`;
    const e4 = q('ped'); e4.innerHTML = `${f0(s.pedW)} <small>${u('s')}</small>`; setClass(e4, lvl(s.pedW, 10, 30));
    const e5 = q('risk'); e5.innerHTML = `${f1(s.surgRisk)} <small>%</small>`; setClass(e5, lvl(s.surgRisk, 0.5, 2));
    for (const k of [0, 1]) { const el = q('q' + k), txt = views[i].queueText(k); if (el.textContent !== txt) el.textContent = txt; }
    const state = s.sat ? ['bad', t('stSat')] : (s.qAvg >= 15 || s.qMax >= 100) ? ['warn', t('stFiles')] : ['ok', t('stFluid')];
    const pill = q('state'), html = `<span class="lg">${state[1][0]}</span><span class="sh">${state[1][1]}</span>`;
    if (pill.innerHTML !== html) { pill.className = 'pill ' + state[0]; pill.innerHTML = html; }
    const isBest = !!rec && rec.best === i;
    q('rec').hidden = !isBest; art.classList.toggle('best', isBest);
  });
  const rows = S.map((s, i) => {
    const c = (v, cls) => `<td class="${cls}">${v}</td>`;
    const cl = [i ? '' : 'ref', rec && rec.best === i ? 'best' : ''].join(' ');
    return `<tr class="${cl}"><td class="name">${scName(scenarios[i])}</td>`
      + c(f0(s.v85), lvl(s.v85, 30, 40))
      + c(f0(s.tt), '')
      + c(i ? sgn(s.tt - ref.tt) : '–', '')
      + c(f0(s.flow), lvl(s.flow, 0.97 * P.q, 0.9 * P.q, false))
      + c(f0(s.stopPct), lvl(s.stopPct, 20, 50))
      + c(f0(s.qMax), lvl(s.qMax, 50, 150))
      + c(f1(s.pedW), lvl(s.pedW, 10, 30))
      + c(f0(s.yieldPct), lvl(s.yieldPct, 70, 40, false))
      + c(f0(s.surgStop) + ' %', lvl(s.surgStop, 90, 60, false))
      + c(f1(s.surgRisk) + ' %', lvl(s.surgRisk, 0.5, 2)) + '</tr>';
  }).join('');
  if (rows !== lastTable) { lastTable = rows; $('#summary tbody').innerHTML = rows; }
  const fp = fingerprint(P), fpTxt = calibModified ? t('calibMod', fp) : t('calibRef', fp);
  $('#summary-note').textContent = evalRes ? t('sumNote', P, fpTxt) : t('sumRunning', Math.round(evalProg * 100));
  renderVerdict();
  const flag = $('#calib-flag'); flag.hidden = !calibModified; flag.textContent = t('calibFlag');
}

function renderVerdict() {
  let h = '';
  if (calibModified) h += `<p class="v-warn">${t('vCalib')}</p>`;
  if (!evalRes) h += `<p class="eyebrow">${t('vEyebrow')}</p><p>${t('vRunning', Math.round(evalProg * 100))}</p>`;
  else {
    const r = recommend(evalRes, scenarios), ref = evalRes[0];
    if (r.best < 0) h += `<p class="eyebrow">${t('vEyebrow')}</p><h2>${t('vNoneTitle')}</h2><p>${t('vNone')}</p>`;
    else {
      const e = evalRes[r.best];
      h += `<p class="eyebrow">${t('vEyebrow')}</p><h2>${scName(scenarios[r.best])}</h2><p>${t('vMetrics', e, ref)}</p>`;
      h += `<p class="${e.v85 <= 30 ? 'ok-t' : 'warn-t'}">${e.v85 <= 30 ? t('vSafeOk') : t('vSafeKo', e.v85)}</p>`;
      if (ref.surgRisk - e.surgRisk < 0.1) h += `<p class="warn-t">${t('vSmallGain')}</p>`;
    }
    if (r.excluded.length) {
      const why = x => x.why.map(w => w === 'sat' ? t('reasonSat', evalRes[x.i], evalP) : t('reasonReg')).join(t('sep'));
      h += `<p class="v-excl"><strong>${t('vExcluded')}</strong> ${r.excluded.map(x => `${scName(scenarios[x.i])} (${why(x)})`).join(' · ')}</p>`;
    }
    h += `<p class="v-rule">${t('vCriteria')}</p>`;
  }
  if (h !== verdictHTML) { verdictHTML = h; $('#verdict').innerHTML = h; }
}

function clock() {
  const tt = sims.length ? sims[0].t : 0, h = Math.floor(tt / 3600), m = Math.floor(tt % 3600 / 60), s = String(Math.floor(tt % 60)).padStart(2, '0');
  $('#clock').innerHTML = `${t('clock', h, m, s)}<small>${t('simTime')}</small>`;
}

function advance(seconds, btn) {
  busy = true;
  const target = sims[0].t + seconds, start = sims[0].t;
  document.querySelectorAll('.bar button, #params button').forEach(b => { b.disabled = b !== $('#btn-play') && !b.dataset.speed && !b.dataset.view && !b.dataset.color && !b.dataset.free; });
  const chunk = () => {
    const t0 = performance.now();
    while (performance.now() - t0 < 35 && sims[0].t < target - 1e-6) for (const s of sims) s.step();
    if (btn) btn.textContent = t('computing', Math.round(100 * (sims[0].t - start) / seconds));
    if (sims[0].t < target - 1e-6) setTimeout(chunk, 0);
    else {
      busy = false;
      if (btn) btn.textContent = t('hour');
      document.querySelectorAll('.bar button, #params button').forEach(b => { b.disabled = false; });
      updateKpis();
    }
  };
  chunk();
}

function frame(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !busy) {
    accT += dtReal * speed;
    let n = 0;
    while (accT >= DT && n < 400) { for (const s of sims) s.step(); accT -= DT; n++; }
    if (n >= 400) accT = 0;
  }
  for (const v of views) if (v.visible) v.draw();
  if (now - lastKpi > 400) { lastKpi = now; clock(); if (!busy) updateKpis(); }
  requestAnimationFrame(frame);
}

/* ---------- formulaire : site et conception modifiables, calibrage verrouillé ---------- */
function buildForm() {
  const form = $('#params'), G = t('groups'), ui = lang === 'ar' ? 1 : 0;
  form.innerHTML = FIELDS.map(grp => {
    const locked = grp.lock && !calibUnlocked;
    const fields = grp.items.map(f => `<div class="field"><label for="p-${f.k}">${f[lang]}</label><input id="p-${f.k}" name="${f.k}" type="number" step="${f.step}"${f.min !== undefined ? ` min="${f.min}" max="${f.max}"` : ''} inputmode="decimal" value="${P[f.k]}"${locked ? ' readonly' : ''}><span class="unit">${f.u[ui]}</span></div>`).join('');
    return `<fieldset class="${grp.lock ? 'calib' : ''}"><legend>${G[grp.g][0]}</legend><div class="fields">${fields}</div><p class="src">${G[grp.g][1]}</p>${grp.lock ? `<button class="btn" type="button" id="btn-unlock">${calibUnlocked ? t('lock') : t('unlock')}</button>` : ''}</fieldset>`;
  }).join('') + `<div class="form-actions"><button class="btn primary" type="submit">${t('apply')}</button><button class="btn" type="button" id="btn-defaults">${t('defaults')}</button><span class="msg" id="form-msg"></span></div>`;
}
$('#params').addEventListener('click', e => {
  const id = e.target && e.target.id;
  if (id === 'btn-unlock') {
    calibUnlocked = !calibUnlocked;
    document.querySelectorAll('fieldset.calib input').forEach(i => { i.readOnly = !calibUnlocked; });
    e.target.textContent = calibUnlocked ? t('lock') : t('unlock');
    $('#form-msg').textContent = calibUnlocked ? t('msgUnlocked') : t('msgLocked');
  } else if (id === 'btn-defaults') {
    for (const grp of FIELDS) for (const f of grp.items) if (!grp.lock || calibUnlocked) $('#p-' + f.k).value = DEFAULTS[f.k];
    $('#form-msg').textContent = t('msgDefaults');
  }
});
$('#params').addEventListener('submit', e => {
  e.preventDefault();
  const next = { ...P }, bad = [];
  for (const grp of FIELDS) for (const f of grp.items) {
    if (grp.lock && !calibUnlocked) continue;
    const val = parseFloat(String($('#p-' + f.k).value).replace(',', '.'));
    if (!Number.isFinite(val) || val < 0) { bad.push(f[lang]); continue; }
    if (f.min !== undefined && (val < f.min || val > f.max)) { bad.push(t('msgRange', f[lang], nfa.format(f.min), nfa.format(f.max))); continue; }
    next[f.k] = val;
  }
  if (next.retLane >= next.laneW) bad.push(t('msgLane'));
  if (next.vPed < 0.3) bad.push(FIELDS[2].items[3][lang]);
  if (bad.length) { $('#form-msg').textContent = t('msgFix', bad.join(t('sep'))); return; }
  P = derive(next);
  calibModified = fingerprint(P) !== FP_REF;
  $('#form-msg').textContent = t('msgApplied');
  restart(true);
});

function restart(paramsChanged) {
  build();
  advance(PRERUN, null);
  if (paramsChanged) { startEvaluation(); renderThumbs(); }
}

/* ---------- vignettes 3D et agrandissement ---------- */
function geomKey() { return ['laneW', 'retLane', 'retIsl', 'chOff', 'chTrans', 'chLane'].map(k => P[k]).join('|'); }
function renderThumbs() {
  if (!V3D.ok()) { document.body.classList.add('no3d'); return; }
  document.body.classList.remove('no3d');
  const key = geomKey();
  if (key === thumbKey && thumbs.size === scenarios.length) return;
  thumbKey = key; thumbs.clear();
  const job = ++thumbJob, list = scenarios.slice();
  let i = 0;
  const next = () => {
    if (job !== thumbJob || i >= list.length) return;
    const sc = list[i++];
    try {
      const url = V3D.render(sc, 768, 432, 2048).toDataURL('image/jpeg', 0.9);
      thumbs.set(sc.id, url);
      const img = document.querySelector(`#bande-${sc.id} .thumb img`); if (img) img.src = url;
    } catch (err) { document.body.classList.add('no3d'); return; }
    setTimeout(next, 30);
  };
  setTimeout(next, 30);
}

  $('#btn-compact').textContent = isCompact() ? t('fullPage') : t('presentation');
  $('#btn-fs').textContent = t('fullscreen');
  $('#btn-hour').textContent = t('hour');
  setPlaying(playing);
  $('#summary thead').innerHTML = '<tr>' + t('thead').map(([a, b]) => `<th>${a}${b ? `<span>${b}</span>` : ''}</th>`).join('') + '</tr>';
  $('#method-body').innerHTML = t('method', t('vCriteria'));
  $('#bar-sub').textContent = t('barSub', P);
  $('#lede').textContent = t('lede', P);
  try { localStorage.setItem('mv-lang', lang); } catch (e) { /* stockage indisponible */ }
  setHash();
  readColors();
  if (sims.length) {
    buildStrips();
    if (isCompact()) computeCompactRowH();
    layoutAll();
    verdictHTML = ''; lastTable = '';
    updateKpis(); clock();
  }
  buildForm();
}

/* ---------- commandes ---------- */
function setPlaying(on) {
  playing = on; const b = $('#btn-play');
  b.textContent = on ? t('pause') : t('play'); b.setAttribute('aria-pressed', String(on));
}
$('#btn-play').addEventListener('click', () => setPlaying(!playing));
$('#btn-lang').addEventListener('click', () => setLang(lang === 'ar' ? 'fr' : 'ar'));
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
  speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  if (!playing) setPlaying(true);
}));
function setView(mode) {
  viewMode = mode;
  document.querySelectorAll('[data-view]').forEach(o => o.setAttribute('aria-pressed', String(o.dataset.view === mode)));
  layoutAll();
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => {
  colorMode = b.dataset.color;
  document.querySelectorAll('[data-color]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  $('#legend-speed').hidden = colorMode !== 'speed';
}));
$('#btn-compact').addEventListener('click', () => setCompact(!isCompact()));
$('#btn-fs').addEventListener('click', () => {
  const d = document;
  if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen().catch(() => {}); }
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
});
$('#btn-hour').addEventListener('click', e => advance(3600, e.currentTarget));
$('#btn-reset').addEventListener('click', () => restart(false));

let rz = 0;
const relayout = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (isCompact()) computeCompactRowH(); layoutAll(); }); };
new ResizeObserver(relayout).observe(stripsEl);
window.addEventListener('resize', relayout);
const relayoutTheme = () => { readColors(); layoutAll(); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', relayoutTheme);
new MutationObserver(relayoutTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- démarrage ---------- */
const hashTok = location.hash.slice(1).split('-');
let startLang = hashTok.includes('ar') ? 'ar' : 'fr';
if (!hashTok.includes('ar')) { try { if (localStorage.getItem('mv-lang') === 'ar') startLang = 'ar'; } catch (e) { /* stockage indisponible */ } }
lang = startLang;
document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
readColors();
viewMode = stripsEl.clientWidth >= 900 ? 'full' : 'zoom';
document.querySelectorAll('[data-view]').forEach(o => o.setAttribute('aria-pressed', String(o.dataset.view === viewMode)));
build();
for (let i = 0; i < PRERUN / DT; i++) for (const s of sims) s.step();   // dix minutes déjà simulées à l'ouverture
setLang(lang);
setView(viewMode);
if (hashTok.includes('presentation')) setCompact(true);
updateKpis(); clock();
startEvaluation();
requestAnimationFrame(frame);
// les vignettes 3D attendent three.js (chargé en différé)
if (document.readyState === 'complete') renderThumbs(); else window.addEventListener('load', renderThumbs);

// accès console pour vérification
window.__mv = { stats: () => sims.map(s => ({ id: s.sc.id, ...stats(s) })), sims: () => sims, evalRes: () => evalRes, rec: () => evalRes && recommend(evalRes, scenarios), P: () => P };
})();
</script>
</body>
</html>
