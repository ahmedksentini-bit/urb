} catch (e) { /* stockage indisponible */ }
const saveProf = () => { try { localStorage.setItem('mv-prof', JSON.stringify({ total: PROF.total, segs: PROF.segs, proj: PROJ, cross: CROSS })); } catch (e) { /* stockage indisponible */ } };
const profSum = segs => segs.reduce((a, s) => a + s.w, 0);
const projProfile = () => ({ total: PROF.total, segs: PROJ || PROF.segs });

// contrôles du profil : [niveau, message, rang de l'élément concerné s'il y en a un] ; le rang sert à faire clignoter l'élément
function profChecks(pf, atCrossing = false) {
  const out = [], d = pf.total - profSum(pf.segs);
  out.push(Math.abs(d) <= 0.005 ? ['ok', t('pfExact')] : d > 0 ? ['warn', t('pfRest', d)] : ['bad', t('pfOver', -d)]);
  pf.segs.forEach((s, i) => {
    const add = (l, k) => out.push([l, t(k, s.w), i]);
    if (s.t === 'walk') { if (s.w < 1.4) add('bad', 'ckWalkBad'); else if (s.w < 2.0) add('warn', 'ckWalkWarn'); }
    else if (s.t === 'lane') { if (s.w < 2.75) add('bad', 'ckLaneBad'); else if (s.w < 3.0) add('warn', 'ckLaneNarrow'); else if (s.w > 3.5) add('warn', 'ckLaneWide'); }
    else if (s.t === 'bus' && s.w < 3.0) add('bad', 'ckBusBad');
    else if (s.t === 'park' && s.w < 2.0) add('bad', 'ckParkBad');
    else if (s.t === 'bike' && s.w < 1.2) add('bad', 'ckBikeBad');
    else if (s.t === 'track' && s.w < 1.5) add('bad', 'ckTrackBad');
    else if (s.t === 'median' && s.w < ISLAND_MIN) add('warn', 'ckMedianWarn');
    else if (s.t === 'island' && s.w < 2.0) add(s.w < ISLAND_MIN ? 'bad' : 'warn', 'ckIslandWarn');
  });
  const lanes = pf.segs.filter(s => s.t === 'lane'), n1 = lanes.filter(s => s.d > 0).length, n2 = lanes.length - n1;
  if (!lanes.length) out.push(['bad', t('ckNoLane')]);
  else if (!atCrossing) {
    if (Math.max(n1, n2) >= 2) out.push(['warn', t('ckMulti', Math.max(n1, n2))]);
    if (!n1 || !n2) out.push(['warn', t('ckOneWay')]);
  }
  return out;
}
// éléments à signaler : rang → 'bad' ou 'warn' (le plus grave l'emporte)
function profFlags(checks) {
  const m = new Map();
  for (const [l, , i] of checks) if (i !== undefined && (l === 'bad' || l === 'warn')) m.set(i, m.get(i) === 'bad' ? 'bad' : l);
  return m;
}

// parcours du piéton au droit du passage : suites d'éléments au niveau de la chaussée, séparées par un refuge d'au moins 1,50 m
function crossStages(segs) {
  const xs = []; let x = 0; for (const s of segs) { xs.push(x); x += s.w; }
  const runs = []; let cur = null;
  segs.forEach((s, i) => {
    const crossable = !SEG[s.t].raised || s.t === 'track' || ((s.t === 'median' || s.t === 'island') && !isRefuge(s));
    if (crossable) { if (!cur) cur = { xa: xs[i], w: 0 }; cur.w += s.w; cur.xb = xs[i] + s.w; }
    else if (cur) { runs.push(cur); cur = null; }
  });
  if (cur) runs.push(cur);
  return runs;
}

// profil au droit du passage pour une variante
function crossProfile(pf, id) {
  let segs = pf.segs.map(s => ({ ...s }));
  const notes = [];
  if (segs.some(s => s.t === 'park')) { segs = segs.map(s => s.t === 'park' ? { t: 'ext', w: s.w, d: 1 } : s); notes.push(['info', t('pfExt')]); }
  const fitWidth = () => {   // ajuste au gabarit disponible : pris sur les avancées puis sur les trottoirs, rendu aux trottoirs
    let over = profSum(segs) - pf.total;
    const take = (tp, wMin) => {   // à parts égales entre les éléments du type, sans descendre sous wMin
      for (let k = 0; k < 4 && over > 0.005; k++) {
        const ws = segs.filter(s => s.t === tp && s.w > wMin + 0.005);
        if (!ws.length) break;
        const share = over / ws.length;
        ws.forEach(s => { const d = Math.min(share, s.w - wMin); s.w -= d; over -= d; });
      }
    };
    take('ext', 0);
    segs = segs.filter(s => s.w > 0.005);
    if (over > 0.005) {
      const before = over;
      take('walk', 1.4);
      const wm = Math.min(...segs.filter(s => s.t === 'walk').map(s => s.w));
      if (before - over > 0.005) notes.push([wm < 2 ? 'warn' : 'info', t('pfTakeWalk', before - Math.max(0, over), wm)]);
    }
    if (over > 0.005) return over;
    const spare = -over, walks = segs.filter(s => s.t === 'walk' || s.t === 'ext');
    if (spare > 0.05 && walks.length) { walks.forEach(s => { s.w += spare / walks.length; }); notes.push(['info', t('pfWiden', spare)]); }
    return 0;
  };
  if (id === 'ret') {
    segs.forEach(s => { if (s.t === 'lane') s.w = P.retLane; });
    const med = segs.find(s => s.t === 'median' || s.t === 'island'), dirs = new Set(segs.filter(s => SEG[s.t].dir).map(s => s.d));
    if (med) { med.w = Math.max(med.w, P.retIsl); notes.push(['info', t('pfIslMed')]); }
    else if (dirs.size < 2) notes.push(['warn', t('pfOneWayNoIsl')]);
    else {
      let k = segs.findIndex((s, j) => j > 0 && SEG[s.t].dir && s.d < 0 && segs.slice(0, j).some(q => SEG[q.t].dir && q.d > 0));
      if (k < 0) k = Math.floor(segs.length / 2);
      segs.splice(k, 0, { t: 'island', w: P.retIsl, d: 1 });
      notes.push(['info', t('pfIslAdd', P.retIsl)]);
    }
    const miss = fitWidth();
    if (miss > 0) notes.push(['bad', t('pfIslShort', miss)]);
  } else if (id === 'chi') {
    segs.forEach(s => { if (s.t === 'lane') s.w = P.chLane; });
    const miss = fitWidth();
    if (miss > 0) notes.push(['bad', t('pfOver', miss)]);
    notes.push(['warn', t('pfChi')]);
  } else {
    if (id === 'plat' || id === 'trap') notes.push(['info', t('pfRaised')]);
    if (id === 'sig') notes.push(['info', t('pfSigNote')]);
  }
  const stages = crossStages(segs);
  const elem = profChecks({ total: pf.total, segs }, true).filter(x => x[2] !== undefined);
  return { segs, notes: notes.concat(elem, stageNotes(stages), lampNotes(segs)), stages, custom: false };
}
function lampNotes(segs) {
  const n = segs.filter(s => s.t === 'lamp').length;
  return [n === 0 ? ['warn', t('pfLampNone')] : n === 1 ? ['info', t('pfLampOne')] : ['ok', t('pfLampOk', n)]];
}
function stageNotes(stages) {
  if (stages.length >= 2) return [['ok', t('pfCrossLen', stages[0].w, stages[1].w)]];
  if (stages.length === 1) return [['info', t('pfCrossLen', stages[0].w)]].concat(stages[0].w > 9 ? [['warn', t('pfCrossLong')]] : []);
  return [];
}
// profil au droit du passage retenu pour une variante : celui de la commune s'il existe, sinon le profil calculé
function crossOf(id) {
  if (!CROSS[id]) return crossProfile(projProfile(), id);
  const segs = CROSS[id], stages = crossStages(segs);
  return { segs, stages, custom: true, notes: [['info', t('pfCustomNote')]].concat(profChecks({ total: PROF.total, segs }, true), stageNotes(stages), lampNotes(segs)) };
}

function reportDesign(id) {

// poteau d'éclairage : au bord du trottoir, côté chaussée, sur le trottoir le plus large qui n'en a pas encore ;

function placeLamp(segs) {
  const L0 = SEG.lamp.def;
  const cand = segs.map((s, i) => ({ s, i, side: segs.slice(i + 1).some(q => !SEG[q.t].raised) ? 1 : 0 }))
    .filter(c => c.s.t === 'walk')
    .map(c => ({ ...c, at: c.side ? c.i + 1 : c.i, has: segs[c.side ? c.i + 1 : c.i - 1] && segs[c.side ? c.i + 1 : c.i - 1].t === 'lamp' }));
  const free = cand.filter(c => !c.has), pool = free.length ? free : cand;
  if (!pool.length) { segs.push({ t: 'lamp', w: L0, d: 1 }); return; }
  const c = pool.reduce((a, x) => x.s.w > a.s.w ? x : a, pool[0]);
  if (c.s.w > L0 + 0.25) c.s.w = Math.round((c.s.w - L0) * 100) / 100;
  segs.splice(c.at, 0, { t: 'lamp', w: L0, d: 1 });
}

/* glisser-déposer à la souris (façon Streetmix) : on saisit un élément sur le dessin, sa carte, ou un élément de la palette ;
   la limite entre deux éléments la plus proche du pointeur est repérée et marquée ; au lâcher, l'élément y est placé */
const PD = { pend: null, on: false, src: null, ins: -1, x0: 0, y0: 0, ghost: null, noClick: false };
// limites entre éléments, en abscisses écran : sur le dessin (repère du SVG) et dans la rangée des cartes
function drawBounds() {
  const svg = $('#pf-draw svg'); if (!svg) return null;
  const m = svg.getScreenCTM(); if (!m) return null;
  const xs = [0]; for (const s of tabSegs(false)) xs.push(xs[xs.length - 1] + s.w);
  return xs.map(x => m.a * x * 100 + m.e);
}
function cardBounds() {
  const cs = [...document.querySelectorAll('#pf-segs .pseg')].map(c => c.getBoundingClientRect());
  if (!cs.length) return [];
  return [cs[0].left].concat(cs.slice(1).map((r, k) => (cs[k].right + r.left) / 2), [cs[cs.length - 1].right]);
}
const nearest = (bs, x) => bs.reduce((b, v, k) => Math.abs(v - x) < Math.abs(bs[b] - x) ? k : b, 0);
function pdMarkers(ins) {

const hashTok = location.hash.slice(1).split('-');
let startLang = LANGS.find(l => hashTok.includes(l)) || 'fr';
if (!LANGS.some(l => hashTok.includes(l))) { try { const s = localStorage.getItem('mv-lang'); if (LANGS.includes(s)) startLang = s; } catch (e) { /* stockage indisponible */ } }
setNumLocale(startLang);
lang = startLang;
document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
readColors();
viewMode = stripsEl.clientWidth >= 900 ? 'full' : 'zoom';
document.querySelectorAll('[data-view]').forEach(o => o.setAttribute('aria-pressed', String(o.dataset.view === viewMode)));
build();
for (let i = 0; i < PRERUN / DT; i++) for (const s of sims) s.step();   // dix minutes déjà simulées à l'ouverture
setLang(lang);
setView(viewMode);
if (hashTok.includes('presentation')) setCompact(true);
updateKpis(); clock();
startEvaluation();
requestAnimationFrame(frame);
// les vignettes 3D attendent three.js (chargé en différé)
// carte (Leaflet) et vignettes 3D (three.js) : bibliothèques chargées en différé
const onLibs = () => {
  try { initMap(); } catch (e) { $('#map').hidden = true; $('#map-msg').textContent = t('mapOffline'); }
  renderThumbs();
};
if (document.readyState === 'complete') onLibs(); else window.addEventListener('load', onLibs);

// accès console pour vérification
window.__mv = { prof: { get: () => PROF, proj: () => PROJ, cross: () => CROSS, PRESETS, presetProfile, crossProfile, crossOf, profChecks, crossStages, profileSVG }, stats: () => sims.map(s => ({ id: s.sc.id, ...stats(s) })), sims: () => sims, evalRes: () => evalRes, rec: () => evalRes && recommend(evalRes, scenarios), P: () => P,
  note: id => buildNote(id), setLang: l => setLang(l),
  site: (la, lo) => { if (MAP) MAP.setView([la, lo], 17); setPoint(la, lo); return analyseSite(); }, siteData: () => SITE, day: () => DAY };
})();
</script>
</body>
